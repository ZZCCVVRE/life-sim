<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
<meta name="theme-color" content="#05060b" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="人生模拟器" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="description" content="一款文字人生模拟器：天赋、抉择、八条世界线、五十二种结局。" />
<title>人生模拟器 · 重开一次</title>
<style>
:root{
  --gold:#e3b567; --gold-2:#f6dfb3; --gold-3:#9c7233;
  --text:#e9ebf3; --dim:#8b93ab; --dim2:#5f667a;
  --panel:rgba(255,255,255,.045); --line:rgba(255,255,255,.085);
  --charm:#ff7bb0; --int:#6fb4ff; --con:#5fd6a0; --home:#e3b567; --mood:#ff9f6b;
  --r1:#8b93ab; --r2:#5aa9ff; --r3:#e3b567;
}
*{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body{ height:100%; }
body{
  background:#05060b; color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  overscroll-behavior:none;
}
#app{
  position:relative; max-width:560px; margin:0 auto;
  height:100vh; height:100dvh;
  display:flex; flex-direction:column; overflow:hidden;
  background:
    radial-gradient(130% 65% at 50% -12%, rgba(96,116,190,.30), transparent 62%),
    radial-gradient(90% 50% at 88% 108%, rgba(150,94,60,.16), transparent 60%),
    linear-gradient(180deg,#0a0d18 0%,#070911 55%,#05060b 100%);
}
#app::after{
  content:''; position:absolute; inset:0; pointer-events:none;
  background:radial-gradient(120% 80% at 50% 40%, transparent 55%, rgba(0,0,0,.55) 100%);
}
.screen{
  position:absolute; inset:0; display:flex; flex-direction:column;
  opacity:0; pointer-events:none; transition:opacity .34s ease;
  z-index:1;
}
.screen.active{ opacity:1; pointer-events:auto; z-index:2; }

/* ---------- 通用 ---------- */
.btn{
  border:none; border-radius:14px; padding:14px 18px; font-size:16px; font-weight:700;
  font-family:inherit; cursor:pointer; min-height:50px;
  transition:transform .12s ease, filter .2s ease, background .2s ease, opacity .2s;
  display:inline-flex; align-items:center; justify-content:center; gap:6px;
}
.btn:active{ transform:scale(.972); }
.btn.primary{
  background:linear-gradient(180deg,var(--gold-2),var(--gold));
  color:#241a06; box-shadow:0 12px 32px -14px rgba(227,181,103,.95);
}
.btn.ghost{ background:var(--panel); color:var(--text); border:1px solid var(--line); }
.btn:disabled{ opacity:.38; cursor:default; }
.btn.wide{ width:100%; }
.dock{
  display:flex; gap:10px; padding:12px 16px calc(12px + env(safe-area-inset-bottom));
  border-top:1px solid var(--line); background:rgba(6,8,14,.82);
  backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
}
.dock .btn{ flex:1; }

/* ---------- 标题页 ---------- */
#scr-title{ align-items:center; justify-content:center; padding:26px 26px calc(26px + env(safe-area-inset-bottom)); text-align:center; overflow-y:auto; }
.eyebrow{
  font-size:11px; letter-spacing:.34em; color:var(--dim2); text-transform:uppercase; margin-bottom:18px;
}
.big-title{
  font-size:clamp(34px,11.6vw,56px); line-height:1.06; font-weight:900; letter-spacing:.08em;
  background:linear-gradient(180deg,#fff8ea 0%,#e9c07c 52%,#8f6a30 100%);
  -webkit-background-clip:text; background-clip:text; color:transparent;
  filter:drop-shadow(0 8px 30px rgba(227,181,103,.28));
}
.big-title em{ display:block; font-style:normal; font-size:.62em; letter-spacing:.3em; margin-top:6px; opacity:.72; }
.title-rule{
  display:flex; align-items:center; justify-content:center; gap:10px; margin:22px 0 18px;
}
.title-rule span{ height:1px; width:56px; background:linear-gradient(90deg,transparent,rgba(227,181,103,.6)); }
.title-rule span:last-child{ background:linear-gradient(270deg,transparent,rgba(227,181,103,.6)); }
.title-rule i{ width:5px; height:5px; transform:rotate(45deg); background:var(--gold); opacity:.8; }
.tagline{ font-size:14.5px; color:var(--dim); line-height:1.7; margin-bottom:36px; letter-spacing:.03em; }
#btnNew, #btnHistory{ width:100%; max-width:300px; }
#btnHistory{ margin-top:10px; }
.meta-line{ margin-top:18px; font-size:12.5px; color:var(--dim2); letter-spacing:.04em; }
.meta-line b{ color:var(--gold); font-weight:700; }
.title-extra{ margin-top:10px; display:flex; align-items:center; gap:8px; font-size:12px; color:var(--dim2); }
.title-extra .link-btn{ font-size:12px; }
.dot-sep{ opacity:.4; }
.daily-badge{
  display:none; margin-top:10px; font-size:11.5px; letter-spacing:.06em;
  color:#ffd9a0; border:1px solid rgba(227,181,103,.35); background:rgba(227,181,103,.08);
  border-radius:9px; padding:5px 10px;
}
.daily-badge.on{ display:inline-block; }

/* ---------- 开局设定 ---------- */
.setup{ width:100%; max-width:310px; margin:0 auto 20px; display:flex; flex-direction:column; gap:9px; }
.setup-row{ display:flex; align-items:center; gap:9px; }
.setup-label{ flex:0 0 30px; text-align:right; font-size:11.5px; color:var(--dim2); letter-spacing:.12em; }
.name-input{
  flex:1; min-width:0; height:44px; border-radius:11px; border:1px solid var(--line);
  background:rgba(255,255,255,.04); color:var(--text); font-family:inherit; font-size:15px;
  padding:0 12px; outline:none; text-align:center; letter-spacing:.08em;
  transition:border-color .2s, background .2s;
}
.name-input:focus{ border-color:rgba(227,181,103,.55); background:rgba(227,181,103,.07); }
.name-input::placeholder{ color:var(--dim2); }
.dice{
  flex:0 0 44px; height:44px; border-radius:11px; border:1px solid var(--line);
  background:rgba(255,255,255,.04); color:var(--dim); font-size:16px; cursor:pointer;
  font-family:inherit; transition:transform .12s, background .15s;
}
.dice:active{ transform:scale(.93); background:rgba(255,255,255,.09); }
.seg{ flex:1; display:flex; border:1px solid var(--line); border-radius:11px; overflow:hidden; }
.seg-btn{
  flex:1; height:42px; border:none; background:transparent; color:var(--dim);
  font-family:inherit; font-size:14px; font-weight:700; cursor:pointer; transition:.18s;
}
.seg-btn.on{ background:rgba(227,181,103,.16); color:var(--gold-2); }
.who{ font-size:11.5px; color:var(--dim2); letter-spacing:.1em; margin-bottom:3px; }
.who i{
  font-style:normal; color:#ff9d8a; border:1px solid rgba(255,157,138,.4);
  border-radius:5px; padding:1px 5px; margin-left:6px; font-size:10px; letter-spacing:.1em;
}
.entry.line .e-age{ color:#ff9d8a; }
.entry.plot{ border-left:2px solid rgba(176,160,255,.45); padding-left:10px; margin-left:2px; }
.entry.plot .e-text{ color:#ded4ff; }
.entry.plot .e-age{ color:#b0a0ff; }
.entry.sync{ border-left:2px solid rgba(110,200,255,.45); padding-left:10px; margin-left:2px; }
.entry.sync .e-text{ color:#c9ecff; }
.entry.sync .e-age{ color:#6ec8ff; }
.entry.legend{ border-left:2px solid rgba(227,181,103,.5); padding-left:10px; margin-left:2px; }
.entry.legend .e-text{ color:#ffe3b0; }
.entry.legend .e-age{ color:var(--gold); }
.entry.echo .e-age{ color:#8892b0; }
.entry.echo .e-text{ color:#c6cde0; }
.entry.echo{ border-left:2px solid rgba(150,170,220,.22); padding-left:10px; margin-left:2px; }
.entry.shift .e-text{ color:#ffd9a8; font-weight:600; }
.entry.shift .e-age{ color:var(--gold); }
.entry.win .e-text{ color:#8ff0b4; font-weight:700; }
.entry.win .e-age{ color:#8ff0b4; }
.pity-line{
  margin-top:9px; font-size:12px; letter-spacing:.1em; color:rgba(255,157,138,.8);
  display:none;
}
.pity-line.on{ display:block; }
.back-btn{
  background:none; border:none; color:var(--dim2); font-family:inherit; font-size:12.5px;
  letter-spacing:.1em; padding:0; margin-bottom:10px; cursor:pointer;
}
.back-btn:active{ color:var(--text); }
.exit-btn{ flex:0 0 56px !important; font-size:12.5px; padding:0 !important; color:var(--dim2); letter-spacing:.08em; }
.exit-btn.confirm{ color:#ff9d8a; border-color:rgba(255,157,138,.55); font-size:13px; letter-spacing:.06em; }
.end-links{ display:flex; justify-content:center; gap:20px; margin-top:24px; }
.title-row{ display:flex; gap:10px; width:100%; max-width:300px; margin-top:10px; }
.title-row .btn{ flex:1; font-size:14px; padding:12px 8px; }
.achv-list{ flex:1; min-height:0; overflow-y:auto; padding:4px 16px 20px; display:flex; flex-direction:column; gap:8px; }
.achv-item{ border:1px solid var(--line); background:var(--panel); border-radius:11px; padding:10px 12px; display:flex; justify-content:space-between; align-items:center; gap:10px; }
.achv-item.on{ border-color:rgba(227,181,103,.45); background:rgba(227,181,103,.08); }
.achv-name{ font-size:14px; font-weight:700; }
.achv-desc{ font-size:11.5px; color:var(--dim); margin-top:3px; }
.achv-item.lock .achv-name{ color:var(--dim2); }
.achv-mark{ font-size:13px; color:var(--dim2); }
.achv-item.on .achv-mark{ color:var(--gold-2); }
.storage-warn{
  display:none; margin-top:12px; max-width:300px; font-size:11.5px; line-height:1.7;
  color:rgba(255,157,138,.85); border:1px solid rgba(255,157,138,.3);
  background:rgba(255,157,138,.07); border-radius:10px; padding:8px 11px;
}
.storage-warn.on{ display:block; }.review-head{
  padding:calc(12px + env(safe-area-inset-top)) 16px 11px;
  border-bottom:1px solid var(--line); background:rgba(8,10,18,.85);
}
.review-title{ font-size:19px; font-weight:800; letter-spacing:.02em; margin-top:4px; }
.review-meta{ font-size:12px; color:var(--dim); margin-top:4px; letter-spacing:.04em; }
.review-body{ flex:1; min-height:0; overflow-y:auto; padding:14px 16px 24px; -webkit-overflow-scrolling:touch; }
#btnReview{ flex:1.2 !important; font-size:14px; }
#btnAgain, #btnHome{ font-size:14px; }
#btnHome{ flex:0.8 !important; }
.tabs{ display:flex; gap:8px; margin-top:10px; }
.tab{
  flex:1; font-size:13px; padding:8px 0; border-radius:9px; cursor:pointer;
  border:1px solid var(--line); background:rgba(255,255,255,.03);
  color:var(--dim); font-family:inherit; letter-spacing:.08em;
}
.tab.on{ color:#241a0c; background:linear-gradient(180deg,#f0cd8a,#dcae62); border-color:transparent; font-weight:700; }

/* ---------- 天赋页 ---------- */
.page-head{ padding:calc(16px + env(safe-area-inset-top)) 18px 10px; }
.page-head .kicker{ font-size:11px; letter-spacing:.28em; color:var(--dim2); }
.page-head h2{ font-size:23px; font-weight:800; margin-top:6px; letter-spacing:.02em; }
.page-head p{ font-size:12.5px; color:var(--dim); margin-top:7px; line-height:1.6; }
.tgrid{
  flex:1; min-height:0; overflow-y:auto; display:grid; grid-template-columns:1fr 1fr;
  gap:9px; padding:6px 14px 14px; align-content:start; -webkit-overflow-scrolling:touch;
}
.tcard{
  position:relative; border-radius:14px; padding:11px 12px 12px 14px;
  background:var(--panel); border:1px solid var(--line);
  transition:background .18s, border-color .18s, transform .12s, box-shadow .18s;
  overflow:hidden; min-height:96px; display:flex; flex-direction:column;
}
.tcard:active{ transform:scale(.98); }
.tcard::before{
  content:''; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--r1); opacity:.85;
}
.tcard.r2::before{ background:var(--r2); }
.tcard.r3::before{ background:var(--r3); }
.tcard .tn{ font-size:15px; font-weight:800; letter-spacing:.02em; display:flex; align-items:center; gap:5px; }
.tcard .td{ font-size:12px; line-height:1.55; color:var(--dim); margin-top:6px; flex:1; }
.tcard .rr{ font-size:9.5px; letter-spacing:.16em; color:var(--r1); margin-top:9px; font-weight:700; }
.tcard.r2 .rr{ color:var(--r2); }
.tcard.r3 .rr{ color:var(--r3); }
.tcard.sel{
  background:rgba(227,181,103,.10); border-color:rgba(227,181,103,.62);
  box-shadow:0 0 0 1px rgba(227,181,103,.38) inset, 0 10px 26px -14px rgba(227,181,103,.9);
}
.tcard .chk{
  position:absolute; top:9px; right:9px; width:17px; height:17px; border-radius:50%;
  border:1.5px solid rgba(255,255,255,.22); display:flex; align-items:center; justify-content:center;
  font-size:10px; color:transparent; transition:.18s;
}
.tcard.sel .chk{ background:var(--gold); border-color:var(--gold); color:#231a06; }
.tcard.shake{ animation:shake .3s; }
@keyframes shake{ 0%,100%{transform:translateX(0)} 25%{transform:translateX(-4px)} 75%{transform:translateX(4px)} }

/* ---------- 属性页 ---------- */
.alloc-wrap{ flex:1; min-height:0; overflow-y:auto; padding:8px 18px 18px; }
.stat-block{ margin-bottom:28px; }
.stat-line{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:9px; }
.stat-name{ font-size:15px; font-weight:700; letter-spacing:.06em; }
.stat-name small{ font-size:10.5px; color:var(--dim2); font-weight:400; letter-spacing:.1em; margin-left:7px; }
.stat-val{ font-size:22px; font-weight:800; font-variant-numeric:tabular-nums; }
.stat-ctl{ display:flex; align-items:center; gap:10px; }
.step{
  flex:0 0 34px; height:34px; border-radius:10px; border:1px solid var(--line);
  background:var(--panel); color:var(--text); font-size:19px; font-weight:600; line-height:1;
  cursor:pointer; font-family:inherit; transition:.12s;
}
.step:active{ transform:scale(.92); background:rgba(255,255,255,.1); }
.step:disabled{ opacity:.25; }
.track{ flex:1; height:11px; border-radius:6px; background:rgba(255,255,255,.06); overflow:hidden; }
.fill{ height:100%; border-radius:6px; width:0; transition:width .18s ease; }
.pts-badge{ text-align:center; font-size:13px; color:var(--dim); margin:2px 0 22px; letter-spacing:.06em; }
.pts-badge b{ font-size:22px; color:var(--gold); font-weight:800; margin:0 3px; font-variant-numeric:tabular-nums; }

/* ---------- 人生页 ---------- */
.life-head{ padding:calc(12px + env(safe-area-inset-top)) 16px 11px; border-bottom:1px solid var(--line); background:rgba(8,10,18,.66); }
.life-top{ display:flex; align-items:baseline; justify-content:space-between; }
.age-big{ font-size:27px; font-weight:900; letter-spacing:.02em; font-variant-numeric:tabular-nums; }
.age-big span{ font-size:13px; color:var(--dim); font-weight:600; margin-left:4px; }
.mini{ display:flex; gap:11px; margin-top:9px; font-size:12px; font-variant-numeric:tabular-nums; overflow:hidden; }
.mini i{ font-style:normal; opacity:.62; margin-right:3px; }
.mini b{ font-weight:700; }
.log{ flex:1; min-height:0; overflow-y:auto; padding:14px 16px 24px; -webkit-overflow-scrolling:touch; }
.entry{ display:flex; gap:11px; padding:6px 0; animation:rise .34s ease both; }
@keyframes rise{ from{ opacity:0; transform:translateY(7px); } to{ opacity:1; transform:none; } }
.e-age{
  flex:0 0 34px; text-align:right; font-size:11.5px; color:var(--dim2); padding-top:4px;
  font-variant-numeric:tabular-nums; letter-spacing:.02em;
}
.e-body{ flex:1; min-width:0; }
.e-text{ font-size:15px; line-height:1.66; color:#dde1ec; letter-spacing:.012em; }
.e-eff{ display:flex; flex-wrap:wrap; gap:5px; margin-top:6px; }
.e-eff span{ font-size:11px; padding:2px 7px; border-radius:6px; background:rgba(255,255,255,.055); color:var(--dim); }
.e-eff .up{ color:#7ee0a9; background:rgba(95,214,160,.10); }
.e-eff .down{ color:#ff8f8f; background:rgba(255,110,110,.10); }
.entry.birth .e-text{ color:var(--gold-2); }
.entry.ms .e-text{ color:#cfe0ff; font-weight:600; }
.entry.ms .e-age{ color:#7f9fd0; }
.entry.death .e-text{ color:#ff8f8f; font-weight:600; }
.entry.death .e-age{ color:#ff8f8f; }
.entry.gain .e-text{ color:#ffe3a8; }

/* ---------- 结算页 ---------- */
.end-wrap{ flex:1; min-height:0; overflow-y:auto; padding:calc(26px + env(safe-area-inset-top)) 20px calc(20px + env(safe-area-inset-bottom)); }
.rip{ font-size:12px; letter-spacing:.36em; color:var(--dim2); text-align:center; }
.cause{ text-align:center; font-size:17px; font-weight:700; margin-top:12px; color:#ffb4b4; }
.lifespan{ text-align:center; font-size:13px; color:var(--dim); margin-top:7px; }
.score-big{ text-align:center; font-size:64px; font-weight:900; line-height:1; margin-top:22px;
  background:linear-gradient(180deg,#fff6e2,#e3b567 60%,#8f6a30); -webkit-background-clip:text; background-clip:text; color:transparent;
  filter:drop-shadow(0 6px 26px rgba(227,181,103,.3)); font-variant-numeric:tabular-nums; }
.score-lab{ text-align:center; font-size:11px; letter-spacing:.3em; color:var(--dim2); margin-top:8px; }
.rank{ text-align:center; font-size:21px; font-weight:800; margin-top:16px; letter-spacing:.12em; color:var(--gold-2); }
.rank-desc{ text-align:center; font-size:13.5px; color:var(--dim); margin-top:10px; line-height:1.7; padding:0 6px; }
.sec-title{ font-size:11px; letter-spacing:.26em; color:var(--dim2); margin:26px 0 11px; }
.stat-final{ display:flex; flex-direction:column; gap:9px; }
.sf-row{ display:flex; align-items:center; gap:10px; font-size:12.5px; }
.sf-row .n{ flex:0 0 30px; color:var(--dim); }
.sf-row .bar{ flex:1; height:7px; border-radius:4px; background:rgba(255,255,255,.06); overflow:hidden; }
.sf-row .bar i{ display:block; height:100%; border-radius:4px; }
.sf-row .v{ flex:0 0 26px; text-align:right; font-weight:700; font-variant-numeric:tabular-nums; }
.chips{ display:flex; flex-wrap:wrap; gap:7px; }
.chip{ font-size:12px; padding:6px 10px; border-radius:9px; background:var(--panel); border:1px solid var(--line); color:#cfd5e6; }
.chip.gold{ border-color:rgba(227,181,103,.4); color:var(--gold-2); background:rgba(227,181,103,.09); }
.chip.dim{ color:var(--dim2); }
.end-actions{ display:flex; gap:10px; margin-top:26px; }
.end-actions .btn{ flex:1; }


.link-btn{
  background:none; border:none; color:var(--dim); font-family:inherit; font-size:12.5px;
  letter-spacing:.1em; margin-top:14px; cursor:pointer; text-decoration:underline;
  text-underline-offset:4px; text-decoration-color:rgba(255,255,255,.18);
}
.next-btn{ flex:1.7 !important; font-size:17px; letter-spacing:.06em; }
.line-row{ display:flex; flex-wrap:wrap; gap:6px; margin-top:12px; }
.line-chip{
  font-size:11.5px; padding:4px 9px; border-radius:8px; letter-spacing:.04em;
  border:1px solid var(--line); background:var(--panel); color:var(--dim2);
}
.line-chip.on{ color:var(--gold-2); border-color:rgba(227,181,103,.45); background:rgba(227,181,103,.10); }
.hist-list{ flex:1; min-height:0; overflow-y:auto; padding:4px 16px 16px; display:flex; flex-direction:column; gap:9px; }
.hist-item{ border:1px solid var(--line); background:var(--panel); border-radius:13px; padding:12px 13px; }
.hist-top{ display:flex; justify-content:space-between; align-items:baseline; gap:10px; }
.hist-name{ font-size:14.5px; font-weight:700; }
.hist-score{ font-size:21px; font-weight:800; color:var(--gold-2); font-variant-numeric:tabular-nums; }
.hist-meta{ font-size:12px; color:var(--dim); margin-top:5px; line-height:1.6; }
.hist-date{ font-size:10.5px; color:var(--dim2); letter-spacing:.1em; }
.hist-foot{ display:flex; justify-content:space-between; align-items:center; gap:10px; margin-top:8px; }
.hist-foot .link-btn{ font-size:12px; padding:4px 0; }
.hist-empty{ text-align:center; color:var(--dim2); font-size:13px; padding:48px 0; }
/* ---------- 抉择弹层 ---------- */
.sheet{
  position:fixed; inset:0; z-index:60; display:flex; align-items:flex-end; justify-content:center;
  background:rgba(3,5,10,0); pointer-events:none; transition:background .25s ease;
}
.sheet.on{ background:rgba(3,5,10,.66); pointer-events:auto; }
.sheet-card{
  width:100%; max-width:560px; border-radius:22px 22px 0 0;
  padding:18px 16px calc(16px + env(safe-area-inset-bottom));
  background:linear-gradient(180deg,#141a2c,#0b0f1a 72%);
  border:1px solid rgba(227,181,103,.28); border-bottom:none;
  box-shadow:0 -24px 70px -24px rgba(0,0,0,.95);

  { id: 'z13', a: [38, 55], t: '你资助了一个山区的学生，收到他寄来的信，信上写着"谢谢您"。', e: { mood: 3, home: -1 } },
  { id: 'z14', a: [38, 55], t: '同学会上，当年最不起眼的那个人开着一辆你叫不出名字的车来。', e: { mood: -1 } },
  { id: 'z15', a: [40, 55], c: function (s) { return s.stats.int >= 14; }, t: '你参与创办的公司上市了，敲钟那天你站在第一排。', e: { home: 8, mood: 3 } },
  { id: 'zf1', a: [48, 70], t: '父亲走了。走之前他把那套工具擦了一遍，螺丝刀按大小排好，最上面压着一张纸条：别扔。', e: { mood: -4 }, bad: 1 },
  { id: 'z16', a: [38, 55], c: function (s) { return s.flags.married; }, w: 0.02, f: function (s) {
      s.flags.married = false;
      s.flags.divorced = true;
      return { t: '你离婚了。分割财产那天，你们连吵架的力气都没有了。', e: { mood: -4, home: -2 }, bad: 1 };
  } },
  { id: 'z17', a: [42, 55], c: function (s) { return !s.flags.married; }, t: '你重新开始约会，发现这个世界已经变得你不认识了。', e: { mood: 1 } },
  { id: 'z18', a: [36, 50], t: '你减掉了二十斤，以前的裤子又能穿上了，你高兴得像个孩子。', e: { con: 2, charm: 1, mood: 2 } },
  { id: 'z19', a: [40, 55], c: function (s) { return s.stats.int >= 13; }, t: '你成了行业里的大牛，开始有人专程来听你讲话。', e: { int: 2, home: 2, mood: 2 } },
  { id: 'z20', a: [38, 52], c: function (s) { return s.children >= 1; }, t: '你的孩子进入叛逆期，把房门摔得震天响，你站在门外一句话都说不出来。', e: { mood: -2 } },

  /* ===== 中老年 56+ ===== */
  { id: 'o01', a: [58, 62], c: function (s) { return !s.flags.retired; }, f: function (s) {
      s.flags.retired = true;
      return { t: '你办了退休手续。走出单位大门那天，天特别蓝，你站了很久。', e: { mood: 2 } };
  } },
  { id: 'o02', a: [58, 90], rep: true, t: '你每天早上在公园打太极，认识了几个棋友，日子慢了下来。', e: { con: 1, mood: 1 } },
  { id: 'o03', a: [58, 85], c: function (s) { return s.children >= 1; }, f: function (s) {
      if (s.flags.grand) return null;
      s.flags.grand = true;
      return { t: '你抱上了孙子，笑得合不拢嘴，逢人就掏出手机给人看照片。', e: { mood: 4 } };
  } },
  { id: 'o04', a: [65, 90], c: function (s) { return s.flags.married; }, f: function (s) {
      if (s.flags.widowed) return null;
      s.flags.widowed = true; s.flags.married = false;
      return { t: '老伴先走了。房子突然变得很大，安静得可怕。', e: { mood: -5 }, bad: 1 };
  } },
  { id: 'o05', a: [60, 90], t: '你被查出重病，做了一场大手术，在病床上躺了两个月。', e: { con: -3, mood: -2 }, bad: 1 },
  { id: 'o06', a: [60, 85], c: function (s) { return s.children >= 1; }, t: '你搬到孩子家附近，每天接送孙辈上下学，重新学会了系红领巾。', e: { mood: 2 } },
  { id: 'o07', a: [62, 90], t: '你开始写回忆录，写到第三页就趴在桌上睡着了。', e: { mood: 1, int: 1 } },
  { id: 'o08', a: [60, 90], t: '你学会了用智能手机，在家族群里转发养生文章，没人回复你也照发。', e: { mood: 1 } },
  { id: 'o09', a: [65, 95], rep: true, t: '老友一个接一个地走了，你成了那个总被留下的。', e: { mood: -2 }, bad: 1 },
  { id: 'o10', a: [62, 90], t: '你回到小时候住的地方，发现整条街都拆了，连一棵树都没剩。', e: { mood: -1 } },
  { id: 'o11', a: [60, 95], rep: true, t: '你每天下午在小区门口下棋，赢多输少，输的时候就说"让着你"。', e: { mood: 1, int: 1 } },
  { id: 'o12', a: [65, 95], t: '你把毕生积蓄捐给了母校，署名只有两个字。', e: { home: -4, mood: 3 } },
  { id: 'o13', a: [60, 95], t: '你在阳台上种满了花，邻居路过都要停下来看一眼。', e: { mood: 2 } },
  { id: 'o14', a: [62, 90], c: function (s) { return s.stats.charm >= 8; }, t: '你随手拍的一条短视频火了，评论区叫你"最优雅的奶奶/爷爷"。', e: { charm: 2, mood: 2, home: 1 } },
  { id: 'o15', a: [58, 80], t: '你成了广场舞领队，掌握了整个小区最核心的资源。', e: { charm: 1, mood: 2, con: 1 } },
  { id: 'o16', a: [70, 99], t: '你开始忘事，出门常常走回头路检查门锁，孩子们开始担心你。', e: { int: -2, mood: -1 }, bad: 1 },
  { id: 'o17', a: [65, 95], t: '你被评为"社区之星"，照片贴在公告栏里，你每天路过都要看一眼。', e: { mood: 2 } },

  /* ===== 奇遇（任何年龄） ===== */
  { id: 'x01', a: [6, 80], w: 0.05, t: '你被一道闪电击中，居然毫发无伤，只是头发竖了三天。', e: { con: -2, int: 1, mood: 1 } },
  { id: 'x02', a: [6, 70], w: 0.05, t: '你捡到一只受伤的猫头鹰，养了半年，它某天早上自己飞走了。', e: { mood: 2 } },
  { id: 'x03', a: [10, 70], w: 0.05, t: '你在旧书摊淘到一本手抄本，扉页上写着一行你始终没看懂的字。', e: { int: 1, mood: 1 } },
  { id: 'x04', a: [10, 80], w: 0.05, t: '你梦见另一个自己，他过得比你还差。你醒来后莫名心情很好。', e: { mood: 2 } },
  { id: 'x05', a: [16, 40], w: 0.04, c: function (s) { return s.stats.charm >= 12; }, t: '有星探在街上叫住你，问你要不要出道。你留了电话，然后没有下文。', e: { mood: 2, charm: 1 } },
  { id: 'x06', a: [16, 60], w: 0.05, t: '你在网上发的一条视频突然爆火，评论区都在问你下文。', e: { charm: 2, home: 2, mood: 2 } },
  { id: 'x07', a: [8, 70], w: 0.03, t: '你被"外星人拜访"了一次。醒来只记得一片白光，和一种很吵的声音。', e: { mood: 1, int: -1 } },
  { id: 'x08', a: [25, 60], w: 0.04, t: '你十年前买的一只股票停牌至今，复牌那天翻了十倍。', e: { home: 6, mood: 3 } },
  { id: 'x09', a: [18, 60], w: 0.04, t: '你救了一个落水的孩子，上了本地新闻，孩子父母给你送了面锦旗。', e: { mood: 3, charm: 1 } },
  { id: 'x10', a: [18, 70], w: 0.05, t: '你在天桥上遇到一位算命先生，他说你命里有贵人，收了你五十块。', e: { home: -1, mood: 2 } },
  { id: 'x11', a: [15, 60], w: 0.04, t: '你的一张旧照片被人做成了表情包，在群里流传，你哭笑不得。', e: { mood: 1, charm: 1 } },
  { id: 'x12', a: [30, 70], w: 0.05, t: '你被误诊了一场重病，拿到复查结果那天，你在医院门口站了很久。', e: { mood: 2 } },
  { id: 'x13', a: [6, 80], w: 0.05, t: '一只流浪狗跟着你回了家，从此变成了你的家人。', e: { mood: 2 } },
  { id: 'x14', a: [16, 70], w: 0.04, t: '你在商场抽奖中了头奖，一台冰箱。你一个人住，用得着。', e: { home: 1, mood: 2 } },

  /* ===== 生活日常（扩充） ===== */
  { id: 'n01', a: [6, 70], t: '你搬家了。收拾行李时翻出一堆早就忘了的东西，每一件都能想起一个人。', e: { mood: 1 } },
  { id: 'n02', a: [18, 50], t: '你考了驾照。第一次上路把油门当成刹车，好在挂的是空挡。', e: { con: 1, mood: 1 } },
  { id: 'n03', a: [22, 50], t: '亲戚来借钱，说下个月就还。三年后他换了车，绝口不提这事。', e: { home: -2, mood: -2 }, bad: 1 },
  { id: 'n04', a: [22, 45], t: '过年被追问工资和对象，你笑着说了个数字，一桌人都不信。', e: { mood: -1 } },
  { id: 'n05', a: [25, 60], boost: 'night', t: '你开始失眠。凌晨三点刷手机，看别人的人生，越看越睡不着。', e: { con: -1, mood: -1 }, bad: 1 },
  { id: 'n06', a: [30, 60], t: '体检报告出来了，医生皱着眉说："问题不大，但要注意。"', e: { con: -1 } },
  { id: 'n07', a: [8, 80], t: '一场台风过境，你家阳台的花盆飞了，楼下的人骂了半个小时。', e: { mood: -1 } },
  { id: 'n08', a: [10, 80], t: '小区停电一整晚，你和邻居在楼下聊天，聊到很晚才想起来要回家。', e: { mood: 2, charm: 1 } },
  { id: 'n09', a: [23, 45], t: '团建去了郊区的农家乐，你被推上去表演节目，唱了一首跑调的歌。', e: { mood: 1, charm: 1 } },
  { id: 'n10', a: [23, 50], t: '你连续加班到凌晨，终于把项目送上线，然后重感冒了一场。', e: { home: 1, con: -2 }, bad: 1 },
  { id: 'n11', a: [24, 50], t: '你涨薪了，涨幅刚好覆盖房租的涨幅。你算了算，等于没涨。', e: { home: 1, mood: -1 } },
  { id: 'n12', a: [18, 70], t: '你去了一个很远的地方旅行，在陌生的街上走了很久，谁也不认识你。', e: { mood: 2, int: 1, home: -1 } },
  { id: 'n13', a: [16, 40], t: '你抢到了演唱会门票，在现场喊到失声，第二天说话像砂纸。', e: { mood: 3, con: -1 } },
  { id: 'n14', a: [20, 45], t: '你被朋友拉去蹦极，在台上腿抖了十分钟，最后还是跳了。', e: { con: 1, mood: 2 } },
  { id: 'n15', a: [20, 70], t: '你种的绿萝长得很好，你开始相信自己有一点园艺天赋。', e: { mood: 1 } },
  { id: 'n16', a: [15, 45], t: '你打游戏上了最高段位，截图发朋友圈，只有三个人点赞，其中一个是你小号。', e: { mood: 2 } },
  { id: 'n17', a: [18, 50], t: '你抽卡出了金，在群里连发十几个感叹号，没人理你。', e: { mood: 2, home: -1 } },
  { id: 'n18', a: [18, 60], t: '你的手机丢了，里面有一万张照片。你难过的不是手机。', e: { home: -1, mood: -2 }, bad: 1 },
  { id: 'n19', a: [25, 55], t: '你在地铁上遇到了前任，你们互相点了个头，然后各自下车。', e: { mood: -1 } },
  { id: 'n20', a: [25, 50], t: '老同学结婚，你随了份子钱，吃了顿没吃饱的酒席，还抽空和新人合了影。', e: { home: -1, mood: 1 } },
  { id: 'n21', a: [30, 60], t: '父母退休了，开始每天给你转发养生文章，你不看也回"收到"。', e: { mood: 1 } },
  { id: 'n22', a: [35, 60], c: function (s) { return s.children >= 1; }, t: '孩子上小学，你第一次在家长群里发言，紧张得像面试。', e: { mood: 1 } },
  { id: 'n23', a: [28, 50], t: '房贷利率降了，你算了半天，发现每个月能省两杯奶茶钱。', e: { home: 1 } },
  { id: 'n24', a: [30, 60], t: '你住院一周，出院那天站在医院门口，觉得阳光特别好。', e: { con: -1, mood: 2 }, bad: 1 },
  { id: 'n25', a: [30, 60], t: '你戒了烟，靠的是每天嚼两包口香糖，腮帮子都发达了。', e: { con: 2, mood: -1 } },
  { id: 'n26', a: [20, 60], t: '你开始跑步，第一次跑了八百米就喘得像风箱，但你坚持下来了。', e: { con: 1 } },
  { id: 'n27', a: [20, 50], t: '你报了个英语班，学了三周，现在能听懂机场广播了。', e: { int: 1 } },
  { id: 'n28', a: [40, 70], t: '你把这些年的照片整理了一遍，发现自己笑得越来越少。', e: { mood: -1, int: 1 } },

  /* ===== 无厘头 ===== */
  { id: 'n29', a: [10, 70], w: 0.35, t: '你养的那盆多肉突然开口说话，问你今天几号。你回答了，它说"谢谢"，然后再也没动过。', e: { mood: 2, int: 1 } },
  { id: 'n30', a: [20, 60], w: 0.3, t: '你在电梯里遇到十年后的自己。他让你千万别买那支股票，然后电梯门开了，他不见了。', e: { int: 1, mood: 1 } },
  { id: 'n31', a: [25, 60], w: 0.3, t: '你的猫开始替你回复工作消息，语气比你礼貌得多，领导居然很满意。', e: { mood: 2, home: 1 } },
  { id: 'n32', a: [15, 60], w: 0.3, t: '你买的二手书里夹着一张手绘藏宝图，终点是你家楼下的便利店。', e: { mood: 2 } },
  { id: 'n33', a: [10, 60], w: 0.3, t: '小区里出现一只会算数的鹦鹉，它算对了你出的题，然后头也不回地飞走了。', e: { int: 1, mood: 1 } },
  { id: 'n34', a: [20, 70], w: 0.25, t: '你梦见自己是一只蟑螂，醒来后花了一分钟确认自己不是。', e: { mood: 1 } },
  { id: 'n35', a: [20, 70], w: 0.25, t: '你的影子慢了半拍。你停下来等它，它也在等你，就是慢半拍。', e: { mood: -1, int: 1 } },
  { id: 'n36', a: [20, 70], w: 0.25, t: '你的手机自动下载了一个不存在的 App，打开后只有一行字："进度 3%。"', e: { mood: -1, int: 1 } },
  { id: 'n37', a: [20, 70], w: 0.2, t: '你在街上看到一个和你长得一模一样的人，{ta}也看见了你，你们都加快了脚步。', e: { mood: -1, int: 1 } },
  { id: 'n38', a: [20, 70], w: 0.2, t: '电视突然开始播放你的一生，进度条显示已加载 87%。你伸手关掉了它。', e: { mood: 1, int: 1 } },
  { id: 'n39', a: [15, 70], w: 0.2, t: '你许的愿应验了，但方式不太对：你想长高，于是摔了一跤，在床上被牵引拉长了三厘米。', e: { con: -1, mood: 2 } },

  /* ===== 性别相关的日常 ===== */
  { id: 'g01', a: [16, 35], c: function (s) { return s.gender === 'f'; }, t: '亲戚围着你说："女孩子读那么多书干什么，早点找个人嫁了。"你笑着把饭吃完，回房间关上了门。', e: { mood: -2 }, bad: 1 },
  { id: 'g02', a: [14, 50], c: function (s) { return s.gender === 'f'; }, t: '生理期疼得直不起腰，你还在会议室里把这周的方案讲完了。', e: { con: -1, mood: -1 } },
  { id: 'g03', a: [22, 40], c: function (s) { return s.gender === 'f'; }, t: '客户管你叫"小姑娘"，问你们负责人什么时候到。你说我就是。', e: { mood: -1, int: 1 } },
  { id: 'g04', a: [8, 40], c: function (s) { return s.gender === 'm'; }, t: '你摔破了膝盖，哭了一声，被人说"男孩子不能哭"。从那以后你很少当着人哭。', e: { mood: -2 }, bad: 1 },
  { id: 'g05', a: [24, 50], c: function (s) { return s.gender === 'm'; }, t: '你被拉去陪客户应酬，喝到吐，签下了一单，第二天胃疼得起不来。', e: { home: 1, con: -1 } },
  { id: 'g06', a: [20, 45], c: function (s) { return s.gender === 'm'; }, t: '搬东西的时候所有人都在喊"你是男的，你上"，你一个人扛完了三层楼。', e: { con: 1, mood: -1 } },
  { id: 'g07', a: [28, 42], c: function (s) { return s.gender === 'f' && s.children >= 1; }, t: '产假结束回到公司，你发现自己的位置已经有人坐了，工位被挪到了打印机旁边。', e: { home: -1, mood: -2 }, bad: 1 },
  { id: 'g08', a: [28, 45], c: function (s) { return s.gender === 'm' && s.children >= 1; }, t: '你抱着孩子在小区里散步，被邻居问："今天妈妈不在家？"你说我会带孩子。', e: { mood: -1, charm: 1 } },
  { id: 'g09', a: [26, 45], c: function (s) { return s.gender === 'f'; }, t: '领导夸你"比男的还能干"，你不知道该不该高兴，只好说了句谢谢。', e: { mood: -1, home: 1 } },
  { id: 'g10', a: [26, 50], c: function (s) { return s.gender === 'm'; }, t: '你发现自己的酒量成了核心竞争力，这让你有点难过，但你还是举起了杯。', e: { home: 2, con: -1 } },

  /* ===== 日常 · 第二批 ===== */
  { id: 'nn01', a: [18, 60], t: '你第一次坐飞机，全程抓着扶手。落地时手心全是汗，旁边的阿姨递给你一张纸巾。', e: { mood: 1, con: -1 } },
  { id: 'nn02', a: [23, 55], t: '公司年会你抽中了一等奖，一台空气炸锅。你其实更想要那个现金红包。', e: { home: 1, mood: 1 } },
  { id: 'nn03', a: [20, 60], t: '你养了三年的仙人掌死了。你给它办了个小型葬礼，埋在楼下的花坛里。', e: { mood: -1 } },
  { id: 'nn04', a: [16, 45], t: '你开始学吉他。三个月后你只会一首歌，但你每次弹都很投入。', e: { mood: 2, int: 1 } },
  { id: 'nn05', a: [25, 55], t: '你在超市遇到前同事。你们都看见了对方，同时转向了另一个货架。', e: { mood: -1 } },
  { id: 'nn06', a: [22, 60], t: '你被拉进了一个家族群，从此每天早上六点收到十几条"早安"。', e: { mood: 1 } },
  { id: 'nn07', a: [22, 55], t: '你第一次自己换灯泡，站在椅子上腿一直在抖。换完你觉得自己无所不能。', e: { mood: 2, con: 1 } },
  { id: 'nn08', a: [24, 50], t: '你参加朋友的婚礼，被安排在一桌谁也不认识的人中间。你吃了两小时，说了三句话。', e: { mood: 1 } },
  { id: 'nn09', a: [25, 60], t: '你在地摊上买了个"古董"，回家翻过来，底下印着 MADE IN 2023。', e: { home: -1, mood: 2 } },
  { id: 'nn10', a: [22, 45], t: '你开始记账，坚持了十一天。第十二天你买了一双鞋，然后卸载了那个 App。', e: { home: -1, mood: 1 } },
  { id: 'nn11', a: [16, 50], t: '你把自己关在房间里打了一天游戏。出门时天黑了，你不知道自己饿不饿。', e: { mood: 1, con: -1 } },
  { id: 'nn12', a: [18, 50], t: '你妈把你小时候的衣服捐了。你找一件旧外套找了三天，最后在垃圾桶边找到。', e: { mood: -1 } },
  { id: 'nn13', a: [30, 70], t: '你在公园看两个老头下棋，站了半小时。回家路上你买了一副象棋。', e: { mood: 2, int: 1 } },
  { id: 'nn14', a: [25, 55], t: '你第一次自己做年夜饭，八道菜有六道咸了。全家都吃完了，还说好吃。', e: { mood: 3, home: -1 } },
  { id: 'nn15', a: [25, 50], t: '你收到一封手写信，拆开发现是银行催款。字迹很工整，像在嘲讽你。', e: { home: -1, mood: -2 }, bad: 1 },
  { id: 'nn16', a: [20, 60], t: '你开始养多肉。死了三盆，活下来一盆，你把它当成了人生赢家。', e: { mood: 1, con: 1 } },
  { id: 'nn17', a: [18, 55], boost: 'night', t: '深夜十一点，你点了一份炸鸡。吃完那一口，你觉得人生还是值得的。', e: { mood: 2, con: -1 } },
  { id: 'nn18', a: [22, 50], t: '你第一次学会说"不"。说完手心全是汗，但那天晚上你睡得特别好。', e: { mood: 2, int: 1 } },
  { id: 'nn19', a: [20, 55], t: '你被困在电梯里四十分钟，和一个陌生人聊完了彼此的一生。', e: { mood: 2, charm: 1 } },
  { id: 'nn20', a: [20, 50], t: '你换了新手机，旧的那台一直没扔。你偶尔会开机，看看里面的照片。', e: { mood: 1 } },
  { id: 'nn21', a: [30, 55], t: '同学聚会上，大家聊的都是房子和孩子。你插不上话，就一直给人倒茶。', e: { mood: -1 } },
  { id: 'nn22', a: [25, 55], t: '你决定早睡。坚持了两天，第三天凌晨两点还在刷手机。', e: { con: -1, mood: 1 } },
  { id: 'nn23', a: [18, 60], t: '一只猫在路边跟了你三条街。你蹲下来，它就不走了。', e: { mood: 2 } },
  { id: 'nn24', a: [25, 55], t: '你去看了一场话剧，中场睡着了。散场时你跟着鼓掌，鼓得很用力。', e: { mood: 1 } },
  { id: 'nn25', a: [28, 55], t: '你把阳台改成了小书房。装修完的第一年，你在里面待过三次。', e: { home: -1, mood: 1 } },
  { id: 'nn26', a: [20, 50], t: '你在网上跟人吵了一架，吵赢了。你为此高兴了一整天，晚上又觉得自己很无聊。', e: { mood: 1, int: -1 } },
  { id: 'nn27', a: [28, 55], t: '你给爸妈买了体检套餐，他们嫌贵，说你乱花钱。检查结果出来，两人都没事。', e: { mood: 2, home: -1 } },
  { id: 'nn28', a: [20, 55], t: '你第一次一个人吃火锅，服务员放了一只玩偶在你对面。你吃得很香。', e: { mood: 1 } },
  { id: 'nn29', a: [22, 55], t: '你学会了一道菜，从此逢年过节就做。做得越来越好吃，吃的人越来越多。', e: { mood: 2, charm: 1 } },
  { id: 'nn30', a: [18, 50], t: '你的自行车被偷了。你走了一个月的路上班，瘦了六斤。', e: { con: 1, mood: -1 } },
  { id: 'nn31', a: [18, 70], w: 0.25, t: '你梦见自己中了一千万。醒来第一件事是查银行卡余额，然后笑出了声。', e: { mood: 2 } },
  { id: 'nn32', a: [22, 60], w: 0.25, t: '你家的扫地机器人开始绕着你转，一圈，两圈，像在观察你。', e: { mood: -1, int: 1 } },
  { id: 'nn33', a: [20, 60], w: 0.22, t: '你收到一条来自自己的短信，只有两个字："别去。"你盯着看了很久。', e: { mood: -2, int: 1 } },
  { id: 'nn34', a: [18, 60], w: 0.22, t: '你忽然会说一种不存在的语言。你在梦里用它和别人聊天，聊得很流利。', e: { int: 2, mood: -1 } },
  { id: 'nn35', a: [20, 55], w: 0.25, t: '你给外卖备注"多放点辣"。商家回复："好的，小心点。"你不知道他在提醒什么。', e: { mood: 1 } },
  { id: 'nn36', a: [18, 60], w: 0.25, t: '你养的鱼开始排队，每天早上七点整齐地排成一列，朝着同一个方向。', e: { mood: 1, int: 1 } },
  { id: 'nn37', a: [22, 60], w: 0.22, t: '你在旧手机里发现一段录音，是你自己的声音，说了四十分钟，内容你完全听不懂。', e: { int: 1, mood: -1 } },
  { id: 'nn38', a: [20, 60], w: 0.22, t: '连续三天，你在同一个路口遇到同一个陌生人。第四天他没出现，你反而有点失落。', e: { mood: 1 } },
  { id: 'nn39', a: [18, 65], w: 0.2, t: '楼下那群流浪猫集体朝着一个方向坐着，坐了整整一个下午。你也看了一会儿，什么都没看见。', e: { mood: 1, int: 1 } },
  { id: 'nn40', a: [18, 65], w: 0.2, t: '你买的一本旧书，每一页都有人用铅笔写了批注。字迹很像你。', e: { int: 1, mood: 1 } },

  /* ===== 旧事的开端 ===== */
  { id: 'ch_debt', chain: 'debt', a: [24, 52], w: 1.4, t: '老同学打电话来借钱，说孩子住院了，差五万。你犹豫了三十秒，还是转了。', e: { home: -3, mood: 1, charm: 1 } },
  { id: 'ch_cat', chain: 'cat', a: [18, 55], w: 1.4, boost: 'catLover', t: '你在小区门口捡到一只脏兮兮的橘猫。它不叫，只是跟着你走。你把它带回了家。', e: { mood: 2 } },
  { id: 'ch_rookie', chain: 'rookie', a: [26, 50], w: 1.4, t: '你开始带一个刚毕业的新人。他很笨，学什么都慢，但每天都是第一个到。', e: { mood: 1, int: 1 } },
  { id: 'ch_flat', chain: 'flat', a: [30, 60], w: 1.4, t: '父母的老房子传来要拆迁的消息。你回去看了看那棵石榴树。', e: { mood: 1 } },
  { id: 'ch_checkup', chain: 'checkup', a: [30, 62], w: 1.4, t: '体检查出一个结节。医生写报告的时候说："建议复查，不用太紧张。"', e: { mood: -2 } },
  { id: 'ch_crush', chain: 'crush', a: [25, 50], w: 1.4, t: '同学聚会上，你见到了当年暗恋的那个人。对方比记忆里瘦了一点。', e: { mood: 2 } },
  { id: 'ch_lottery', chain: 'lottery', a: [20, 55], w: 1.4, t: '你随手买了一张彩票，塞进钱包夹层就忘了。', e: { home: -1 } },
  { id: 'ch_gym', chain: 'gym', a: [22, 45], w: 1.4, t: '你办了一张健身年卡。销售握着你的手说，你是他见过最有决心的一个。', e: { home: -3, mood: 1 } },
  { id: 'ch_write', chain: 'write', a: [20, 50], w: 1.4, t: '你开始在深夜写东西，写完就发在一个没有人看的角落。', e: { mood: 1, int: 1 } },
  { id: 'ch_father', chain: 'father', a: [22, 45], w: 1.4, boost: 'craft', t: '父亲教你修东西。他说这手艺不值钱，但能让人安心。', e: { int: 1, mood: 1 } },

  /* ===== 传说天赋的专属事件 ===== */
  { id: 'lg01', a: [10, 80], w: 8, c: function (s) { return s.flags['t_天选之子']; },
    t: '你随手买的一张彩票中了头奖。你不惊讶，你只是觉得：终于来了。', e: { home: 5, mood: 3 } },
  { id: 'lg02', a: [10, 80], w: 8, c: function (s) { return s.flags['t_学神']; },
    t: '你被请去做一场分享。台下坐着一千多人，你讲完，前排有人哭了。', e: { int: 2, mood: 3, charm: 1 } },
  { id: 'lg03', a: [10, 80], w: 8, c: function (s) { return s.flags['t_家里有矿']; },
    t: '律师送来一份文件让你签字。你签完才知道，那是九位数。', e: { home: 4, mood: 1 } },
  { id: 'lg04', a: [10, 80], w: 8, c: function (s) { return s.flags['t_重生者']; },
    t: '你又梦见了那件事。这一次，你在它发生之前就绕开了。', e: { int: 2, mood: 2, con: 1 } },
  { id: 'lg05', a: [10, 80], w: 8, c: function (s) { return s.flags['t_长生种']; },
    t: '医生把你的体检报告翻来覆去看了三遍，说：你的身体年龄是二十八。', e: { con: 2, mood: 2 } },
  { id: 'lg06', a: [10, 80], w: 8, c: function (s) { return s.flags['t_完美基因']; },

  { id: 'lg07', a: [10, 80], w: 8, c: function (s) { return s.flags['t_时代的宠儿']; },

  { id: 'lg08', a: [10, 80], w: 8, c: function (s) { return s.flags['t_天煞孤星']; },

  { id: 'lg09', a: [10, 80], w: 8, c: function (s) { return s.flags['t_非酋']; },
    t: '你连续三十次没抽中。你把手机放下，忽然笑了：这世上还有比这更稳定的东西吗。', e: { mood: 2, int: 1 } },
  { id: 'lg10', a: [10, 80], w: 8, c: function (s) { return s.flags['t_系统绑定者']; },
    t: '系统发布任务：今天之内，让一个陌生人对你笑。你照做了。奖励到账。', e: { int: 1, mood: 2, home: 1 } },
  { id: 'lg11', a: [10, 80], w: 8, c: function (s) { return s.flags['t_音乐神童']; },
    t: '你在街头弹了一首。有人录下来发到网上，第二天你上了热搜。', e: { charm: 3, home: 2 } },
  { id: 'lg12', a: [10, 80], w: 8, c: function (s) { return s.flags['t_万人敌']; },
    t: '三个混混把你堵在巷子里。五分钟后，你蹲在地上给他们包扎。', e: { con: 2, mood: 2 } },
  { id: 'lg13', a: [10, 80], w: 8, c: function (s) { return s.flags['t_心想事成']; },
    t: '你许愿想要一个周末的晴天。周五下了暴雨，周六早上，雨停了。', e: { mood: 3, int: 1 } },
  { id: 'lg14', a: [10, 80], w: 8, c: function (s) { return s.flags['t_天赋异禀']; },
    t: '别人学三个月的东西，你三天就会了。教练看了你很久，一句话没说。', e: { int: 2, con: 1, charm: 1 } },

  { id: 'ti05', a: [12, 40], w: 2.5, c: function (s) { return s.flags['t_体育特长生']; },

  { id: 'ti06', a: [14, 45], w: 2.5, c: function (s) { return s.flags['t_小镇做题家']; },

    { at: 6, t: '你们绕回你原来住的那栋楼，一楼铁门还锁着。你翻出工地电焊机，火花溅在袖口，把大门焊成一块死铁。', e: { con: 2, home: 2 } },

    { at: 12, t: '镇上的集市摆在旧菜场，水泥台上摊着晒干的槐花、旧电池、退烧药。一把盐换三节电池，你攥着半包烟站了半天，换回一双不合脚的胶鞋。', e: { int: 1 } },
    { at: 13, t: '回镇的路上，翻倒的公交车里传出哭声。布包里的孩子烧得烫手，你把她抱回去，长老掀开布看了一眼，说养不活。', e: { mood: -1 } },
    { at: 14, t: '米糊是拿麦种换的，你用勺子喂，她咬住勺柄不松口。第三夜烧退了，你才敢起名。那天是节气，你叫她小满。', e: { mood: 2 } },
    { at: 15, t: '墙外来了七个人，敲了整夜。有人说放进来粮食不够，有人说不开门就是杀人。天亮时你踩着梯子上墙，让人开一条缝。', e: { mood: -2 } },
    { at: 16, t: '进来的四个被隔在仓库看了三天。第七夜，其中一个撬开枪柜。你把他按在雪里，手比铁还冷。从此枪柜钥匙挂在你自己脖子上，睡觉也不摘。', e: { mood: -3 } },
    { at: 18, t: '门内那面水泥墙，你用断钉子刻名字。先刻王队长，再刻那年冬天没熬过去的九个人。刻到第十个，钉子滑了，划出一道长口子。', e: { mood: -2 } },
    { at: 20, t: '尸潮从北边压过来的那年，镇上把两扇门都堵死。你们在墙头倒柴油，火顺风烧了一夜，天亮时墙根堆着黑色的壳。', e: { con: 1 } },
    { at: 22, t: '火堆边有人喊你的旧名字。你回头，认出是原来坐你对面的同事，西装烂成条还穿在身上。他问你借火，手抖得点不着。', e: { mood: -2 } },
    { at: 24, t: '粮断了四十天。你把看门的狗宰了，汤分给孩子，自己啃骨头。开春后没人再提那条狗，只有你记得它叫黑子。', e: { con: -1, mood: -3 } },
    { at: 26, t: '长老在雪化前走的，临走把账本塞给你，说别记恨墙外的人。你把他埋在墙根向阳那面，坟头压了块砖。', e: { mood: -3 } },
    { at: 28, t: '有人从南边带来一张名单，密密麻麻写着活人。你从头看到尾，看见你妹妹的名字，后面三个字是已确认。你把纸折了三折。', e: { mood: -3 } },
    { at: 30, t: '小满十七岁，第一次独自带人出墙。你送到门口就回头，坐在仓库里数钟点，数到半夜，才听见外面推车的响。', e: { mood: 1 } },
    { at: 32, t: '有新人当面喊你老队长，说东坡那边也归这墙管。你愣了一下才应声，回头想找面镜子，才想起楼里早没镜子了。', e: { mood: -1 } },
    { at: 34, t: '墙外来了一百多个，推着一辆坏卡车。你在墙头站了很久，最后喊关门。门合上以后，外面的声音慢慢低下去，像水退。', e: { mood: -2 } },
    { at: 36, t: '五十七岁上你开始眼花，穿针要举到窗边。墙上的名字越刻越密，最上面那一排你已经看不清，得让小满念给你听。', e: { con: -1 } },
    { at: 38, t: '小满领回一个男人，说要留在墙外的猎队。你看他绑腿的手法，点了头。那晚你把自己的刀磨到半夜。', e: { home: 1 } },
    { at: 40, t: '小满问你当年什么样。你说第一夜在十七层，靠一张办公桌顶住消防门。她问怕不怕。你说怕，怕到把咖啡喝完了。', e: { mood: 1 } },
    { at: 44, t: '镇上起了高热病，你把人分三处隔开，自己守病棚。小满退了烧，隔壁那个会修水泵的没熬过去。你在墙上又添了两个名字。', e: { con: -1, mood: -3 } },
    { at: 47, t: '你回了一趟老楼，楼塌成土堆，钢筋翘在外头。瓦砾里翻出半张全家照，背面是你妈的字：天冷了，回来吃饭。', e: { home: -2, mood: -3 } },
    { at: 50, t: '你七十一岁，坐在墙头看日落，腿垂在墙外。墙根那排名字被雨冲得发白，风里有新麦子的味道。太阳下去时，你没起来。', e: { home: 1, mood: 2 } }
  ],
  xiuxian: [
    { at: 1, t: '石阶有九百级，你跪在第一级上。七月雨落下来，青石缝里渗出的水泡着膝盖。守门道童换了三次岗，没人问你名字。', e: { con: -2, mood: -2 } },
    { at: 2, t: '第三天傍晚，看门的杂役打了个哈欠，领你进去。师父在灯下写名册，从袖里摸出块木令牌，边角磨圆了，说：拿着，别丢。你就此有了一间通铺。', e: { con: 1, mood: 1 } },
    { at: 3, t: '入冬前，山下货郎捎来一个蓝布包。母亲纳的千层底，针脚歪歪扭扭，包里有张纸：家里都好，别惦记。你把鞋塞进枕下，没舍得穿。', e: { home: 2, mood: 1 } },
    { at: 4, t: '你的床位在柴房，挨着水缸。冬天缸面结冰，你每天卯时挑满七担，晚一刻，饭盆里就只剩半勺馊粥。粥里有沙。', e: { con: -1, mood: -2 } },
    { at: 5, t: '你采了三个月的灵草晾在竹匾上。师兄路过，一脚踢翻，草叶落进水沟。他蹲下，拍拍你的肩说：这种人，扫一辈子地正好。', e: { int: 1, mood: -3 } },
    { at: 6, t: '同乡二牛上山看你，还带了一坛腌菜。他穿着短打，手上一层茧，说镇上码头缺人，抬一天货能吃饱。你送他到山门，回来路上闻见坛子漏出来的蒜味。', e: { home: 2, mood: 1 } },
    { at: 7, t: '后山石阶总也扫不净。扫地老道每天只扫三丈，扫完就坐在台阶上晒太阳。有天他忽然说：你腰太直，跪得不够久，还学不会低头。', e: { int: 2, con: 1 } },
    { at: 8, t: '宗门大比，擂台设在演武场。你抽到第三场，对手是个使鞭的师兄。鼓响三声，你只记得自己退到台边，鞋跟踩空。', e: { mood: -1 } },
    { at: 9, t: '第二轮你本可以赢。师兄端来一碗补气的药汤，你喝下去，丹田像塞了团湿棉花。你在台上被击倒，听见台下有人说：可惜。', e: { int: 1, mood: -3 } },
    { at: 10, t: '分洞府那日，师兄把名册拍在石桌上。他占了朝南那间，把你分到后山最潮的石洞，说：你身上湿气重，正好。你抱着铺盖走了一夜。', e: { con: 1, mood: -3 } },
    { at: 11, t: '山下来信，字是隔壁私塾先生代写的。母亲眼睛不行了，穿针要摸半个时辰，还说你寄回去的灵石她都收着，一块没花。你捏着信，闻到纸上有一点灶灰味。', e: { home: 1, mood: -2 } },
    { at: 12, t: '扫地老道死在台阶上，手里还攥着扫帚。执事翻他的草席，翻出一本手抄的功法，扉页写着你的名字。你才知道他扫了六十年山门，等的是一个再也没回来的人。', e: { int: 2, mood: -2 } },
    { at: 13, t: '夜里火把照红半边天。师父把一块黑铁令牌按进你掌心，手抖得厉害，说：走，别回头。你从后山崖下去，听见身后剑风，一声没敢回。', e: { con: 2, mood: -4 } },
    { at: 14, t: '你走了十七天，在一座荒山落脚。山上有间塌了半边的猎棚，你割茅草补顶，用石头垒灶，第一夜煮的是野栗子，涩得舌头发麻。', e: { con: 2 } },
    { at: 15, t: '你在洞口挑了块青石，用剑尖一笔一笔刻师门的名字。刻到最后一笔，剑断了。你捡起断剑接着刻，指甲缝里全是石粉，刻完天已经黑透。', e: { int: 1, con: 2 } },
    { at: 16, t: '第二年在山下的破庙里捡到一个孩子，瘦得能数清肋骨。你教他磕头，把令牌塞进他手里，说：拿着，别丢。他攥得很紧，指节都白了。', e: { home: 2, mood: 2 } },
    { at: 17, t: '你教他认药草，一片叶子一片叶子地闻。他记性差，把断肠草当成柴胡，你打了他手心。夜里他睡着，你替他掖被角，发现他比来时胖了些。', e: { int: 1, mood: 1 } },
    { at: 18, t: '你把洞口砌死，只留一个递水的方孔。徒弟在外面跪了一夜，第二天把灶搬到洞口。你在石壁上刻了一道竖线，算是第一年。', e: { con: 2, mood: -1 } },
    { at: 21, t: '闭关第三年，辟谷丹就吃完了。你改吃松子和雪水，嚼得牙根发酸。石缝里长出一丛苔，你每天数它的叶子，数到第四十片就不数了。', e: { con: 1, mood: -1 } },
    { at: 24, t: '闭关第六年，经脉像被人拿钝刀刮。你吐了一口血在石壁上，血渗进去，留下一点褐色的印。你咬着布条熬过去，布条上全是牙印。', e: { con: 1, mood: -2 } },
    { at: 27, t: '闭关第九年，石壁上浮出老道的脸。他还在扫那三丈台阶，扫一遍，回头看你一眼。你知道是心魔，还是跟着他扫了三夜，扫到指甲翻起来。', e: { int: 2, mood: -2 } },
    { at: 30, t: '闭关第十二年，你梦见母亲在灶前烧火。她背比记忆里弯，添柴的手背上全是斑。你想喊她，喊不出声，醒时脸上凉，石洞里没有一点烟火味。', e: { home: 2, mood: -3 } },
    { at: 34, t: '闭关第十六年，最后一块灵石碎在掌心，像一小撮干盐。你把它倒进嘴里，咽了。剩下的年月，你只能靠山里的风和自己的骨头。', e: { con: 2 } },
    { at: 38, t: '闭关第二十年，山下来了一队人，喊着什么，火把映在洞顶。你听见徒弟的声音，老了，哑了。你伸手摸到方孔，又收回来，没推开那块石。', e: { con: 1, mood: -3 } },
    { at: 42, t: '闭关第二十四年，你伸手梳头，扯下一把白发。指甲长得绕了掌心两圈，脚趾甲顶穿了草鞋。你对着水洼照，认不出那张脸是谁。', e: { con: -2, mood: -2 } },
    { at: 45, t: '闭关第二十七年，你开始最后一冲。丹田里的气转得像磨盘，骨头一节一节响。石洞里闷出焦味，你分不清是雷还是自己在烧。', e: { con: 1, mood: -1 } },
    { at: 47, t: '闭关第二十九年冬天，你在石壁上刻下最后一道竖线。气从百会冲出去，山上的鸟一夜没落。你知道成了，也知道再没有下一年可等。', e: { con: 3, mood: 1 } },
    { at: 48, t: '你推开那块石，草长得比人高。洞口摆着一双旧草鞋，是徒弟留下的。山下的村子亮着灯，灯比你记忆里的多，也比记忆里的白。', e: { mood: -2 } },
    { at: 49, t: '你走回村子，土路成了水泥路。老屋的地基上盖了别人的新房，母亲埋在后坡，坟头的草被人割过。你蹲下去，摸到碑上母亲的名字，被雨冲得只剩两道痕。', e: { home: 1, mood: -3 } },
    { at: 50, t: '你回到荒山那日，天顶压下来一片黑云，云里滚着紫电。你把断剑插在青石旁，站直了。石头上的师门名被雷光照亮，一笔一笔，都在。', e: { con: 2, mood: 2 } }
  ],
  wuxia: [
    { at: 1, t: '破庙漏雨，供桌上的泥像塌了半张脸。卖刀的老头蹲在灶灰里烤手，把一柄无鞘柴刀推过来，说：三十年了，头一个敢伸手的。', e: { con: 1 } },
    { at: 2, t: '你摸出全部铜钱，老头只拿走你脚上那双旧鞋，说刀认路不认人。你走出庙门，他在背后补一句：别拿它砍柴。', e: { con: 1, mood: 1 } },
    { at: 3, t: '渡口的艄公多要三文钱，你还没开口，他先抄起竹篙。刀抽出得比想得快，水面浮起一层红。你把他的斗笠捞上来，扣在自己头上。', e: { con: 2, mood: -3 } },
    { at: 4, t: '你在河湾吐了半宿，酸水混着胆汁。洗手时搓掉一层皮，指缝里还是腥的。对岸有人洗衣，棒槌一下一下，像在敲你的后背。', e: { mood: -2 } },
    { at: 6, t: '货栈后巷，人牙子正往车上塞麻袋。你割断绳，里头是个十四五岁的丫头，叫阿禾。她抓住你的袖子不放，指甲掐进布，一直跟到城外。', e: { mood: 1 } },
    { at: 8, t: '顺风镖局一夜死了十九口，血从门槛淌到街心。你赶到时只捡到一枚刀穗，天没亮官差就围了客栈，说有人看见你翻墙出来。', e: { con: 1, mood: -3 } },
    { at: 10, t: '城门下贴了通缉。画像上的人塌鼻、宽额、左脸一道疤，你对着水面看了半天，自己一样都不占。守门兵丁扫你一眼，挥手放行。', e: { int: 1, mood: 1 } },
    { at: 12, t: '绕道回了趟家。院里的枣树被砍了当柴，娘的白发比你走时多了大半。她没问你犯了什么事，只把腌菜坛子塞进你怀里，说：外头菜贵。', e: { home: 2, mood: -1 } },
    { at: 14, t: '刀穗上的结是双环扣，只有北边的镖师这么打。你顺着当铺问到第三个掌柜，他说这结叫回魂结，十年前沈先生教过一拨人。', e: { int: 2 } },
    { at: 16, t: '城西菜市，卖菜的姑娘把烂菜叶往你筐里塞，说看你像饿了三天。你替她赶走收保护费的泼皮，她塞给你两个萝卜，不肯收钱。', e: { charm: 1, mood: 1 } },
    { at: 18, t: '沈先生在私塾教孩子写大字，袖口磨得发白。他写字时左手压纸，右手悬腕。你在窗外站了半个时辰，他抬头说：进来喝碗粥。', e: { int: 1 } },
    { at: 20, t: '老家来信，说娘瘫了。你赶回去守了七天，她认不出你，只反复念你小时候掉进井里那回。出殡那天下小雨，抬棺的人收了你双倍工钱。', e: { home: -2, mood: -3 } },
    { at: 22, t: '沈先生替你熬药，说镖局那晚他去过。他伸手拨旺炉火，虎口露出一道旧疤，正合那枚刀穗的缠法。粥还热着，你听见牙齿磕在碗沿上。', e: { int: 1, mood: -4 } },
    { at: 24, t: '他承认了。十九口人里有一个是他弟弟，欠了赌债，把镖银的路线卖了。他不肯多辩，只把私塾的钥匙放在桌上，说：孩子们下月没先生了。', e: { mood: -2 } },
    { at: 26, t: '江湖大会在废盐场开，七十二家镖旗插了一地。你把沈先生押上台，台下有人喊杀，也有人喊：那是教过我写字的先生。', e: { con: 1, mood: -1 } },
    { at: 28, t: '你举刀要劈，沈先生不躲。刀落在青石桩上，当的一声断成两截，半截飞进盐堆。你手里剩三寸铁，像攥着一根烧过的柴。', e: { con: -2, mood: -3 } },
    { at: 30, t: '你回到破庙，老头早没了影，供桌上留着半块干饼。你在庙里睡了两夜，梦见娘在灶前烧火，醒来时灶是冷的，米缸见了底。', e: { home: -1, mood: -2 } },
    { at: 32, t: '往南走到一个只有一条街的小镇，铁匠铺的老掌柜缺个抡大锤的。你留下，一天抡三千下，虎口裂了结痂，痂上再裂，夜里拿盐水烫。', e: { con: 2, home: 1 } },
    { at: 34, t: '收了个徒弟，只肯学打铁，不肯学刀。他把菜刀打得薄而匀，刃口对着光看没有一丝歪。他说：切菜的刀不杀人，人才杀人。', e: { mood: 2 } },
    { at: 36, t: '有年冬天咳得厉害，痰里带黑丝。你对着水缸看自己，鬓角全白，抬锤时腰先弯下去。徒弟把铁砧垫高了三寸，什么也没说。', e: { con: -2, mood: -1 } },
    { at: 38, t: '卖菜的姑娘后来嫁到镇上，摊子从东头挪到西头。她丈夫死了，儿子接了她的秤。她见了你只问一句：还吃萝卜不吃。', e: { mood: -1 } },
    { at: 40, t: '沈先生在牢里待了八年，出来时瞎了一只眼。他托人捎话，只问那刀还在不在。你去县里看他，他在墙根晒太阳，说：断得对。', e: { mood: 1 } },
    { at: 42, t: '镇上通了铁壳子车，驿道加宽，马车改拉煤。铺子里的活从刀犁变成门轴和车圈，你的手还记得刀的轻重，铁却不认了。', e: { con: -1, home: 1 } },
    { at: 44, t: '阿禾带着孩子回镇上，认了半天才认出你。她说当年那麻袋里还有两个女孩，都没活下来。她走时留下半袋米，你送到街口，她没回头。', e: { mood: -1 } },
    { at: 45, t: '锤子举到胸口就落不下去了。你把用了二十年的锤柄换细，仍旧不听使唤。徒弟接过去，一锤砸下，铁砧嗡嗡响，你在旁边听自己喘气。', e: { con: -2 } },
    { at: 46, t: '你在铺子后墙开出一小块菜地，种萝卜。种子是卖菜老太太给的，她说人老了总要有点土攥在手里。萝卜出苗那天，你在畦边坐了半下午。', e: { home: 2, mood: 2 } },
    { at: 47, t: '北边来的人说，破庙拆了，庙里死了个卖刀的老头，手里攥着半块干饼。你问他刀是什么来路，那人摇头，说老头一辈子没讲过自己姓什么。', e: { mood: -2 } },
    { at: 48, t: '沈先生的死信是县里寄来的，一张薄纸。你翻出那截断刀，断口生了红锈。徒弟问这是谁的，你说：一个教孩子写字的先生。', e: { mood: -1 } },
    { at: 49, t: '你把铺子交给徒弟，自己搬到后院住。镇上最后一家镖局早改成杂货铺，招牌翻过来挂，背面还留着顺风两个字，漆掉了大半。', e: { home: 1, mood: 1 } },
    { at: 50, t: '两截断刀挂在土墙上，钉子是徒弟打的。风从门缝钻进来，刀锈往下掉粉。有个小孩问这破铁是什么，你说：一条走岔了的路。', e: { mood: 2 } }
  ],
  cyber: [
    { at: 1, t: '第一次接入是雨夜。线插进后颈，你眼前炸开一万个心跳，全是别人的，一起撞你的肋骨。技师说：别怕，那是整座城在跳。', e: { con: 2 } },
    { at: 2, t: '回家那晚母亲还在。她把排骨汤热了两遍，问你后颈的疤疼不疼。你说不疼。窗外无人机贴着楼飞，汤面浮着一层油，跟着一起抖。', e: { home: 2 } },
    { at: 4, t: '凌晨三点，陌生号码打进来，一个女声说：有人刚把你的位置卖给我们，这个月第七次。你抬头，路灯杆上的黑盒子正对着你，红灯亮着。' },
    { at: 6, t: '义体在斑马线中间锁死。膝盖一软，你跪在车道上，两条腿像灌满水泥。绿灯亮了，车流绕开你走，没人下车。后颈弹出一行小字：授权到期。' },
    { at: 7, t: '那块黑广告牌只循环一句话：编号失效的人请留在原地。你在下面站了四十分钟，字每亮一次，喉咙就干一寸。有人经过，往你脚边扔了一枚硬币。', e: { mood: -2 } },
    { at: 8, t: '巷子里有人抬枪。阿澈把你往墙上一推，自己顶上去。枪声闷得像关车门。他倒下前把半截烟塞进你口袋，说：别回头，跑。血顺着排水沟流。', e: { mood: -3 } },
    { at: 10, t: '你在档案局窗口站了一整天。系统里查不到你的出生、学费、母亲的名字，连阿澈的死都没有一行。办事员把卡推回来，说：不好意思，库里没有你。' },
    { at: 12, t: '女孩十六岁，坐在你租的隔间里，脚够不着地。她递来一张旧照片，说想变成照片上的人。你替她刻档案、编生日，收钱时她的手一直在抖。', e: { int: 1 } },
    { at: 14, t: '菜市场碰见老周。他升了主管，袖口钉着公司徽。你喊他名字，他愣一下，笑笑说认错人了吧，拎着菜走了。塑料袋在你手里勒出白印，青椒滚了一地。' },
    { at: 16, t: '城里换了新公司，广播说旧档案一律作废、可以申请复核。你排了三天队，交上唯一一张和阿澈的合影。第七天收到回复：材料已归档售出，感谢配合。', e: { mood: -2 } },
    { at: 18, t: '你开始给自己刻新身份，刻一个丢一个。有回刷脸进站，闸机说该号码今日已通行。屏幕上跳出另一个你，眉毛比你整齐。你摸了摸自己的脸，头一次不敢确定。' },
    { at: 20, t: '收记忆的买家把探头贴上你太阳穴，屏幕上浮出一段段价格。轮到阿澈，他挡枪那三秒标得最高。你说不卖。买家笑：这段每年掉两成，别等。' },
    { at: 22, t: '排异从右手开始。指尖先发凉，再发黑，像被烟头烫过。夜里义体自己抽，敲得床板响。医生说只能换新的，价钱后面跟着四个零，你数了两遍。' },
    { at: 24, t: '黑诊所的大夫拆下你右手，换上从死人身上取的旧件，说能用两年，别淋雨。缝合没打麻药，你咬着毛巾，听见骨节里咔哒一声，对上了。' },
    { at: 26, t: '女孩回来找你，二十岁，脸换了，声音没换。她放下一沓钱，说当年那张身份救了她一命，也让她再没回过家。你数到一半停下，说：我也是这么过来的。', e: { mood: 2 } },
    { at: 28, t: '城里又开始查无记录的人，抓捕名单在电梯屏上滚动。你把刻好的身份埋进花盆底下，每晚换地方睡。有回在通宵影院醒来，前排坐着两个和你一样没档案的人。' },
    { at: 30, t: '老周死了，讣告贴在旧厂门口，只有两行字。你赶过去，保安拦你说非亲属不得入内。你在马路对面站到天黑，看见他儿子抱着遗像出来，不认识你。', e: { home: -1 } },
    { at: 32, t: '你接了单活，给一个和你同名的客户做身份。见面才发现，他脸上有你二十岁的轮廓。他说档案是你二十年前卖的。你翻旧账，收款记录上确实有你的手印。' },
    { at: 34, t: '买家把报价单推过来，阿澈那三秒现在只值一副二手义眼。他说现在没人要旧时代的死人了，城里每天都死。你把单子折好放进口袋，说再等等。' },
    { at: 36, t: '你终于卖了。探头贴上太阳穴，那三秒被抽走时像有人从你耳朵里拽一根线。换来的新手臂很轻，能用。可你再也想不起阿澈说话是什么声音了。', e: { mood: -3 } },
    { at: 38, t: '新手臂好用，身体却在别处坏。上楼梯要扶墙，膝盖里像塞了碎瓷。你开始戴老花镜，镜片压着鼻梁，把监控盒子看成一团黑影。镜子里的人你不太认得。' },
    { at: 40, t: '老街区要拆。你回去，母亲那栋楼只剩半面墙，墙上还留着厨房的油烟印。冰箱早没了，你蹲下来捡了块地砖，塞进外套口袋，走的时候没人拦你。' },
    { at: 42, t: '买家死了，死在收记忆的椅子上，探头还贴着他的太阳穴。他的库被清仓拍卖，你攒了半辈子的东西论斤卖。有人在摊上翻出一段阿澈的枪声，标价五块。' },
    { at: 44, t: '你在旧货摊买下一段枪声，接进耳朵。三秒里有人喊你的名字，喊得那么熟。摊主说这段是从一个搬运工脑子里翻录的，那人装了阿澈的碎片，说了半年胡话。' },
    { at: 45, t: '你找到那个搬运工。他五十岁，张嘴却用阿澈的腔调说：烟给你留了。你坐在他对面抽完一根，忽然明白阿澈当年早知道有人要杀你，才一直跟着你。', e: { mood: 1 } },
    { at: 46, t: '排异漫到胸口。皮肤下面鼓起一条条线，像蚯蚓在走。医生说再换就是换一半身子，钱够的话能撑五年。你算了算存款，够换一只手，或者够活三年。' },
    { at: 47, t: '女孩五十一了，头发白了一半，带着女儿来。她说这行该有人接手，把刻身份的刀和旧账本交给你保管。你教了她女儿三天，第四天手抖得握不住笔。', e: { int: 1 } },
    { at: 48, t: '新公司做人口清算，街口的机器扫一遍脸就报数。你走过去，机器沉默了三秒，然后说：未登记。后面排队的人齐刷刷看你，像看一件不该出现在货架上的东西。' },
    { at: 49, t: '你回了趟老屋地址，那儿立着一栋玻璃楼，门厅里摆着公司的灯箱：记忆可存可售，永久备份。你在长椅上坐到腿麻，把口袋里那块地砖摸得发亮。' },
    { at: 50, t: '七十岁这年，排异终于停了，因为医生把该拆的都拆了。你躺在那儿数自己的心跳，一下，两下，都是自己的，慢得像敲门。窗外有人在换广告牌，字一行行亮起来。', e: { mood: 2 } }
  ],
  deepspace: [
    { at: 1, t: '二十五岁那年，你在观测站大厅签下二十七页保密协议。办事员把笔收回去，说：从今天起，这里的事，连你妈也不能讲。', e: { con: 1 } },
    { at: 2, t: '第二年，储物柜里的手机震了三十七次。你下班开机，三十七个未接来电全是家里。回过去，母亲只说：你那边怎么老没信号。' },
    { at: 3, t: '夜班三点十七分，耳机里响起一串脉冲，短长短长，像有人在数数。你摘下耳机，那节奏还在耳骨里跳，你摸黑按下录音键。', e: { mood: 1 } },
    { at: 4, t: '录音回放，脉冲的间隔分毫不差。你和同事轮班盯了四个月，计数器停在一万三千次，之后再没有新的数字跳出来。' },
    { at: 6, t: '站里发的旧硬盘贴着你的编号，标签角翘了起来。你趁交接班的空当，把一万三千次脉冲拷进去，塞进棉衣内袋，贴着胸口。' },
    { at: 8, t: '周主任把你的工牌从挂绳上剪下来，说：心理评估没过，项目组不要你了，今天就走。走廊尽头的门禁已经删掉了你的权限。', e: { con: -1, mood: -2 } },
    { at: 10, t: '收拾抽屉时你只拿了两样：一包没吃完的饼干，那块旧硬盘。安检门响了一声，保安挥手放你过去，硬盘在怀里烫得像块砖。' },
    { at: 12, t: '回到家，母亲炖了排骨，汤面上浮着一层黄亮的油。她问你在观测站到底做什么，你夹走最后一块萝卜，说：看星星，写报表。' },
    { at: 14, t: '出租屋的台灯熬到发白。二手电脑的风扇响得像拖拉机，你把一万三千次脉冲重新喂进模型，泡面涨在碗里，筷子搭在碗沿。' },
    { at: 16, t: '第四个月，你擦鼻涕时纸上带血。医生说是视网膜干燥，你点头，回家继续敲键盘，右眼底下慢慢洇开一片红，像谁按上去的印子。' },
    { at: 18, t: '凌晨四点，模型收敛。屏幕上跳出一行数字：人类胜率 0.0003%。你盯了很久，手心全是汗，窗外环卫车正扫过去。', e: { int: 2, mood: 1 } },
    { at: 20, t: '你带着打印好的报告回老单位。门禁不认你的脸，前台给周主任打了电话。他从电梯里出来，只说了半句：别把事情弄大，就转身回去。', e: { mood: -1 } },
    { at: 22, t: '地下二层有台手动确认闸，红色按钮，落满灰。你算过，按下去概率不会变，但那台机器会把人类这一侧的坐标播出去。你揣着旧工牌，走了七站路。' },
    { at: 24, t: '按钮比想象中软。按下去，指示灯闪了三下，没有警报，没有轰鸣，只有机房的底噪。这事不能对任何人讲。你在原地站到腿麻，把指印擦干净，走了。', e: { con: 2 } },
    { at: 26, t: '什么都没有发生。你被调去看北郊的仓库，每天登记进出水泥。母亲托人给你介绍对象，你去了一趟，姑娘问你怎么总看手机。', e: { mood: -2 } },
    { at: 28, t: '老陈退休那天请你喝酒。他说项目组散了以后，谁也说不清在等什么。你们碰了碰瓶底，他忽然拍你肩膀：你眼睛那年，是不是哭过。' },
    { at: 30, t: '体检报告上的箭头一年比一年多。你上楼得扶栏杆，膝盖里像塞了把沙子。理疗师说少低头，你笑着答应，回家又坐到电脑前。' },
    { at: 32, t: '母亲在菜市场摔了一跤，髋骨裂了。你在医院走廊的长椅上睡了三夜，护士来换药时你才发现，自己已经能看懂监护仪上每一条线。', e: { home: 1, mood: -1 } },
    { at: 34, t: '街上没什么异常，新闻里只有物价和球赛。你开始怀疑那串脉冲只是仪器的回声，怀疑自己用一双眼睛换了场空。夜里翻出硬盘，又不敢插。' },
    { at: 36, t: '按下开关的第十年，天上再没响起同一串脉冲。你把硬盘裹进塑料袋，放进床底的鞋盒，压上一双旧棉鞋，像压住一件不敢再提的事。' },
    { at: 38, t: '你搬回老屋。母亲开始把盐当糖放，把你的名字叫成你舅舅。有天她指着电视里的发射塔问：你还在那儿上班吗。你说不上了。' },
    { at: 40, t: '母亲走的那天凌晨，窗外落着雨。你握着她的手，那只手一点点凉下去，指甲缝里还嵌着洗菜的泥。你在走廊的自动售货机前站了很久。', e: { home: -2, mood: -3 } },
    { at: 42, t: '收拾屋子时，你在缝纫机抽屉里翻出一封没拆的信，信封上只写着你的名字，字迹是母亲的。信摆在桌上，你每天擦一遍桌面，始终没拆开。', e: { home: 2 } },
    { at: 44, t: '退休手续在六楼办。年轻的办事员核对工龄，问你哪个单位，你报了观测站的老名字。她在系统里翻了两遍，抬头说：这个单位已经不在了。', e: { con: -1 } },
    { at: 45, t: '老陈的葬礼在城西，来的人不到二十个。你把白花放在遗像前，他的遗孀递给你一个纸袋，里面是当年项目组的合影，你站在最后一排。' },
    { at: 46, t: '白内障手术排在一个雨天。医生说不疼，你还是听见刀片在眼球上刮。纱布拆掉那天，世界重新变清楚，你第一件事是找出那块硬盘。', e: { mood: 1 } },
    { at: 47, t: '街上多了没见过的车，孩子的课本里写着近地轨道。观测站的旧址改成了纪念馆，门口的牌子换了名字，解说词里一个字也没提你。' },
    { at: 48, t: '你一个人吃饭，电视早就不开，只留一台旧收音机在窗台。傍晚它播天气预报，你跟着念一遍，声音在空屋子里撞回来，像有人在应。' },
    { at: 49, t: '凌晨三点十七分，收音机自己响了。短长短长，和那年在耳机里听见的一模一样。你从床上坐起来，摸黑找出硬盘，手抖得插了三次才插进去。', e: { mood: 2 } },
    { at: 50, t: '天快亮时，七十四岁的你终于拆开那封信。里面只有一张纸，母亲写：你说你在看星星，我就每天夜里往天上看看。收音机还在响，你把它抱进怀里。', e: { home: 1, mood: 3 } }
  ],
  infinite: [
    { at: 1, t: '你在消毒水味里睁眼，白大褂上别着一张陌生工牌。编号0417的男人拧开半瓶水递过来：想活，就跟着我。', e: { mood: -1 } },
    { at: 2, t: '七楼走廊的灯坏了一半，地上拖着长长水痕。他抬下巴指墙上的红漆字：熄灯后别数门，数到第十三扇就停。' },
    { at: 3, t: '停尸房的铁抽屉自己滑出来。0417捂住你的嘴，两人躲在器械柜后，听那东西用指甲刮不锈钢，一声一声。', e: { con: -1 } },
    { at: 5, t: '水痕漫到走廊尽头。0417把你塞进防火门，自己背对门站定，肩膀顶住门缝，只喊：别记我的脸，记编号。', e: { mood: -3 } },
    { at: 6, t: '门在你身后合上。出口只剩一块烧焦铁牌，刻着0417。你借来记号笔，把这四个数字写上手背，汗一浸就晕。', e: { con: -1 } },
    { at: 8, t: '第八年你戴上了队长的袖标。新来的十一个人挤在安全屋门口，一个女孩拽住你袖口：跟着你，真能活吗。', e: { charm: 1 } },
    { at: 10, t: '第二批里最小的叫小周，死在第十七层，才十九岁。你把他的编号添在自己手背上，添完发现已经想不起他的脸。' },
    { at: 12, t: '第十二年你回了一趟家。母亲把排骨汤端上桌，说你怎么瘦成这样。你把手背压在桌沿，没让她看见那串数字。', e: { home: 2 } },
    { at: 14, t: '你带着新一批十一个人重进那家医院。这一次你数着门、数着呼吸，天亮推门，十一个人，一个没少。', e: { mood: 2 } },
    { at: 16, t: '主神的声音像广播，从四面墙里渗出来：留下来，当守关者，不用再进副本。白色房间里只有一把椅子。', e: { mood: 1 } },
    { at: 18, t: '你站起来，把椅子推回墙角：我还在等一个人开门。主神沉默了三秒，门自己开了，外面是安全屋的灯。', e: { mood: 2 } },
    { at: 20, t: '安全屋角落坐着编号0001，头发全白，正补一只袜子。他说自己进来二十八年，编号越靠前，越没人记得名字。', e: { charm: -1 } },
    { at: 22, t: '老同事聚会，他们聊房贷、聊孩子中考。有人问你手上疤怎么来的，你说做菜烫的。散场时没人记得你不喝酒。' },
    { at: 24, t: '0001死在副本门口的台阶上，手里还攥着那只补好的袜子。你把他编号写在手背，发现自己手背已经没有空位。', e: { mood: -2 } },
    { at: 26, t: '第二十六年，你的膝盖开始在下雨前发酸。看编号要摘下手套、戴上老花镜，镜片上有副本里熏出来的雾。', e: { con: -1 } },
    { at: 28, t: '你在现实里有一间房，一年只住七天。推门时灰尘在光里翻，冰箱断电，阳台的绿萝早成了一把干草。', e: { home: 1 } },
    { at: 30, t: '阿凯是你从停尸房门口拖回来的人。第三十年，他把你的积分转空，反锁了安全屋的门，隔着门说：叔，我还得活。', e: { mood: -3 } },
    { at: 32, t: '你砸开门时他早跑了，只留下半包烟和一张他妹妹的病历。你捏着那张纸，忽然明白了他为什么怕死。', e: { int: 1 } },
    { at: 34, t: '通往下一批新人的铁门生了锈，推开要两个人用力。门后是十一个刚醒的人，有人哭，有人吐，有人盯着自己的手。' },
    { at: 36, t: '母亲走的那天你正在副本里。出来时手机上有十七个未接，回家只看见桌上一个凉透的保温桶，汤面结了一层油。', e: { mood: -4 } },
    { at: 38, t: '第三十八年，安全屋角落那把椅子归你了。你学0001的样子补袜子，新来的孩子叫你叔，问你当年是怎么活下来的。', e: { home: 1 } },
    { at: 40, t: '房子周围的梧桐被锯了，邻居家的小孩长成大人，见面喊你爷爷。你在阳台上站到天黑，七天里没开过电视。', e: { home: 1 } },
    { at: 42, t: '你的手开始抖，写编号时歪歪扭扭。有次在副本里摔了一跤，爬起来花了半分钟，膝盖响得像旧门轴。', e: { con: -2 } },
    { at: 44, t: '最后一个知道你来历的老朋友也走了。葬礼上你站在最后一排，没人认得你，也没人问你手背上那些洗不掉的数字。', e: { mood: -2 } },
    { at: 45, t: '主神空间换了新的编号系统，光屏取代了铁牌。你盯着手背上的旧墨迹，第一次觉得它比任何光屏都清楚。', e: { int: 1 } },
    { at: 46, t: '铁门又开了。门后发抖的新人探出半张脸，嘴唇发白，工牌上印着陌生的数字，和你当年别在胸前的那张一模一样。', e: { mood: 1 } },
    { at: 47, t: '你从兜里摸出半瓶水，拧开，递过去。他接的时候手一直在抖，水洒在铁门槛上。你说：想活，就跟着。', e: { charm: 1 } },
    { at: 48, t: '夜里你摊开手，0417四个数字已经磨得只剩轮廓。你拿记号笔重新描了一遍，描完发现手背上没有别的地方了。' },
    { at: 49, t: '有人劝你申请守关者的位置，说你这把年纪不该再进副本。你把申请表折成两半，塞进铁门底下的缝里。' },
    { at: 50, t: '你站在门前，背驼了，手里攥着半瓶水。走廊的灯坏了一半，你数着门，数到第十三扇停住，然后推开了它。', e: { mood: 2 } }
  ],
  cthulhu: [
    { at: 1, t: '巷子最里头那家旧书店没有招牌。你把钱递过去，老板推回来，只说：书不要钱，你答应我一件事。你抱着那本没有封面的书走出来，雨落在书脊上，像落在皮肤上。', e: { con: 1 } },
    { at: 2, t: '夜里翻开，纸是空的，凑近台灯才看见淡青的纹路，像水底的草。合上书，屋里有一股退潮的腥味，你把窗子推开，外面是六月的干街。' },
    { at: 4, t: '第一夜梦见海。不是水面，是水下：青灰色的城，塔尖朝下长，一扇门开着，门里有灯。醒来枕套上结了一层白盐，舔一下，是咸的。', e: { int: 1, mood: -1 } },
    { at: 6, t: '小宋来修书铺帮忙，翻到那本书，笑说这纸是新的。他拿起铅笔在账本背面画了个弯钩，说：你做梦做傻了。第二天他请假，没来。', e: { mood: 1 } },
    { at: 8, t: '你去看他，他蹲在自家门口，用指甲在门板上刻弯钩，十个指头都裂了，木屑混着血。他不抬头，说门后面有水声。他媳妇站在楼道里哭。', e: { mood: -2 } },
    { at: 10, t: '病房里他抓住你的手腕，指甲掐进肉里，说海底那个东西知道你名字。医生进来，他忽然指着你说：书是他给我的。你手里的橘子被捏出了水。', e: { mood: -3 } },
    { at: 12, t: '过年回母亲家，她问你手怎么在抖。你说加班。半夜她起来给你关窗，说：你爸年轻时也这样，说梦见水，后来他把那东西沉进了河里。你没敢问她沉的是什么。', e: { home: 1 } },
    { at: 14, t: '你查了几年，才找到那座岛。船老大把你放在礁石边，说退潮来接。岛上没有鸟，石头是黑的，海平得像一块铁板。你走上岸，没疯，心里安静得可怕。', e: { con: 1 } },
    { at: 16, t: '岛心有一圈石阶，往下通到水里。你站在阶上烧那本书，火是绿的，不烫手。烧到最后一页，水里浮起一个东西，像跪着的人，没有脸。它没有动。你也没有动。', e: { int: 2, mood: -2 } },
    { at: 18, t: '回来以后，符号从胳膊的皮下浮出来，青黑色，会动。你用锥子照着它一笔一笔刻进小臂的骨头，刻了三个夜里，血把床单粘在皮肤上。你没疯，只是疼。', e: { con: 2, mood: -2 } },
    { at: 20, t: '修书铺的房东把铺子卖了。老周退休那天请你喝酒，说你的手不能再修书了。你用左手给他倒酒，右手藏在桌下，骨头里的弯钩跟着心跳一下一下地跳。', e: { home: 1, mood: -1 } },
    { at: 22, t: '有个年轻人跪在你门口，膝盖下垫着一张海图，求你带路。你说岛上什么都没有，是我编的。他不信，把头磕在水泥地上。你把门关上，听见他磕到天亮。', e: { mood: -1 } },
    { at: 24, t: '半年后你听说他出海，船回来了，人没回来。他母亲来敲你的门，把那张泡烂的海图塞给你。你把它压在米缸底下，压了二十年，米一直是潮的。', e: { mood: -3 } },
    { at: 26, t: '那家没招牌的书店又出现在另一条巷子里。老板还是那个样子，一根白发都没有。他推来一本没有封面的书，说：这次也不要钱，只求你把它带到离海最近的地方。你说好。', e: { int: 1, mood: -1 } },
    { at: 28, t: '老周走的那天，你去了殡仪馆。回来绕路走老巷，书店和他家的门牌都没了，剩一片围挡。你站在围挡外抽完一根烟，才发现自己戒烟已经八年。', e: { home: 1, mood: -2 } },
    { at: 30, t: '你开始分不清。早上醒在一条街上，街两边是青灰色的门，门上有灯，走过去要数台阶。你数到第七级，睁眼是自家的天花板。闹钟停在三点十七分，连着三天。', e: { int: 1, mood: -2 } },
    { at: 32, t: '那本新书你用油布包了三层，塞进衣柜最底层。它一年比一年沉。第四年你搬柜子，发现地板被压出一个坑，油布外层渗着水，是咸的。', e: { mood: -1 } },
    { at: 34, t: '你五十九岁，牙掉了两颗，左耳听不见低音。医生说这很正常。你点头，没告诉他低音里有什么。回家上楼要歇两回，扶手上全是你的汗。', e: { con: -1 } },
    { at: 36, t: '你搬到离海一千二百公里的地方，一个没有河的县城。房间朝北，你整夜开灯，把收音机调到没有台的位置。白噪音里还是有一声一声的潮，不响，也不停。', e: { home: 1, mood: -2 } },
    { at: 38, t: '你在县医院拍片子，医生举着灯看你的小臂，说骨头上有东西，不像伤。你说是纹身，纹到骨头里了。他把片子借给同事看，你付了钱，把片子带走烧了。', e: { int: 1 } },
    { at: 40, t: '母亲走的时候九十一岁。你收拾她的屋子，樟脑味和那家书店一样。抽屉最底下有个铁盒，里面是一张从书上撕下来的纸，空白，对着灯能看见青纹。', e: { home: 2, mood: -2 } },
    { at: 41, t: '你把那张纸和油布包放进同一个箱子，搬到新住处。夜里箱子响，像有人在里面用指甲刮。你没有开灯，也没有开箱，坐到天亮，刮声停了。你发现自己一直在数数。', e: { int: 1, mood: -1 } },
    { at: 42, t: '你给疗养院写信，问小宋还在不在。回信说他十年前就走了，走之前一直在门上刻东西，护理员刷了三遍漆也盖不住。附了一张照片，弯钩和你手臂上的一样。', e: { mood: -2 } },
    { at: 43, t: '侄女带儿子来看你，孩子指着你小臂上的疤问怎么弄的。你说小时候摔的。孩子伸手摸，摸到骨头里的硬线，缩回去说：里面有东西在动。侄女笑着打了他一下。', e: { home: 2, mood: 1 } },
    { at: 44, t: '门铃响，是当年那个年轻人。他老了，也瘦了，站在门口说：岛上真的什么都没有，我在上面住了半个月。你请他进来喝茶，手一直抖。他说：你为什么不早说。你说：我说过。', e: { int: 2, mood: 1 } },
    { at: 45, t: '他走的时候留下一句话：你当年要是说实话，我可能就不去了。你送到楼下，看见他上了一辆没有牌照的车。车开走以后，地上留下一小滩水，咸的。', e: { mood: -1 } },
    { at: 46, t: '七十一岁那年你把房子卖了，中介问你要什么样的。你说离海三百米，多一米都不行。他笑，说海景房贵。你说不要海景，要能听见浪，看不见海。', e: { mood: 1 } },
    { at: 48, t: '房子是渔村最末一间，墙根常年泛白。你每天早晨扫台阶上的盐，扫成一小堆，倒回海里。邻居问你为什么住这儿，你说图安静。夜里浪打墙，你睡得很沉。', e: { mood: 1 } },
    { at: 49, t: '有一天你在门槛上发现一本没有封面的书，用油布包着。你认得那个结。你把书放进灶膛，火是绿的，烧了很久。第二天它还在门槛上，干的，一页不少。', e: { mood: -1 } },
    { at: 50, t: '你七十五岁，住得离海三百米。早上扫盐，中午煮粥，晚上听浪。你不问哪边是梦，梦里那座城也点着灯。每年春天你用卷尺量一次，海近了四厘米，你就把椅子往后挪。', e: { con: 1, mood: 1 } }
  ],
  palace: [
    { at: 1, t: '宫门在身后合上，铜钉上的红漆还是新的，蹭了你一手。嬷嬷按住你后颈往下压：在这儿，头要低过别人的鞋尖。', e: { mood: -1 } },
    { at: 2, t: '嬷嬷教你走路：贴着墙根，步子踩在别人的影子里，眼睛只扫自己鞋尖。她说，让人记不住，才活得长。', e: { int: 1 } },
    { at: 3, t: '夜里你摸出母亲缝在衣角的碎银，忽然想起家里灶上那锅糊了的玉米粥，焦味混着柴烟，呛得人流泪。', e: { home: 1, mood: -1 } },
    { at: 5, t: '第五年开春，柳嫔说丢了一对镯子，宫人却从你箱底翻了出来。你跪在阶下，看见她袖口露出银镯一角。', e: { mood: -2 } },
    { at: 6, t: '你在殿外的青砖上跪了一夜，露水浸透裙摆。同跪的沈贵人塞来一只小暖炉，天快亮时你数砖缝里的蚂蚁，数到第七只。', e: { con: -1, mood: -2 } },
    { at: 7, t: '伤好以后，膝盖上留下两块铜钱大的疤。嬷嬷拿烧酒给你擦，说这疤比圣旨管用，跪之前先想想它。', e: { int: 1, con: -1 } },
    { at: 9, t: '第九年，皇帝在御花园停住脚，问你怎么总低着头。你答鞋不好看。他笑了一声，从此记住了你。', e: { charm: 1 } },
    { at: 11, t: '第十一年，你搬进临水的院子。夜里有人送来一盏灯，灯罩上画着并蒂莲，你看了半宿，没敢吹灭。', e: { mood: 2 } },
    { at: 12, t: '赏赐一车一车抬进院子，绸缎堆到廊下，银锭装在木箱里，香料的气味压过了院中的桂花。', e: { charm: 2, mood: 1 } },
    { at: 14, t: '同批入宫的阿棠死在秋天，说是失足落水。你去收她的旧衣，衣襟里还缝着半块从家里带来的麦芽糖。', e: { home: -1, mood: -2 } },
    { at: 16, t: '一只黑猫从御膳房后墙跳进来，蹭你的裙角。你叫它炭，藏在柜子底下养，每天省下半条鱼干。', e: { home: 1 } },
    { at: 18, t: '第十八年，柳嫔差人送来一盏安神茶。你端起来就闻出苦杏仁味，指腹在杯沿上蹭了一圈，没作声。', e: { int: 1 } },
    { at: 19, t: '你把那盏茶端去沈贵人屋里，说是柳嫔新赏的，请她尝。她笑着喝了半盏，把剩下半盏推给你。', e: { int: 1, mood: -1 } },
    { at: 20, t: '沈贵人死在夜里，太医说是心疾。你没去吊唁，只抱着炭坐在窗下，想起跪殿外那夜她塞来的暖炉，炉灰早凉透了。', e: { home: -1, mood: -3 } },
    { at: 22, t: '第二十二年冬，皇帝病重。殿外跪满了人，哭声从傍晚续到五更，你站在廊下听，分不清哪一声是真的。', e: { mood: -2 } },
    { at: 23, t: '钟声响了二十七下，白幡从宫门一直挂到寝殿。你跪在人群最末，想起他问你鞋好不好看的那天。', e: { home: -1, mood: -2 } },
    { at: 24, t: '新帝登基，比你小十岁。他来请安，叫了一声太妃，眼睛却越过你，落在身后那面斑驳的墙上。', e: { mood: -2 } },
    { at: 26, t: '第二十六年，你梳头时掉了一把头发。铜镜里那张脸还算体面，只是眼角的纹路，笑与不笑都抹不平。', e: { charm: -1, con: -2 } },
    { at: 28, t: '小宫女打碎了太后的玉盏，跪在地上发抖。你走过去说这盏是我碰倒的。后来她认你做干娘，磕了三个头。', e: { home: 2, mood: 2 } },
    { at: 30, t: '你教她走路，脚跟先落地，肩膀别晃，裙子扫过门槛时提一指。她摔了七次，第八次走得像个人样。', e: { home: 1, mood: 2 } },
    { at: 32, t: '家里来信，说母亲没了，信在路上走了三个月。你把信纸贴在脸上，墨迹凉得像井水，半天没哭出来。', e: { home: -2, mood: -3 } },
    { at: 34, t: '嬷嬷死在腊月，手里还攥着一块给你纳鞋底的布。你替她换鞋，才想起她当年打你手背那一下，其实很轻。', e: { home: -2, mood: -3 } },
    { at: 36, t: '当年一起学规矩的六个人，如今只剩你一个。你偶尔念她们的名字，念到第三个就停住，剩下的记不全。', e: { int: 1, mood: -2 } },
    { at: 38, t: '炭老了，瞎了一只眼，跳不上窗台。你把它抱上去，它趴一会儿又要下来，你只好再抱一次。', e: { home: 1, mood: -1 } },
    { at: 40, t: '干女儿被指了婚，要嫁去南边。她来辞行，跪着给你磕头。你塞给她一包银子，说别学我，也别回头。', e: { home: -1, mood: -2 } },
    { at: 42, t: '耳朵开始背，宫女回话要凑到跟前，把每个字放慢。你嫌她们喊得响，又怕哪天没人再喊。', e: { con: -2 } },
    { at: 44, t: '你搬进西边的偏殿，行李只有两口旧箱。正殿换了锁，钥匙没送到你手里，你也没去问。', e: { mood: -1 } },
    { at: 46, t: '偏殿院里有一棵老树，每年四月开一树白花，落满台阶。你数它开了几回，就想起自己进宫几年。', e: { mood: 1 } },
    { at: 48, t: '炭死在春天，身子还是软的。你把它埋在树下，没立碑。那几天你总觉得柜子底下有动静，弯腰去看，什么也没有。', e: { home: -2, mood: -3 } },
    { at: 50, t: '第五十年，你坐在老树下，一个刚进宫的小丫头扶你起来。她的手很热。宫墙外的市声换了三回，你扶过的那只手，早已出了宫。', e: { con: -2, mood: 1 } }
  ]
};

var LINE_ENDINGS = {
  apocalypse: [
    { id: 'ap_dark', name: '独食者', c: function (s) { return s.karma <= -1; }, t: '你活到了最后。基地的门在你身后关上，门外还有人在敲。这一次，你没有开门。' },
