  { id: 'ap01', line: 'apocalypse', a: [0, 120], t: '停电的第七天，你终于习惯了没有网络的日子。习惯这件事让你有点害怕。', e: { mood: -1, int: 1 } },
  { id: 'ap02', line: 'apocalypse', a: [0, 120], t: '你在一家便利店的仓库里翻出三箱罐头和一把开瓶器。你抱着它们坐在地上笑了很久。', e: { home: 2, mood: 2 } },
  { id: 'ap03', line: 'apocalypse', a: [0, 120], t: '你加入了七个人的小队。队长姓王，退伍军人，话不多，但每次都能带大家活着回来。', e: { con: 1, mood: 1 } },
  { id: 'ap04', line: 'apocalypse', a: [0, 120], t: '队里有人发烧了。全队沉默了一整晚，第二天早上，他的铺位空了。', e: { mood: -3 }, bad: 1 },
  { id: 'ap05', line: 'apocalypse', a: [0, 120], t: '你在超市遇到另一个幸存者，他手里有枪。你们隔着货架对视了很久，然后各自退开。', e: { mood: -1, int: 1 } },
  { id: 'ap06', line: 'apocalypse', a: [0, 120], t: '你学会了用消防斧，也学会了走路不发出声音。这两件事花了你四个月。', e: { con: 1, int: 1 } },
  { id: 'ap07', line: 'apocalypse', a: [0, 120], t: '夜里，围栏外有东西一直在挠，挠到天亮。没有人敢出去看。', e: { con: -1, mood: -1 }, bad: 1 },
  { id: 'ap08', line: 'apocalypse', a: [0, 120], t: '你们发现了一座地下车库，卷帘门还能用。这是三个月来最好的消息。', e: { home: 2, mood: 2 } },
  { id: 'ap09', line: 'apocalypse', a: [0, 120], t: '两个队友为了半瓶水打了起来。你站在旁边，一句话也没说。', e: { mood: -2 }, bad: 1 },
  { id: 'ap10', line: 'apocalypse', a: [0, 120], t: '你救了一个躲在衣柜里的孩子。他不说话，只是一直跟着你。', e: { mood: 2, con: -1 } },
  { id: 'ap11', line: 'apocalypse', a: [0, 120], t: '无线电里传出一个坐标，每天重复三遍。你们决定去看看。', e: { int: 1, mood: 2 } },
  { id: 'ap12', line: 'apocalypse', a: [0, 120], t: '你站在楼顶，看见整座城市在燃烧。很安静，安静得可怕。', e: { mood: -2 } },
  { id: 'ap13', line: 'apocalypse', a: [0, 120], t: '你被咬了。伤口没有发黑，也没有变化。你瞒了所有人。', e: { con: -1, mood: -1, int: 1 } },
  { id: 'ap14', line: 'apocalypse', a: [0, 120], t: '冬天来了。这个冬天冻死的人比咬死的多。', e: { con: -2, mood: -1 }, bad: 1 },
  { id: 'ap15', line: 'apocalypse', a: [0, 120], t: '一支军队的残部路过，愿意带上能干活的人。你们跟了三天，他们没甩掉你们。', e: { con: 1, mood: 2 } },
  { id: 'ap17', line: 'apocalypse', a: [0, 120], rep: true, max: 4, w: 0.6, t: '你在废墟里翻了半天，找到半瓶水和一包过期的饼干。你笑出了声。', e: { mood: 1, home: 1 } },

  /* ---- 修仙 ---- */
  { id: 'xx01', line: 'xiuxian', a: [0, 120], t: '你在山门外的石缝里捡到一枚玉简，里面藏着一套吐纳法。你照着练了一遍，浑身出汗，像被水洗过。', e: { int: 2, con: 1 } },
  { id: 'xx02', line: 'xiuxian', a: [0, 120], t: '你试着辟谷。第三天饿得眼冒金星，第五天忽然就不饿了。', e: { con: 1, mood: -1 } },
  { id: 'xx03', line: 'xiuxian', a: [0, 120], t: '你在后山发现一眼灵泉。喝下去以后，后背像有火在烧。', e: { con: 2, int: 1 } },
  { id: 'xx04', line: 'xiuxian', a: [0, 120], t: '一位老道说你根骨不错，问你要不要拜师。你二话没说就跪下了。', e: { int: 2, mood: 2 } },
  { id: 'xx05', line: 'xiuxian', a: [0, 120], t: '你炼出了第一颗丹药，卖了三十块灵石，够吃半年。', e: { home: 2, mood: 1 } },
  { id: 'xx06', line: 'xiuxian', a: [0, 120], t: '师兄抢了你的洞府，理由是他先看见的。你记下了，没有当场翻脸。', e: { mood: -2, int: 1 }, bad: 1 },
  { id: 'xx07', line: 'xiuxian', a: [0, 120], t: '集市上有人认出你是"凡人出身"，摊主把东西收了回去，说散修莫碰。', e: { mood: -2, charm: -1 }, bad: 1 },
  { id: 'xx08', line: 'xiuxian', a: [0, 120], c: function (s) { return s.lineAge <= 11; }, t: '你的剑第一次出鞘，砍断了半座山头，也砍坏了师父的亭子。', e: { int: 2, mood: 1 } },
  { id: 'xx09', line: 'xiuxian', a: [0, 120], t: '宗门大比，你赢了。赢得很勉强，但赢了。', e: { int: 2, home: 1, mood: 2 } },
  { id: 'xx10', line: 'xiuxian', a: [0, 120], t: '你被一个魔修盯上了。他跟着你走了三千里，走得像散步。', e: { con: -2, mood: -2 }, bad: 1 },
  { id: 'xx11', line: 'xiuxian', a: [0, 120], t: '你闭关三年。出关那天，山门的牌匾换了，认识的人只剩两个。', e: { int: 3, mood: -1 } },
  { id: 'xx12', line: 'xiuxian', a: [0, 120], t: '你遇到一只会说话的狐狸。它说它是我前世的债主，来收利息的。', e: { mood: 2, home: -1 } },
  { id: 'xx13', line: 'xiuxian', a: [0, 120], c: function (s) { return s.lineAge >= 13; }, t: '师父死了，留给你一句话和半块玉。那句话是："别信天上掉的。"', e: { mood: -2, int: 1 }, bad: 1 },
  { id: 'xx14', line: 'xiuxian', a: [0, 120], t: '你的修为停滞了十年。你开始怀疑，自己是不是只是运气好。', e: { mood: -2, int: 1 }, bad: 1 },
  { id: 'xx15', line: 'xiuxian', a: [0, 120], t: '你在一处遗迹里得到半卷残经，残缺的那页正好是最关键的。', e: { int: 2 } },
  { id: 'xx16', line: 'xiuxian', a: [0, 120], t: '你发现自己可能是某位大能的转世。也可能只是你想多了。', e: { int: 1, mood: 1 } },
  { id: 'xx17', line: 'xiuxian', a: [0, 120], rep: true, max: 4, w: 0.6, t: '你在洞府里打坐，一坐就是几个月，醒来时胡子长了一截。', e: { int: 1 } },

  /* ---- 武侠 ---- */
  { id: 'wx01', line: 'wuxia', a: [0, 120], t: '你在客栈听说，最近三个月已经有七个人死在同一种剑伤下，伤口都很细。', e: { int: 1, mood: -1 } },
  { id: 'wx02', line: 'wuxia', a: [0, 120], t: '你拜入一个小门派。师父教你扎马步，一扎就是半年。你恨过他，后来感激他。', e: { con: 2 } },
  { id: 'wx03', line: 'wuxia', a: [0, 120], t: '你第一次杀人。那天晚上你吐了，第二天照常吃饭，只是没吃肉。', e: { con: -1, mood: -2 }, bad: 1 },
  { id: 'wx04', line: 'wuxia', a: [0, 120], t: '你在酒楼救了一个被围的姑娘。后来才知道，她是某个掌门的小女儿。', e: { charm: 1, mood: 2 } },
  { id: 'wx05', line: 'wuxia', a: [0, 120], t: '你练成了一套刀法。师父看了半天，说：够了，别再练了。', e: { int: 1, con: 1 } },
  { id: 'wx06', line: 'wuxia', a: [0, 120], t: '镖局请你走一趟镖，给的银子够你三年不干活。', e: { home: 2 } },
  { id: 'wx07', line: 'wuxia', a: [0, 120], t: '你被人下了毒，靠一口真气撑到解药送来。', e: { con: -2 }, bad: 1 },
  { id: 'wx08', line: 'wuxia', a: [0, 120], t: '江湖上开始有人提起你的名字，说你是后起之秀。', e: { charm: 1, home: 1 } },
  { id: 'wx09', line: 'wuxia', a: [0, 120], t: '当年的仇家找上门。你已经不是当年的你了。', e: { con: 1, mood: -1 } },
  { id: 'wx10', line: 'wuxia', a: [0, 120], t: '你在一座山顶看日出，忽然觉得这些年的打打杀杀很没意思。', e: { mood: 2, int: 1 } },
  { id: 'wx11', line: 'wuxia', a: [0, 120], rep: true, max: 3, w: 0.6, t: '你在破庙里躲雨，顺手把一个追来的喽啰打发了。', e: { con: 1, mood: 1 } },

  /* ---- 赛博 ---- */
  { id: 'cy01', line: 'cyber', a: [0, 120], t: '你接了一个活：从一家公司的服务器里偷一段数据。报酬够换一条新腿。', e: { home: 2 } },
  { id: 'cy02', line: 'cyber', a: [0, 120], t: '你的义体开始排异。医生说，加点钱可以换更好的型号。', e: { con: -1, home: -1 }, bad: 1 },
  { id: 'cy03', line: 'cyber', a: [0, 120], t: '你在赛博空间里遇到一个自称是你的人。他比你更了解你的童年。', e: { int: 1, mood: -2 } },
  { id: 'cy04', line: 'cyber', a: [0, 120], t: '公司的人找上门，用你的家人做筹码，让你删掉一段数据。', e: { mood: -3 }, bad: 1 },
  { id: 'cy05', line: 'cyber', a: [0, 120], t: '你黑了整栋楼的广告牌，让它循环播放一句话：你们都被监视着。', e: { mood: 3, home: -1 } },
  { id: 'cy06', line: 'cyber', a: [0, 120], t: '你认识了一个仿生人。她说她梦见自己是人，问你这是不是故障。', e: { mood: 1, charm: 1 } },
  { id: 'cy07', line: 'cyber', a: [0, 120], t: '你的记忆被人动过手脚。你发现自己记得一件从没发生过的事。', e: { int: 1, mood: -2 }, bad: 1 },
  { id: 'cy08', line: 'cyber', a: [0, 120], t: '你攒够了钱，可以给自己换一副全新的身体。', e: { con: 2, home: -2 } },
  { id: 'cy09', line: 'cyber', a: [0, 120], t: '城市的霓虹在你眼里开始闪烁。你知道那不是灯的问题。', e: { int: 1, mood: -1 } },
  { id: 'cy10', line: 'cyber', a: [0, 120], t: '你把一段真相上传到了公共网络。三分钟后，全城的屏幕都黑了。', e: { home: -1, mood: 3 } },
  { id: 'cy11', line: 'cyber', a: [0, 120], rep: true, max: 3, w: 0.6, t: '你在天台上抽了根烟，看着无人机群像候鸟一样飞过。', e: { mood: 1, int: 1 } },

  /* ---- 深空 ---- */
  { id: 'ds01', line: 'deepspace', a: [0, 120], t: '你在山里的一座射电望远镜工作，每天的工作就是听宇宙的噪音。', e: { int: 1 } },
  { id: 'ds02', line: 'deepspace', a: [0, 120], t: '你收到了一段有规律的信号，重复了一万三千次。', e: { int: 2, mood: -1 } },
  { id: 'ds03', line: 'deepspace', a: [0, 120], t: '你交了报告。三个月后，你的权限被收回，同事不再和你说话。', e: { home: -1, mood: -2 }, bad: 1 },
  { id: 'ds04', line: 'deepspace', a: [0, 120], t: '你被选入"静默计划"。没有人知道你在想什么，包括你自己。', e: { int: 1, mood: -1 } },
  { id: 'ds05', line: 'deepspace', a: [0, 120], t: '会上有人提出一个方案。你算了三天，觉得那是个陷阱。', e: { int: 1 } },
  { id: 'ds06', line: 'deepspace', a: [0, 120], t: '你算了一整夜，结论是：人类赢的概率是 0.0003%。', e: { mood: -3, int: 1 }, bad: 1 },
  { id: 'ds07', line: 'deepspace', a: [0, 120], t: '观测站报告，一颗星突然消失了，没有留下任何痕迹。', e: { mood: -2, int: 1 } },
  { id: 'ds08', line: 'deepspace', a: [0, 120], t: '你决定做一件所有人都反对的事。', e: { con: -1, mood: 1 } },
  { id: 'ds09', line: 'deepspace', a: [0, 120], t: '倒计时出现在每个人的视网膜上。只有你能看见。', e: { mood: -2, con: -1 } },
  { id: 'ds10', line: 'deepspace', a: [0, 120], t: '你终于听懂了那段信号。它在说：别回答。', e: { int: 1, mood: 2 } },
  { id: 'ds11', line: 'deepspace', a: [0, 120], rep: true, max: 3, w: 0.6, t: '你在观测站值夜班，泡了一杯很淡的茶，听了一整晚的风。', e: { int: 1, mood: 1 } },

  /* ---- 无限流 ---- */
  { id: 'ar_inf', line: 'infinite', a: [0, 120], w: 40, c: function (s) { return s.lineAge === 0 && s.age === s.flags.lineStartAge + 1; },
    t: '你活着回来了。兑换点到账，你换了别人眼里最没用的东西：一卷绷带。', e: { con: 1, int: 1 } },
  { id: 'in01', line: 'infinite', a: [0, 120], t: '第一个副本是家医院。走廊尽头的灯一直在闪，你数到第七次的时候，灯灭了。', e: { mood: -2, con: -1 }, bad: 1 },
  { id: 'in02', line: 'infinite', a: [0, 120], t: '老手教你规矩：不要相信副本里的 NPC，尤其是不怕你的那种。', e: { int: 2 } },
  { id: 'in03', line: 'infinite', a: [0, 120], t: '你差点死在一个会模仿人声的东西手里。它学你妈妈的声音，学得很像。', e: { con: -1, mood: -2 }, bad: 1 },
  { id: 'in04', line: 'infinite', a: [0, 120], t: '你用积分换了一次治疗。医生说，你这伤在现实里治不了。', e: { con: 2, home: -1 } },
  { id: 'in05', line: 'infinite', a: [0, 120], t: '有人在最后一关把队友推了下去，只为了多分一点积分。你记住了他的编号。', e: { mood: -2, int: 1 }, bad: 1 },
  { id: 'in06', line: 'infinite', a: [0, 120], t: '主神发布了惩罚任务。倒计时出现在你手腕上，擦不掉。', e: { mood: -2, con: -1 }, bad: 1 },
  { id: 'in07', line: 'infinite', a: [0, 120], t: '你在副本里遇到一个已经死过三次的人。他说第三次之后就不疼了。', e: { int: 1, mood: -1 } },
  { id: 'in08', line: 'infinite', a: [0, 120], t: '你发现副本的背景是真实历史。那些死人，真的死过。', e: { int: 2, mood: -1 } },
  { id: 'in09', line: 'infinite', a: [0, 120], t: '队长为了掩护新人，留在了门后。门关上的时候，他没有回头。', e: { mood: -3, con: 1 }, bad: 1 },
  { id: 'in10', line: 'infinite', a: [0, 120], t: '你开始怀疑自己也是副本里的 NPC。你掐了自己一把，很疼。', e: { int: 1, mood: -1 } },
  { id: 'in11', line: 'infinite', a: [0, 120], rep: true, max: 3, w: 0.6, t: '你在安全屋睡了十二个小时，醒来第一件事是确认自己还在。', e: { mood: 1, con: 1 } },

  /* ---- 克苏鲁 ---- */
  { id: 'ar_ct', line: 'cthulhu', a: [0, 120], w: 40, c: function (s) { return s.lineAge === 0 && s.age === s.flags.lineStartAge + 1; },
    t: '你没有疯。这让你更害怕。', e: { int: 2, mood: -1 } },
  { id: 'ct01', line: 'cthulhu', a: [0, 120], t: '你加入了一个奇怪的读书会。每个人都在读同一本没有封面的书。', e: { int: 1, mood: -1 } },
  { id: 'ct02', line: 'cthulhu', a: [0, 120], t: '你读到一段不该读的文字。之后三天，你听得懂风在说什么。', e: { int: 2, mood: -2 }, bad: 1 },
  { id: 'ct03', line: 'cthulhu', a: [0, 120], t: '你的同事在镜子里对你笑。你回头，他坐在工位上，没有笑。', e: { mood: -2 } },
  { id: 'ct04', line: 'cthulhu', a: [0, 120], t: '你开始分不清哪边是梦。你试着在梦里给自己留字条，醒来后字条在。', e: { int: 1, mood: -1 } },
  { id: 'ct05', line: 'cthulhu', a: [0, 120], t: '你在海边捡到一枚小小的雕像，摸上去是温的。', e: { mood: 1, int: 1 } },
  { id: 'ct06', line: 'cthulhu', a: [0, 120], t: '旧书店的老板看了你一眼，说：你来晚了三十年。', e: { int: 1, mood: -2 } },
  { id: 'ct07', line: 'cthulhu', a: [0, 120], t: '你开了枪。倒下的是你的朋友。你发誓你看见的不是他。', e: { mood: -4, con: -1 }, bad: 1 },
  { id: 'ct08', line: 'cthulhu', a: [0, 120], t: '你把自己关在房间里，用胶带把所有的缝封上。你数了三遍，还是少一条。', e: { con: -1, mood: -2 }, bad: 1 },
  { id: 'ct09', line: 'cthulhu', a: [0, 120], t: '你在墙上画满了符号。画完之后，你不认识自己的字了。', e: { int: 2, mood: -2 } },
  { id: 'ct10', line: 'cthulhu', a: [0, 120], t: '你学会了那个词。你没有念。', e: { int: 1, mood: -1 } },
  { id: 'ct11', line: 'cthulhu', a: [0, 120], rep: true, max: 3, w: 0.6, t: '你睡了很久。醒来时天是灰的，你觉得这样也挺好。', e: { mood: 1 } },

  /* ---- 宫斗 ---- */
  { id: 'ar_pal', line: 'palace', a: [0, 120], w: 40, c: function (s) { return s.lineAge === 0 && s.age === s.flags.lineStartAge + 1; },
    t: '你被分到了最偏的院子。第一课是：别抬头。', e: { charm: 1, mood: -1 } },
  { id: 'pa01', line: 'palace', a: [0, 120], t: '你被赐了一个新名字。原来的名字，从此没人再叫。', e: { mood: -1, charm: 1 } },
  { id: 'pa02', line: 'palace', a: [0, 120], t: '御花园里，你撞见有人在放风筝。你低头行礼，没有看清对方的脸。', e: { mood: 1 } },
  { id: 'pa03', line: 'palace', a: [0, 120], t: '有人往你的茶里下了东西。你把茶倒了，从此只喝自己烧的水。', e: { con: 1, mood: -1 } },
  { id: 'pa04', line: 'palace', a: [0, 120], t: '你学会了装病。太医来的时候，你咳得很像。', e: { int: 1, mood: 1 } },
  { id: 'pa05', line: 'palace', a: [0, 120], t: '贵妃赏了你一匹缎子。你摸了一下，没敢穿。', e: { home: 1, mood: -1 } },
  { id: 'pa06', line: 'palace', a: [0, 120], t: '你身边的宫女被人买通了。你没有揭穿她，只是不再当着她的面说话。', e: { int: 1, mood: -2 } },
  { id: 'pa07', line: 'palace', a: [0, 120], t: '你被诬陷了。你在殿外跪了一夜，膝盖上留下两块疤。', e: { con: -1, mood: -3 }, bad: 1 },
  { id: 'pa08', line: 'palace', a: [0, 120], t: '你得宠了。赏赐堆满了院子，你却没睡过一个整觉。', e: { home: 3, con: -1, mood: -1 } },
  { id: 'pa09', line: 'palace', a: [0, 120], t: '你被贬入冷宫。冷宫里的老妃子教你认草药。', e: { int: 2, mood: -1 } },
  { id: 'pa10', line: 'palace', a: [0, 120], t: '一个孩子抱住了你的腿，叫你娘娘。你蹲下来，忽然很想哭。', e: { mood: 3 } },
  { id: 'pa11', line: 'palace', a: [0, 120], rep: true, max: 3, w: 0.6, t: '你在窗前绣了一下午，绣的是一只飞不出去的鸟。', e: { mood: 1, charm: 1 } },
  /* ===== 末世 · 扩充 ===== */
  { id: 'apA1', line: 'apocalypse', a: [0, 120], w: 14, c: function (s) { return s.lineAge >= 2 && s.lineAge <= 5; },
    t: '你们第一次真正失去队友。那天晚上没人说话，你才发现哭是没有用的。', e: { mood: -3, con: 1 }, bad: 1 },
  { id: 'apA2', line: 'apocalypse', a: [0, 120], w: 14, c: function (s) { return s.lineAge >= 6 && s.lineAge <= 9; },
    t: '你们找到了一处还有电的广播站。你对着麦克风喊了一整晚，第三天，有人回应了。', e: { mood: 3, home: 2 } },
  { id: 'apA3', line: 'apocalypse', a: [0, 120], w: 14, c: function (s) { return s.lineAge >= 10; },
    t: '尸潮来了，比你们见过的任何一次都多。哨塔上的人吹了三次号，第三次没吹响。', e: { mood: -2, con: -1 }, bad: 1 },
  { id: 'apF1', line: 'apocalypse', a: [0, 120], t: '你在超市的镜子里看见自己。瘦了二十斤，眼神很硬。你觉得自己变好看了。', e: { mood: 1, charm: 1 } },
  { id: 'apF2', line: 'apocalypse', a: [0, 120], t: '你学会了种菜。第一颗白菜长得歪歪扭扭，你舍不得吃，供着。', e: { mood: 2, con: 1 } },
  { id: 'apF3', line: 'apocalypse', a: [0, 120], t: '有人偷偷藏了食物。你没有揭发，只是在心里给他记了一笔。', e: { int: 1, mood: -1 } },
  { id: 'apF4', line: 'apocalypse', a: [0, 120], t: '你在废墟里找到一台还能响的收音机，放了一整晚老歌。有人跟着哼，调子全错。', e: { mood: 2 } },
  { id: 'apF5', line: 'apocalypse', a: [0, 120], t: '你开始写日记，写在一本小学练习册上。第一页写的是今天的天气：晴，有尸臭。', e: { int: 1, mood: 1 } },

  /* ===== 修仙 · 扩充 ===== */
  { id: 'xxA1', line: 'xiuxian', a: [0, 120], w: 14, c: function (s) { return s.lineAge >= 2 && s.lineAge <= 5; },
    t: '你第一次闭关，坐了七天，什么也没悟出来。出关时腿麻得站不起来。', e: { mood: -2, int: 2 } },
  { id: 'xxA2', line: 'xiuxian', a: [0, 120], w: 14, c: function (s) { return s.lineAge >= 6 && s.lineAge <= 9; },
    t: '宗门被人一夜之间抹平。你从后山逃出来，回头看了一眼，山门上的匾掉了半边。', e: { mood: -4, con: -1 }, bad: 1 },
  { id: 'xxA3', line: 'xiuxian', a: [0, 120], w: 14, c: function (s) { return s.lineAge >= 12; },
    t: '渡劫前夜，你把所有东西都送人了。最后留在身边的，是那半块玉。', e: { int: 2, mood: -1 } },
  { id: 'xxF1', line: 'xiuxian', a: [0, 120], c: function (s) { return s.lineAge <= 11; }, t: '你在山门前种了一棵桃树。师父说这地方长不出东西，你没理他。', e: { mood: 1 } },
  { id: 'xxF2', line: 'xiuxian', a: [0, 120], t: '你用灵力替师妹修好了发簪。她道了谢，转身就忘了。', e: { charm: 1, mood: 1 } },
  { id: 'xxF3', line: 'xiuxian', a: [0, 120], t: '集市上有人讹你。你一掌把摊子拍成了灰，然后赔了他三块灵石。', e: { home: -1, mood: 2 } },
  { id: 'xxF4', line: 'xiuxian', a: [0, 120], t: '辟谷百日之后，你最想念的东西是盐。', e: { mood: -1, int: 1 } },
  { id: 'xxF5', line: 'xiuxian', a: [0, 120], t: '你养的灵兽跑了。三个月后它自己回来，还胖了一圈。你没问它去了哪。', e: { mood: 2 } },

  /* ===== 武侠 · 扩充 ===== */
  { id: 'wxA1', line: 'wuxia', a: [0, 120], w: 14, c: function (s) { return s.lineAge >= 2 && s.lineAge <= 5; },
    t: '你被冤枉成杀人凶手。官府的通缉画像画得一点都不像你，但没人听你解释。', e: { mood: -3, home: -1 }, bad: 1 },
  { id: 'wxA2', line: 'wuxia', a: [0, 120], w: 14, c: function (s) { return s.lineAge >= 6 && s.lineAge <= 9; },
    t: '你查到了真凶。他是名门正派里最德高望重的那个。你把证据收进怀里，装作什么都不知道。', e: { int: 2, mood: -2 } },
  { id: 'wxA3', line: 'wuxia', a: [0, 120], w: 14, c: function (s) { return s.lineAge >= 10; },
    t: '你站在了所有人的对面。风很大，你把刀横在身前，忽然觉得这一战跟对错没关系。', e: { con: 2, mood: 1 } },
  { id: 'wxF1', line: 'wuxia', a: [0, 120], t: '你在酒馆听说书人讲自己的故事。他讲得比你本人还精彩，你多给了他一块银子。', e: { mood: 2, home: -1 } },
  { id: 'wxF2', line: 'wuxia', a: [0, 120], t: '你为了一碗面，帮人打了一架。面没吃完就凉了，你还是吃完了。', e: { con: 1, mood: 1 } },
  { id: 'wxF3', line: 'wuxia', a: [0, 120], t: '你的刀断了。你在铁匠铺门口守了三天，铁匠说你比这刀还倔。', e: { mood: -1, con: 1 } },
  { id: 'wxF4', line: 'wuxia', a: [0, 120], t: '有个小姑娘塞给你一包桂花糖，说是谢你上次替她赶走了野狗。', e: { mood: 2 } },
  { id: 'wxF5', line: 'wuxia', a: [0, 120], t: '你在客栈住了一年。老板娘每次都会给你多添一勺汤，从不说话。', e: { mood: 2, home: -1 } },

  /* ===== 赛博 · 扩充 ===== */
  { id: 'cyA1', line: 'cyber', a: [0, 120], w: 14, c: function (s) { return s.lineAge >= 2 && s.lineAge <= 5; },
    t: '你的义体被人远程锁死了。你站在马路中间，三个小时一动不能动，路人从你身边绕过去。', e: { mood: -3, con: -1 }, bad: 1 },
  { id: 'cyA2', line: 'cyber', a: [0, 120], w: 14, c: function (s) { return s.lineAge >= 6 && s.lineAge <= 9; },
    t: '你发现公司在你脑子里装了一个东西。它不控制你，只是记录——你每天看见的一切。', e: { int: 2, mood: -3 } },
  { id: 'cyA3', line: 'cyber', a: [0, 120], w: 14, c: function (s) { return s.lineAge >= 10; },
    t: '你站在数据中心的门口，手里是最后一颗脉冲。你想起了自己第一次看见这座城市的样子。', e: { con: -1, mood: 2 } },
  { id: 'cyF1', line: 'cyber', a: [0, 120], t: '你在义体店的货架上看到自己的旧零件，标签写着"九成新"。', e: { mood: -2, home: 1 } },
  { id: 'cyF2', line: 'cyber', a: [0, 120], t: '你给仿生人听了一首歌。她听完问：这是什么？你说，这叫难过。', e: { mood: 2, int: 1 } },
  { id: 'cyF3', line: 'cyber', a: [0, 120], t: '你赚的第一笔钱，买了一碗真牛肉面。汤是真的，面是真的，你差点哭出来。', e: { mood: 3, home: -1 } },
  { id: 'cyF4', line: 'cyber', a: [0, 120], t: '酸雨下了两天。你在天桥底下站了两个小时，看雨把广告牌上的脸冲花了。', e: { mood: 1 } },
  { id: 'cyF5', line: 'cyber', a: [0, 120], t: '你发现自己的社交账号还在更新，但你三年没登录过。它比你更像你。', e: { mood: -2, int: 1 } },

  /* ===== 深空 · 扩充 ===== */
  { id: 'dsA1', line: 'deepspace', a: [0, 120], w: 14, c: function (s) { return s.lineAge >= 2 && s.lineAge <= 5; },
    t: '你的方案被采纳了。会议室里所有人都鼓了掌，你知道这个方案要死三百万人。', e: { int: 2, mood: -4 }, bad: 1 },
  { id: 'dsA2', line: 'deepspace', a: [0, 120], w: 14, c: function (s) { return s.lineAge >= 5 && s.lineAge <= 8; },
    t: '信号有了回应。不是重复，是一句完整的话。翻译组花了一个月才确认：它在问"你们还在吗"。', e: { int: 3, mood: -1 } },
  { id: 'dsA3', line: 'deepspace', a: [0, 120], w: 14, c: function (s) { return s.lineAge >= 8; },
    t: '倒计时归零的前一夜，你一个人去了观测台。星星很多，你数到第七颗就不数了。', e: { mood: 2, int: 1 } },
  { id: 'dsF1', line: 'deepspace', a: [0, 120], t: '你在观测站养了一盆苔藓。它活得比你好，也比你有用。', e: { mood: 1 } },
  { id: 'dsF2', line: 'deepspace', a: [0, 120], t: '你和一个同事为了一个数据吵了一架。第二天他调走了，桌上留了一包烟。', e: { mood: -1, int: 1 } },
  { id: 'dsF3', line: 'deepspace', a: [0, 120], t: '你收到一封来自三十年前的信，是你母亲写的。她说：别做太危险的事。', e: { mood: -2 } },
  { id: 'dsF4', line: 'deepspace', a: [0, 120], t: '你开始失眠。夜里你数星星，数到第四千颗的时候天就亮了。', e: { con: -1, int: 1 } },
  { id: 'dsF5', line: 'deepspace', a: [0, 120], t: '你第一次从观测窗看见地球升起。你哭得很难看，没人看见。', e: { mood: 3 } },

  /* ===== 无限流 · 扩充 ===== */
  { id: 'inA1', line: 'infinite', a: [0, 120], w: 14, c: function (s) { return s.lineAge >= 2 && s.lineAge <= 5; },
    t: '你第一次当队长，带了四个新人。回来的时候剩两个，其中一个一直在笑。', e: { mood: -3, int: 2 }, bad: 1 },
  { id: 'inA2', line: 'infinite', a: [0, 120], w: 14, c: function (s) { return s.lineAge >= 5 && s.lineAge <= 8; },
    t: '主神发布了团队对抗任务。你们在走廊尽头遇到了另一支队伍，两边都没动手。', e: { mood: -2, con: 1 } },
  { id: 'inA3', line: 'infinite', a: [0, 120], w: 14, c: function (s) { return s.lineAge >= 8; },
    t: '最终副本的门开了。里面是你小时候住的那条街，连门口那棵歪脖子树都一样。', e: { mood: -2, int: 2 } },
  { id: 'inF1', line: 'infinite', a: [0, 120], t: '你在副本里捡到一张照片，上面的人你认识，但他从没进过副本。', e: { int: 1, mood: -1 } },
  { id: 'inF2', line: 'infinite', a: [0, 120], t: '你的兑换点被偷了。你什么都没说，只是从此不再把后背留给任何人。', e: { mood: -2, int: 1 } },
  { id: 'inF3', line: 'infinite', a: [0, 120], t: '你和一个老手约定：谁先死，另一个替他照顾家人。你们都没问对方的名字。', e: { mood: 2 } },
  { id: 'inF4', line: 'infinite', a: [0, 120], t: '你在安全屋的墙上刻正字，刻到第五十三个的时候，笔断了。', e: { mood: -1, con: 1 } },
  { id: 'inF5', line: 'infinite', a: [0, 120], t: '你在现实里请了一天假，去看了一场电影。散场时你发现自己在数出口。', e: { mood: 1, int: 1 } },

  /* ===== 克苏鲁 · 扩充 ===== */
  { id: 'ctA1', line: 'cthulhu', a: [0, 120], w: 14, c: function (s) { return s.lineAge >= 2 && s.lineAge <= 5; },
    t: '你的搭档疯了。他把自己锁在屋里，用指甲在门上刻满了同一个符号。', e: { mood: -4 }, bad: 1 },
  { id: 'ctA2', line: 'cthulhu', a: [0, 120], w: 14, c: function (s) { return s.lineAge >= 5 && s.lineAge <= 8; },
    t: '你终于看懂了那些符号。它们不是咒语，是一张地图，标着海底那个位置。', e: { int: 3, mood: -1 } },
  { id: 'ctA3', line: 'cthulhu', a: [0, 120], w: 14, c: function (s) { return s.lineAge >= 8; },
    t: '你租了一条船，一个人下了海。船长收了钱，一句话都没问。', e: { mood: 1, con: -1 } },
  { id: 'ctF1', line: 'cthulhu', a: [0, 120], t: '你在图书馆查到一半，管理员走过来说这本书不存在，然后把它收走了。', e: { int: 1, mood: -1 } },
  { id: 'ctF2', line: 'cthulhu', a: [0, 120], t: '你开始害怕镜子。你把家里所有的镜子都盖上了布，包括手机屏幕。', e: { mood: -2 } },
  { id: 'ctF3', line: 'cthulhu', a: [0, 120], t: '你养了一只猫。它总是盯着墙角看，一看就是几个小时。', e: { mood: 2 } },
  { id: 'ctF4', line: 'cthulhu', a: [0, 120], t: '梦里有人叫你的名字。你醒来后把它写在纸上，字迹不是你的。', e: { int: 1, mood: -2 } },
  { id: 'ctF5', line: 'cthulhu', a: [0, 120], t: '你去看心理医生。你把事情说了一遍，他沉默了很久，然后说：我信你。', e: { mood: 2 } },

  /* ===== 宫斗 · 扩充 ===== */
  { id: 'paA1', line: 'palace', a: [0, 120], w: 14, c: function (s) { return s.lineAge >= 2 && s.lineAge <= 5; },
    t: '你第一次被翻牌子。那一夜你紧张得发抖，事后却发现最难的只是第二天早上怎么走路。', e: { charm: 2, mood: -1 } },
  { id: 'paA2', line: 'palace', a: [0, 120], w: 14, c: function (s) { return s.lineAge >= 6 && s.lineAge <= 9; },
    t: '你被卷进皇嗣之争。有人在你耳边说：站错队，比不站队死得慢一点。', e: { int: 2, mood: -2 }, bad: 1 },
  { id: 'paA3', line: 'palace', a: [0, 120], w: 14, c: function (s) { return s.lineAge >= 10; },
    t: '皇帝病了。整个宫里都在等，等一个人死，或者等一个人活。你开始烧香。', e: { mood: -2, int: 1 } },
  { id: 'paF1', line: 'palace', a: [0, 120], t: '你学会了看人下菜碟。谁该笑，谁该跪，谁该装作没看见。', e: { int: 1, charm: 1 } },
  { id: 'paF2', line: 'palace', a: [0, 120], t: '你在御膳房偷吃，被一个小太监撞见。他低下头，替你瞒下了。', e: { mood: 2 } },
  { id: 'paF3', line: 'palace', a: [0, 120], t: '你养了一只猫。它比你得宠，你有点嫉妒它。', e: { mood: 2, charm: 1 } },
  { id: 'paF4', line: 'palace', a: [0, 120], t: '太后夸了你一句字写得好。你回去练了一整年，练到手腕肿。', e: { int: 2, con: -1 } },
  { id: 'paF5', line: 'palace', a: [0, 120], t: '你收到家书。母亲说家里一切都好，让你不必挂念。你知道不是。', e: { mood: -2 } },

  { id: 'ar_ap2', line: 'apocalypse', a: [0, 120], w: 40, c: function (s) { return s.lineAge === 0 && s.age === s.flags.lineStartAge + 1; },
    t: '你花了三个月才敢在夜里出门。第一课是：不要回头。', e: { con: 1, mood: -1 } },
  { id: 'ar_xx2', line: 'xiuxian', a: [0, 120], w: 40, c: function (s) { return s.lineAge === 0 && s.age === s.flags.lineStartAge + 1; },
    t: '你在山门前跪了三天三夜，才有人来开门。', e: { con: -1, int: 2 } },
  { id: 'ar_wx2', line: 'wuxia', a: [0, 120], w: 40, c: function (s) { return s.lineAge === 0 && s.age === s.flags.lineStartAge + 1; },
    t: '你在山下的镇子里住了三天，才明白刀不是摆设。', e: { con: 1, int: 1 } },
  { id: 'ar_cy2', line: 'cyber', a: [0, 120], w: 40, c: function (s) { return s.lineAge === 0 && s.age === s.flags.lineStartAge + 1; },
    t: '你花了三个月才习惯镜子里的人。他不眨眼。', e: { int: 1, mood: -1 } },
  { id: 'ar_ds2', line: 'deepspace', a: [0, 120], w: 40, c: function (s) { return s.lineAge === 0 && s.age === s.flags.lineStartAge + 1; },
    t: '你花了三个月才接受：你再也回不去了。', e: { mood: -2, int: 2 } },
  { id: 'ar_in2', line: 'infinite', a: [0, 120], w: 40, c: function (s) { return s.lineAge === 0 && s.age === s.flags.lineStartAge + 1; },
    t: '你花了三个月才接受：通关不是终点。', e: { int: 1, mood: -1 } },
  { id: 'ar_ct2', line: 'cthulhu', a: [0, 120], w: 40, c: function (s) { return s.lineAge === 0 && s.age === s.flags.lineStartAge + 1; },
    t: '你花了三个月才敢关灯睡觉。', e: { mood: -1, con: 1 } },
  { id: 'ar_pal2', line: 'palace', a: [0, 120], w: 40, c: function (s) { return s.lineAge === 0 && s.age === s.flags.lineStartAge + 1; },
    t: '你被分到了最偏的院子。第二课是：不要有朋友。', e: { mood: -1, charm: 1 } },
  /* ===== 天赋 × 世界线的共鸣 ===== */
  { id: 'sy01', line: 'infinite', a: [0, 120], w: 60, syn: '系统绑定者', c: function (s) { return s.flags['t_系统绑定者'] && s.lineAge <= 1 && !s.flags.synDone; },
    t: '主神似乎认得你。它给了你一样别人没有的东西：一次重来的机会。', e: { int: 2, mood: 2 } },
  { id: 'sy02', line: 'xiuxian', a: [0, 120], w: 60, syn: '长生种', c: function (s) { return s.flags['t_长生种'] && s.lineAge <= 1 && !s.flags.synDone; },
    t: '你的寿元比同门长得多。别人打坐一年，你能打坐三年。', e: { con: 2, int: 2 } },
  { id: 'sy03', line: 'wuxia', a: [0, 120], w: 60, syn: '万人敌', c: function (s) { return s.flags['t_万人敌'] && s.lineAge <= 1 && !s.flags.synDone; },
    t: '你的刀法学得太快。师父看了你一眼，说：我教不了你了。', e: { con: 2, int: 1 } },
  { id: 'sy04', line: 'apocalypse', a: [0, 120], w: 60, syn: '完美基因', c: function (s) { return s.flags['t_完美基因'] && s.lineAge <= 1 && !s.flags.synDone; },
    t: '你的血对病毒免疫。你被咬了三次，一次也没有变。', e: { con: 3, mood: 1 } },
  { id: 'sy05', line: 'cthulhu', a: [0, 120], w: 60, syn: '音乐神童', c: function (s) { return s.flags['t_音乐神童'] && s.lineAge <= 1 && !s.flags.synDone; },
    t: '你听懂了那段旋律。它不在人类的音阶里，但你跟着哼了出来。', e: { int: 2, mood: -1 } },
  { id: 'sy06', line: 'cyber', a: [0, 120], w: 60, syn: '天生老板命', c: function (s) { return s.flags['t_天生老板命'] && s.lineAge <= 1 && !s.flags.synDone; },
    t: '公司高层注意到了你。你被调去了第七十三层，那里能看到整座城市。', e: { home: 3, charm: 1 } },
  { id: 'sy07', line: 'apocalypse', a: [0, 120], w: 60, syn: '非酋', c: function (s) { return s.flags['t_非酋'] && s.lineAge <= 1 && !s.flags.synDone; },
    t: '你打开的每一个物资箱都是空的。但你还站着，这已经是个奇迹。', e: { mood: 2, con: 1 } },
  { id: 'sy08', line: 'palace', a: [0, 120], w: 60, syn: '天生丽质', c: function (s) { return s.flags['t_天生丽质'] && s.lineAge <= 1 && !s.flags.synDone; },
    t: '你入宫那年，所有人都记住了你的名字。这不是好事。', e: { charm: 3, mood: -1 } },
  { id: 'sy09', line: 'deepspace', a: [0, 120], w: 60, syn: '天选之子', c: function (s) { return s.flags['t_天选之子'] && s.lineAge <= 1 && !s.flags.synDone; },
    t: '命运在替你开路。你甚至不需要知道自己走对了没有。', e: { int: 2, mood: 2, con: 1 } },

var TEXT_PATCH = {"b01":"你扶着沙发边缘松开手，摇摇晃晃迈出第一步，膝盖一弯又站直。客厅里奶奶的瓜子撒了一地，爸爸举着手机忘了按录制，全家人的掌声比你还慌。","b09":"你能一口气背下三十四首唐诗，从「床前明月光」背到「春眠不觉晓」。年夜饭的酒杯刚放下，二舅就把你抱到凳子上，满屋子的红包都在等你开口。","p06":"四百米跑到第三圈，你的嗓子眼全是铁锈味，前面的人已经撞线。可全班没走，二十几个人挤在终点喊你的名字，喊得比冠军那一场还响。","p14":"你开始盼着每天下午收作业。她抱着一摞本子从后往前传，你把作业本压在铅笔盒底下，等她伸手来够，指尖擦过你的手背，你把那一下记住了整整一节课。","t02":"台灯亮到凌晨两点，卷子写完了三套，你合上笔帽时手指是麻的。第二天数学课，老师喊到你的名字，你从桌上抬起头，脸上一道圆珠笔印，全班都在笑。","t10":"你踩着砖堆翻过墙头，裤脚勾出一道口子。网吧的烟味还没散，教导主任的手电就照在你脸上。家长会那天，你的名字被念了三遍，母亲一直低着头。","t18":"一个穿夹克的男人在画室门口拦住你，翻出手机里往届学生的录取通知书，一张一张划给你看。他说你的线条有灵气，这条路能走。你捏着沾了铅笔灰的手指，没敢马上答应。","u08":"闭馆音乐响了两遍你才抬头，桌上摊着三本书，一本讲昆虫，一本讲航海，没有一本和你的专业沾边。窗外的路灯亮成一片，你抱着书走出来，忽然觉得这城市装得下很多东西。","w02":"会议室的门在你身后合上，走廊里还有人在看你。你拐进消防楼梯，坐在第三级台阶上，听见楼上有人冲水，有人打电话。等到腿坐麻了，你拍拍裤子站起来，回去把那版方案又改了一遍。","w12":"第九周的体测，卧推多了十公斤，教练拍拍你的肩说可以了。洗澡时你在镜子前站住，水汽散开，肋下的线条一条条显出来。你擦干头发，又多看了两眼才走。","w19":"手机一早震个不停，三姑发来一张陌生人的照片，二姨跟进三条语音，母亲最后补一句「你再不结婚就晚了」。你把群调成免打扰，才发现未读已经九十九条。","z07":"病房的门留了一条缝，监护仪的滴答声一下一下漏出来。你在走廊的塑料椅上坐到天亮，椅子硬得硌骨头，消毒水的味道钻进鼻子里。凌晨四点，护士推车经过，你站起来又坐下。","z15":"交易所的屏幕上跳出那串代码，红色的数字往上翻。你西装内袋里揣着员工工牌，编号是零三。钟声敲下去的时候，你站在第一排，手举得很高，掌心全是汗，喉咙里堵着一句谁也没听见的话。","o07":"你找出那支老钢笔，在扉页写下自己的名字，写到第三页就写不动了。窗外的麻雀叫得热闹，纸上的字越写越歪，笔尖压出一个墨点。你把脸埋进胳膊里，睡了一觉，醒来天已经暗了。","o15":"你手里有了那把钥匙，管着音响、电瓶和两卷备用延长线。晚上七点差五分，二十几个老太太在花坛边等你开箱。你把音量调大一点，全场跟着你的手势动起来。","x06":"晚上十点那条视频还只有四十个赞，你睡了。第二天手机烫得拿不住，播放量涨到两百多万，评论区一页页有人追问后来怎么样了。你搬了把椅子坐在阳台上，一条条看，看到眼睛发酸。","x14":"超市小票攒了十二张，你随手投进抽奖箱。广播喊到你的号码时，你还在看打折的鸡蛋。工作人员把大红绸带系到冰箱上，你一个人推着它走出商场，冰箱比你想的沉，也比你想的亮。","n08":"整栋楼的灯一起灭了，你摸黑下楼，发现花坛边已经坐了一圈人。有人搬出蜡烛，有人分瓜子，手机电筒照着几张平时从不打招呼的脸。你们聊到十一点半，才想起明天还要上班。","n16":"凌晨一点零七分，段位图标终于跳成金色，你截了图发出去，配文只写了两个字：到了。第二天早上再看，三个赞，其中一个是你自己的小号。你把手机扣在枕头上，笑了一下。","n24":"办完手续，你拎着装换洗衣服的塑料袋走出大门，在台阶上站住。七天没见的太阳晒在脸上，风里有槐树的味道。你慢慢走到公交站，走得很慢，每一步都踩得很稳。","n32":"那本旧书翻到第四十七页，掉出一张对折的方格纸，上面用蓝笔画着歪歪扭扭的路线，标着树、消防栓和一只猫。你顺着走下楼，终点画着一个小方框，正是楼下便利店的门。","g01":"满桌子人，二舅把筷子往桌上一顿，说女孩子读那么多书干什么，早点找个人嫁了。你低头把碗里最后两口饭吃完，还笑着说知道了。回房间关门的那一刻，你听见客厅里又碰了一次杯。","g09":"散会后领导拍了拍你的椅背，说这项目换别人早黄了，你比男的还能干。旁边两个同事低低笑了一声。你端着没喝完的咖啡站起来，说了句谢谢，走到洗手间看见镜子里自己在笑。","nn07":"你踩着餐椅，一手扶墙，一手去拧那颗旧灯泡，椅子腿在瓷砖上轻轻一响，你的腿就抖起来。灯泡拧上去，啪一声满屋亮。你跳下来，扶着椅子看了很久。","nn15":"信封是米黄色的，贴着邮票，你的名字用钢笔写得端端正正。你以为是老同学，撕开却是银行的对账单，逾期九十二天，红章盖得很正。你把纸叠回原样，塞回信封。","nn23":"它从水果摊底下钻出来，隔着五六步跟在你后面。你过马路，它绕着车走；你上台阶，它跳上花坛。走到第三条街的路口，你蹲下来伸手，它把脑袋塞进你掌心里，喉咙里开始响。","nn31":"梦里的号码你记得清清楚楚，兑奖大厅的地板亮得反光。醒来时窗帘缝刚透进白光，你摸过手机点开余额，四百六十三块二。你盯着那串数字看了三秒，把脸埋进被子笑出了声。","nn39":"六只猫在自行车棚前一字排开，全朝着东边坐，尾巴收得整整齐齐。你顺着它们的视线望过去，只有一面墙和几丛草。你在台阶上陪它们坐到日头偏西，什么也没等到。","ch_lottery":"找零的三块五你没要，换来一张薄薄的彩票，对折两下塞进钱包夹层，压在一张过期的会员卡后面。老板娘问你要不要自己挑号码，你摆摆手，说随便。","lg05":"医生把那张报告翻过来又翻回去，抬头看了你一眼，又低头看了一遍。他说你的身体年龄是二十八。诊室里挂钟在走，你捏着报告走出门，在走廊上把这句话默念了两遍。","lg13":"周五傍晚雨砸在空调外机上，哗哗响了两个钟头，你趴在窗边想这下完了。周六六点多你被安静吵醒，拉开窗帘，天是洗过的那种浅蓝，楼下的水洼还亮着。","r01":"一场低烧把你按在家里，药是苦的，稀饭是淡的。头三天你什么都不干，只管睡。到第七天，你发现早上醒来身上是轻的，晚上十点就困。半个月后回去上班，同事说你气色好了。","b02":"你扶着小板凳站起来，冲着厨房那个背影喊出第一声妈妈，清清楚楚，两个字。她手里的搪瓷盆咣当掉在地上，蹲下来把你搂进怀里，眼泪落在你后颈上，热得发烫。","b10":"那台电脑装在新打的木桌上，主机嗡嗡响，风扇吹得桌角一张糖纸轻轻发抖。你趴在桌沿，脸贴着冰凉的键盘托，看了一下午那片翻飞的彩色光带，眼睛都不酸。","p07":"老师念你作文的时候，教室后墙的电扇正好转到你头顶。你盯着课本上一个被铅笔戳破的小洞，感觉四十多双眼睛全落在左耳朵上，那地方烧得像贴了块膏药。","p15":"你把那只鼓着腮的青蛙塞进讲台抽屉。第三节课讲到一半，抽屉里忽然咚一声。老师尖叫着踩上椅子，粉笔撒了一地。第二天你爸穿着工装站在教室后门，脸黑得像锅底。","t03":"期中考试前，你从桌肚深处摸出一个折成心形的粉色信封，纸上有股淡淡的柠檬香。里面只有一页，字写得极工整，开头那个你描过两遍，落款是一个H。","t11":"决赛在少年宫三楼，话筒有轻微电流声。你念到最后一个长句时，台下忽然静得能听见自己咽口水。主持人报出一等奖的名字，你在掌声里走上台，奖状边缘有点割手。","u01":"绿皮车晃了七个多小时，行李架上的塑料袋一晃一晃。对面阿姨剥了个橘子，味道在车厢里散开。过隧道时窗玻璃浮出你自己的脸，你忽然低下头去拨弄鞋带。","u09":"凌晨三点半，屏幕蓝光照着四张油腻的脸，谁也没提天亮还有课。最后一局赢了，你们吼到嗓子发哑，倒头睡到下午四点。推开窗，食堂早过了饭点。","w03":"新公司的工牌还带着塑封的热气，边缘有点扎手。工资条上那个数字比从前多了一半，可你连打印机在哪都不知道。中午端着餐盘站在食堂门口，半天才找到一张靠墙的桌子。","w13":"你站在菜市场的菜摊前，学着别人的样子挑了一把青菜。回出租屋把火开到最大，油星子溅到手背上。菜有点咸，你还是把一锅饭都吃了，那个外卖软件从此再没打开过。","w20":"洗完头，地漏边那圈头发你捏起来掂了掂，比上个月多。你上网买了三瓶生发液，薄荷味的、姜味的、带小滚珠的，一排立在浴室架子上，瓶身上的字你每晚都要读一遍。","z08":"那一天你签字、握手、接过纸巾，眼睛一直是干的。半个月后回去收拾她的柜子，底层压着一件旧毛衣，樟脑丸的味道冲上来，你把脸埋进毛衣里，蹲在地板上哭出了声。","z17":"你在咖啡馆见了第一个人，她胸口别着一枚亮片胸针，说话夹着几个你没听过的词，还提到一上午能见三个。你的手指在自己那杯温水杯壁上滑了一圈，没接话。","o08":"你把手机举到一臂远的地方，念着家族群里的标题，又把一篇泡脚的文章转了进群。屏幕安静了整整两天，谁也没回。你还是照发，第二天早上又转了一条。","o16":"走到楼下，你又折回去拽了拽门锁，锁舌弹回的声音你听得很清楚。还没到中午，这已经第三次。晚上女儿打来电话，问，你最近是不是老忘事，你握着手机没吭声。","x07":"夜里你被一阵嗡嗡声弄醒，那声音像砂纸磨玻璃，又像收音机找不到台。整间屋子亮起一片白光，白得看不见自己的手。再睁眼是凌晨四点，枕头上一块凉湿的汗迹。","n01":"纸箱一打开，霉味和旧纸张的味道一起涌出来。一张褪色的电影票根，背面写着一个名字；半枚生锈的钥匙；一只落灰的马克杯。你在地板上坐了半天，没有起身。","n09":"农家乐的院子里挂着两串彩灯，话筒递到你手里时还是热的。你点了首老歌，起高了半度，唱到副歌彻底跑了调。桌边的人笑得前仰后合，有人拿筷子敲碗给你打拍子。","n17":"手机震动，卡池的金光一点点铺满整块屏幕。你从沙发上弹起来，在群里连发十几个感叹号，又补了一句。前面的消息很快沉下去，二十分钟三条回复，没有一条是给你的。","n25":"头三天最难熬，手一闲下来就往口袋摸。你改成每天嚼两包口香糖，薄荷味从早到晚没断过，第二周腮帮子开始发酸。一个月后你摸自己的脸，觉得下巴都硬了。","n33":"笼子里的鹦鹉忽然歪头，爪子敲了两下笼底，正好是你题上的数。围观的人都不作声。你回过神又出一道，它看了一眼，扑扇翅膀，头也不回，越过六楼的晾衣杆飞走。","g02":"那阵绞痛从小腹往上爬，你在会议室第三排把腰绷直，把这一周的数字一条条讲完。裙腰被汗浸出一道深色的边。散会你贴着墙进洗手间，捂住肚子蹲了很久。","g10":"酒桌换到第三轮，客户的眼睛开始发飘，你还能把杯子端平。你被拍着肩膀夸能喝，笑意在脸上停了停。洗手间镜子里的脸红得发亮，你接了一捧凉水，回到桌上举起杯。","nn08":"圆桌上的转盘转了一圈又一圈，喜糖纸黏在手心。邻座的男人聊起房贷，左边的姑娘一直在拍菜。你夹了三次同样的排骨，看了两遍墙上的钟，两小时只说了三句话。","nn16":"头三盆先后烂了根，一盆叶子软得像煮过。只剩这盆还立着，叶尖泛红，像被太阳晒透了。你把它搬到窗台最好的位置，每天出门前看一眼，觉得自己也算有点本事。","nn24":"剧场的椅子太软，第三幕灯一暗，你的眼皮就沉了。醒来时已到尾声，演员在台上鞠躬。你坐正身子，把手掌拍得又响又红，旁边的人回头看你一眼，你还在拍。","nn32":"它在你脚边停了一下，掉头绕开，又兜回来，沿着你的鞋尖画了一个圆，接着是第二个。传感器轻轻咔一声，转向，底下的刷毛还在转。你抬脚，它跟着抬了抬。","nn40":"旧书摊上五块钱买的散文集，纸页发黄，每页边上都有铅笔写的字，细细的，有点偏右。那些批注的语气你太熟，连圈句子的习惯都一样。翻到末页，你手心发汗。","ch_gym":"销售把你的手攥在掌心里，用力晃了三下，说你是他见过最有决心的一个。合同签在亮面上，笔很沉。年卡装进健身包的第一天，你在手机里订好七点的闹钟。","lg06":"三拨人挤在你家客厅，名片上的头衔印得很气派，都说你是样本级的。量尺贴上你的脸颊、锁骨、手腕，卡尺冰得人一缩。你妈捧着茶壶站在门口，一句话也没插上。","lg14":"教练示范了一遍，你跟着做，第三遍就顺了。他退回墙边，抱着胳膊看了你很久，什么也没说，只把手里的矿泉水瓶换了个手。别人的垫子还在原地，你已多做了两组。","r02":"你把闹钟拨到六点半，米提前一晚泡上，早上煮四十分钟。晚上十点半熄灯，手机扔在客厅充电。两周后起床不再发晕，指甲盖泛出一点血色，上四楼也不喘了。","b03":"你踮着脚够到茶几上的遥控器，绕过沙发扶手，啪地丢进鱼缸。气泡咕嘟咕嘟冒上来，爸举着筷子愣住，妈笑得直捶桌子，一桌人从鱼香肉丝笑到西瓜端上来。","b11":"你在沙发上踮脚翻跟头，手一滑，额头先撞上茶几角。急诊的灯白得刺眼，缝针的线一下一下穿过皮肤，你攥着妈的手数到三。额角从此留下一道月牙形的疤。","p08":"你把游戏机藏在被窝里，屏幕的光映着天花板。月考卷上的红叉连成一片，妈翻出床底那台、抽屉那台、同学寄存那台，一并锁进柜子。没过多久，你又借来第四台。","p16":"转学第一天，你被安排在最后一排靠窗。课间四十分钟，走廊上的人像水一样流过，没有人喊你的名字。你把课本包了三层书皮，在那张陌生的课桌上独自坐满一整周。","t04":"班主任把课本摊开在办公桌上，指尖点着页脚那些配了台词的小人，问你哪来这么多闲工夫。你盯着她茶杯里浮沉的枸杞，听见下不为例四个字。合上书时她嘴角动了一下。","t12":"额头和下巴接连冒出红肿的痘，你数了数，十七颗。早读时你总低着头，用刘海遮住半边脸，听见后排有人笑就以为在笑你。镜子擦得再亮，你也只敢看三秒。","u02":"你报名了话剧社，第一次排练就到熄灯。一群人蹲在操场台阶上分一袋辣条，聊到凌晨三点，宿管的手电筒扫过来，你们笑着往树后躲。那种热闹你记了很多年。","u10":"你熬了三个周末写出的选课提醒小工具，被一家公司发邮件问价。谈了两轮，八千块打进卡里那天，你在食堂多点了两个鸡腿。余额跳动的数字，你截了图存起来。","w04":"录用名单贴出来那天，你爸在小区门口把这条消息讲给三个熟人听。你妈拎着新买的音响去广场，舞伴们围上来问，她摆手说没什么没什么，一路笑到了晚上收队。","k02":"凌晨两点半，奶瓶、尿布、拍嗝，一轮接一轮。你梳头时手心里又是一小把头发，洗手台的下水口常常堵住。直到他扶着床栏转过身，含糊地喊了一声，你蹲在地上半天没起来。","z01":"部门聚餐，新来的实习生端着杯子走过来，喊你一声老师，问要不要敬你一个。你愣了两秒才应声。会议室角落那把你坐了十年的椅子，扶手已经磨得发亮，木头露出浅色的纹。","z09":"副业做到第四个月，后台结算的数字第一次超过工资条。你把两张截图并排看了很久，茶几上那份离职申请模板改了七遍，光标停在提交按钮上，窗外的天已经亮了。","z18":"体重秤上的数字比半年前少了二十斤。你翻出压在箱底那条牛仔裤，拉链一拉到顶，腰上竟还松出一指。你在镜子前转了个圈，笑得像个偷到糖的小孩。","o09":"电话簿里能拨通的号码越来越少。上个月送走老赵，这个月又收到一条讣告。你在灵堂外的长椅上坐了很久，手里捏着两只纸杯，其中一杯是替别人倒的。","o17":"居委会把大红的奖状和一桶油送到你家，说照片要贴进公告栏。第二天你买菜绕了远路，站在玻璃前看自己那张寸照，袖口有点皱。之后每天路过，你都要停一停。","x08":"你早忘了账户里还躺着那五千股，停牌公告一挂就是十年。复牌那天开盘涨停，你盯着屏幕上那一串红色的数字，手指发抖，把交易密码输错了两次才登进去。","n02":"教练坐在副驾，你握着方向盘的手全是汗。路口起步时一脚踩错，发动机轰地吼起来，转速表指针直蹿红区。车没动，档杆还老老实实挂在空挡上。","n10":"上线前最后一晚，办公室只剩排风扇的声音。你按下发布键时是凌晨四点十七分，屏幕跳出一行绿色的成功提示。三天后你烧到三十九度，裹着被子听同事在群里发庆祝红包。","n18":"手机在地铁上被摸走，你借同事的打过去，听见的只有关机提示。报警、挂失、补卡，忙到傍晚才想起来那一万张照片：外婆最后一张合影，还有猫刚到家那天的样子。","n26":"你在小区外圈跑了八百米就停下，扶着膝盖直喘，喉咙里泛起一股铁锈味。路灯把影子拉得很长，你走两百米再跑两百米，汗湿的短袖贴在背上。第二天傍晚，你又去了。","n34":"梦里你贴着墙角爬，六条腿蹭着瓷砖，触须扫过地面。惊醒后你一动不动，先试着弯了弯手指，又抬脚摸了摸床单，摸到十根脚趾才松口气。窗外天还没亮。","g03":"会议室里，对方经理问你们负责人什么时候到，又随口补一句，小姑娘先倒杯水吧。你把电脑放上桌，翻开方案第一页，抬头说：我就是。他端着茶杯的手停在半空。","nn01":"起飞时耳膜像被棉花堵住，你双手扣着扶手，把安全带摸了两遍。云在窗外铺成一片白，你却没敢松手。轮子擦地那一下，旁边的阿姨递来一张纸巾，说第一次都这样。","nn09":"摊主用袖子擦着那只青花小碗，说是老宅子里收来的，一百二给你。你摸黑抱回家，翻过来一看，碗底印着一行英文，年份是二零二三。你笑了半天，把碗拿去放钥匙。","nn17":"十一点零七分，门铃响。纸袋烫手，油在纸面透出两小块圆印。你坐在地板上咬下第一口，脆皮在齿间碎开，热气糊了眼镜。窗外有人遛狗，你忽然觉得，还挺好。","nn25":"阳台封了窗，铺木地板，装一盏黄铜壁灯，书架是按墙的尺寸定做的。装修完的第一年，你进去过三次：一次找胶带，一次躲电话，还有一次坐在那儿发了一刻钟的愣。","nn33":"屏幕上跳出一条短信，发件人是你自己的号码，只有两个字，别去。你回了三个问号，对面没有回应，通话记录里也查不到这一条。你把手机扣在桌上，坐了很久。","ch_debt":"十年没联系的老同学在深夜打来，声音发哑，说孩子在重症监护，还差五万。你握着手机听他那边仪器一声一声地嘀，三十秒后点开转账，输密码时手有点抖。","ch_write":"十二点以后，屋里只剩键盘声和冰箱的低鸣。你把白天没处说的话敲成段落，写完读一遍，改两个标点，发到一个只有三个关注者的页面。第二天早上，阅读数是零。","lg07":"那阵子只要挂上那个词，单子就自己找上门。你什么也没多做，只把仓库里压了两年的货重新上了架。三个月后对账，那个数字，抵得上同行埋头苦干十年。","ti01":"电梯门开，里面站着三个同事，有人抬了下下巴算打招呼。你低头解锁手机，划着一条早就看过的新闻。数字一格一格往上跳，到二十层，你跟着那三个人后面出去，谁也没说话。","f01":"醒来时先看见天花板上那排日光灯管，一根亮一根灭。嘴里插过管子的地方又干又苦。你想抬手，发现手腕上缠着线。护士凑近，你听见自己哑着嗓子问出的第一句是，我手机呢。","b04":"巷口那只白鹅突然张开翅膀冲过来，喙夹住你的裤脚，你一路跑一路哭，石子硌着脚心。后来你远远看见鹅群，就贴着墙根绕到马路对面去。","p01":"成绩单上两个一百，父亲把它折好塞进衬衫口袋。周末他带你进城，玻璃门一推，油香混着冷气扑过来，你捧着纸桶，连手指上的盐粒都舔干净。","p09":"厕所隔间的门被几个人堵住，一只手摊在你面前。你摇头，说没有。瓷砖上的水渍映着你的脸，脸上挨了一下，很响，耳朵嗡嗡的。上课铃响了，他们散开，你洗了把脸才回教室。","p17":"黑板上的字开始糊成一片，你眯着眼抄同桌的本子，抄错了两行。第一次戴上眼镜，你愣住了：梧桐叶上有清晰的脉络，对面楼的窗框原来有边框。回家路上你一直抬头看，看得脖子发酸。","t05":"最后八秒，球从三分线外传到手里，教练在场边喊。你起跳，手腕一送，球在篮筐上弹了一下，落进去。哨声响的同时，观众席站起来一片，你的名字被一遍遍喊出来，喊得走了音。","t13":"清晨六点半的操场起雾，你戴白手套，把绳扣在旗杆上。国歌第一句出来，你一下一下拉，绳子在手心有点滑。旗子到顶那刻被风撑开，底下几百颗脑袋同时仰着，你听见自己的心跳。","u03":"你们挤在夜市的小桌上吃一碗炒粉，她把辣椒挑到你的碗里，说以后就吃这个也行。回宿舍的路上你一直攥着她的手，指腹出汗也不撒开。那时候你真觉得，这辈子不会再换人了。","u11":"导师推开门，把一沓打印纸放在你桌上，问你愿不愿意跟这个课题。实验台上有消毒水的味道，离心机在角落里转到半夜。你第一次盯着屏幕上的曲线，觉得它和你有关，这感觉让你睡不着。","w05":"辞职那天你把工牌剪了，租下十二平米的小办公室。半年后服务器账单和房东的租金一起来，账上只剩四千三。员工一个个收拾键盘走人，你在空店里数剩下的一次性杯子，手机响是催款的。","w14":"三支股票连着涨了九天，账户里的数字从六万跳到十四万。你在午休时反复刷新那根红线，手指敲着桌面。同事过来问你怎么看，你讲了二十分钟，觉得他笨。","z02":"报告单上三个箭头向上，血脂、尿酸、肝功，最后一个后面印着小星号。医生翻着片子只说了一句，注意一下，说得很快。走廊里都是拿单子的人，你把纸对折两次塞进包里，回家路上去买了瓶无糖饮料。","z10":"旧宅的钥匙交了。新房子一百四十平，地板亮得能照出窗格。夜里你在客厅说话，声音撞到墙上又回来，沙发只坐了一个角。你想起老屋那面掉皮的墙，想起厨房里永远擦不干净的油渍。","z19":"会议厅坐满了人，前排有人举着手机拍你身后的幻灯片。主办方在门口念一串头衔，念到你的名字时停顿了半秒。签售的桌子前排了十几米，有个年轻人说，他是看了你五年前的论文入行的。","o10":"你按记忆拐进那条巷子，卖豆腐脑的棚子没了，修车摊没了，那棵被刻过名字的槐树也没了。推土机停在瓦砾堆上，风把灰吹进嘴里。你站了很久，才认出门牌的位置，那里现在是围挡。","x01":"雷雨里你抱着塑料袋跑过空地，白光一闪，耳边像有人炸开一只铁锅。你闻到自己头发焦了的味道，倒在地上还能动。回家照镜子，头发一根根立着，按下去又弹起来，硬了三天。","x09":"河边传来拍水的声音，你把外套一甩就跳下去，水凉得刺骨，孩子的棉衣吸饱了水，沉得像块石头。你把他托到岸上，自己趴着吐了两口水。三天后他家送来一面锦旗，红底金字，还带着折痕。","n03":"他坐在你家沙发边缘，说下个月工程款一到就还，手在膝盖上来回搓。你把攒了三年的五万转过去，微信只留一句收到。三年后他开新车来吃饭，钥匙放在桌上，一直聊油价，始终没提那五万。","n11":"人力在邮件里恭喜你，涨幅百分之八，你在工位上算了一遍，笑了一下。当天晚上房东发来消息，下月起每月加八百。你打开计算器，把两个数字并排放着，差额是零，连零头都不剩。","n19":"早高峰的车厢晃了晃，你抬头，看见对面扶杆边站着的那个人，外套还是旧颜色。你们对上眼，各自点了一下头，谁也没往中间挪。到站，他下车，你继续坐着，玻璃上有一层自己的影子。","n27":"报名费三千二，教材翻开第一页是问路。第三周你拖着行李箱过安检，广播里一串快速的英文，你居然抓住了登机口和延误这两个词，站在传送带前愣了两秒，忍不住笑了。","n35":"下午四点的太阳把人影拉得很长，你走两步，回头发现地上的影子还停在原地，慢半拍才跟上来。你干脆站定等它，它也停住，隔着一小段距离与你对看。路灯亮起时，它才慢慢贴回你的脚边。","g04":"水泥地上那颗石子把你绊倒，膝盖蹭掉一块皮，血珠慢慢渗出来。你哭了一声，旁边的大人皱着眉丢来一句，男孩子不能哭。那句话比伤口凉。后来你学会了疼的时候咬住腮帮子，把眼泪咽回去。","nn02":"大屏幕上的名字滚了十几秒，停在你工号上。主持人把纸箱推过来，一台空气炸锅，塑料膜上还贴着价签，三百九十九。你抱着它合影，笑得挺标准，心里算着现金红包能抵半个月房租。","nn10":"记账软件的第一笔是早餐四块五，你认真分类、截图、备注。第十一天你还在坚持，绿格子排得整整齐齐。第十二天你在商场刷了一双六百九的鞋，回到家点开图标，长按，卸载，动作很快。","nn18":"同事把第三份活推过来，你听见自己开口，说这个我做不了。声音比想象中平。手心在桌下全是汗，你在心里数了十个数，没人翻脸。那天晚上你十点半就睡了，一觉到天亮，中间没醒。","nn26":"为一句评论你和陌生人吵到凌晨一点，一条条回，截图，找他的逻辑漏洞。最后他不再回复，你把手机扣在枕头上，胸口还热着。第二天上班想起这事，你点开那个对话看了两眼，觉得没意思透顶。","nn34":"你在梦里听见一种从没学过的语言，音节黏在一起，像湿沙子。你竟然能回话，句尾有个往上翘的调子。对面那人笑了，说了一句，你听懂了却复述不出。醒来之后，你的舌头还保持着那个形状，怎么也想不起来。","ch_cat":"小区门口的保安亭下，一只橘猫缩在纸箱边，毛粘成一缕一缕，左耳缺了一角。它不叫，你走两步，它跟两步，尾巴竖着。你蹲下来，它把脑袋塞进你手心。你在便利店买了根火腿肠，回家找出一条旧毛巾。","ch_father":"父亲把坏掉的台灯拆开，零件一个个排在报纸上，让你用螺丝刀。他说这手艺不值钱，但能让人安心。那天你们修了三个小时，灯亮起来的时候，他拍了拍你的肩，手上的机油蹭在你衣服上。","lg08":"手机通讯录一页页往下翻，很多名字你已经想不起对应的脸。母亲走后，老同学的电话也停了，客厅里只剩座钟在走。你开始一个人吃饭、一个人挂号，午后晒着太阳，竟觉得这种安静也不错，又马上为这念头心里发紧。","ti02":"屏幕右下角的计时器跳到三十小时，窗外从黑变成灰。你的手指在键盘上抖，捡起掉落的东西要按两次。排行榜刷新，你的名字落在第一行，公会频道刷过一片惊叹。你笑了一下，站起来时眼前发黑。","f02":"半夜胸口像被绳子勒住，你扶着墙挪到门口，汗把睡衣浸透。救护车的灯在天花板上转，有人拍你的脸让你别睡，手臂扎进针头。醒来是在监护室，医生说命大。你盯着吊瓶里一滴一滴的药水，看了很久。","b05":"你把爷爷那副泡在玻璃杯里的假牙捞出来，塞进米缸深处，还伸手压了压米。晚饭前东窗事发，爷爷举着鸡毛掸子满院子追，你被按在门槛上结结实实打了一顿，哭声把院子里的鸡惊得乱飞。","p02":"开学第一周，老师点名让你当班长。你抱着点名册站在讲台上，把几个交头接耳的名字记到黑板角，教室里安静得能听见粉笔灰落下来。放学前你留了三个人的名字，回家的路上脚步都是轻的。","p10":"小狗从楼下的花坛边跑没了。你沿着小区一圈圈喊它的名字，从傍晚喊到路灯全亮，嗓子哑得发不出高音。保安打着手电帮你照草丛，你每听见远处有狗叫就跑过去，每次都不是它。","p18":"音乐老师把你排进合唱团最后一排，说人站得直，队形好看。演出那天你穿着统一的白衬衫，张嘴跟着大家一起动，声音全被两边的人盖住。灯光扫过来的那一刻，你把下巴抬得更高了。","t06":"你把作文本压在数学练习册下面写小说，写到一个男生在雨里等公交，笔尖把纸戳破了。十万字写满四个本子，被后排传着看，传到第三排有人回头冲你比了个拇指，你低头装作找橡皮。","t14":"厂里的通知贴出来那天，家里就安静了。晚饭桌上摆着一盘炒青菜、一碟咸菜，油星子很少。父亲把仅有的一点肉夹到你碗里，说自己血脂高。你扒着饭不敢问下个月的学费，窗外有人在喊收废品。","u04":"分手是在电话里说的，那边先挂了。你在宿舍楼下的长椅上坐到天发白，膝盖冻得发木，蚊子一直在耳边绕。六点半宿管阿姨开门倒水，你站起来拍掉裤子上的灰，回宿舍拿了书去上课。","u12":"因为标签贴错，组长在车间门口指着你骂了半小时，唾沫星子喷在安全帽上。你没有回嘴，只盯着自己鞋头的油污。回到宿舍蒙上被子，室友敲门问吃不吃饭，你说不饿，声音闷在棉花里。","w06":"饭局散场，那位做了三十年生意的老板拍了拍你的肩，说你说话的样子像我年轻的时候。他把一张写着电话的名片压在茶杯底下，第二天采购就留下了你的报价单。你回到出租屋，把名片立在台灯边看了很久。","w15":"账户里的数字一天比一天少，最后剩下的钱连下个月房租都紧。你把财经公众号一个个取关，删到最后一个时手指停了几秒，还是点了。手机扔在沙发上，屏幕的光照着天花板，屋里一点声音都没有。","z03":"理发师用小镜子照给你看后脑那一块，你抬手摸了摸，头皮凉得像块旧铜。你说干脆全推了吧，推子从额头一路推到后颈，嗡嗡地响。镜子里的人陌生了两秒，你付了二十块，出门风一吹，头皮发麻。","z11":"体检报告上一排向上的箭头，医生说烟酒都得停，再喝就要长期吃药。你点头点得很诚恳，把报告折成四折塞进包里。当天晚上老同学来了，你摸出烟盒递过去，说就这一根，饭后的酒还是倒满了。","z20":"因为一句关于手机的唠叨，孩子把房门摔得震天响，门框上的漆掉了一小块。你站在门外，手抬起来又放下，听见里面开始放很吵的音乐。客厅的电视还开着，你在沙发上坐到十一点，把要说的话过了一遍又一遍。","o11":"下午三点，你把小马扎搬到小区门口的老槐树下，棋盘一摊，老张就来了。你赢多输少，输的那局推子的时候说让着你，他笑骂一句。天擦黑收摊，你数着棋子回家，晚饭都吃得比平时香。","x02":"你在楼道口捡到它，翅膀上有一道口子，血已经干了。你拿纸箱给它做窝，每天去菜市场讨一小袋碎肉。养了半年，羽毛齐了，某个清晨你打开窗，它低头看了你一眼，扑棱两下就没了影。","x10":"天桥上风大，那位先生戴着一副掉漆的墨镜，捏着你的手看了半天，说你这条线中间断了一截，好在命里有贵人。他收了你五十块，找零时又少给五块。你走下台阶，风把摊子上的纸签吹得哗哗响。","n04":"初二的饭桌上，二姨把转盘一转，问你一个月挣多少。你笑着报了个数字，桌上安静了两秒，有人放下筷子说别逗了。你又笑，夹了一筷子鱼，把话题拐到表妹的学校上去。","n12":"你买了张去很远地方的车票，下车后沿着一条没有名字的街走了两个小时。路灯把影子拉长又缩短，路边烤玉米的香味一直跟着你。没有人叫你的名字，你把手机调成静音，一直走到腿发酸。","n20":"在门口写红包时，你琢磨了半天该填多少，最后写了个不丢人的数。酒席上八个凉菜转两圈就见了底，你夹了三筷子就放下。散场前被叫去和新人在背景板前合影，你笑得脸有点僵，回程的地铁上饿得胃响。","n28":"你把旧硬盘里的照片按年份排开，从穿校服的到穿西装的，一张张点过去。二十岁那几年你几乎每张都在笑，露着牙。到了去年，合影里的你嘴角只是平平地放着。你关掉文件夹，黑下来的屏幕映出一张脸。","n36":"半夜手机自己亮了一下，桌面上多出一个没有名字的图标。你点开，白底黑字只有一行：进度 3%。你划了几次退不出去，也找不到取消的按钮。三分钟后你锁了屏，那一行字还留在眼睛里。","g05":"包厢里的白酒是论杯走的，你陪着笑，一杯接一杯，去洗手间吐完回来接着敬。合同在桌上摊开，你签得手都在抖。第二天早上胃里像有只手在拧，你趴在床边够那杯凉水，够了好几次才够到。","nn03":"养了三年的仙人掌从底部烂成一片褐色，软塌塌地歪在盆里。你找了个鞋盒装它，剪一条白纸条缠上。楼下花坛边，你挖了个二十厘米深的坑，说话说到一半自己也觉得好笑，还是把土拍平了。","nn11":"你从中午打到天黑，泡面桶摞在电脑旁边，汤早就凉了。窗外的声音从车流换成广场舞，你摘下耳机，屋里静得能听见机箱的风扇。肚子好像叫了一声，又好像没有，你站起来，膝盖咔地响了一下。","nn19":"电梯卡在七楼和八楼之间，灯闪了两下，轿厢里只剩你和一位拎着菜的大姐。她先说起儿子在外地，后来你也说了自己的事。四十分钟后门被撬开，外面的人问还好吗，你们俩都笑，说聊得挺好。","nn27":"你在网上给爸妈订了两份体检，八百多一位，你妈在电话里念了三天乱花钱。体检那天你陪着排队抽血，报告出来一张张翻过去，指标都在正常范围里。你叠好塞进他们包里，说了句这下该放心了。","nn35":"你在备注里敲了四个字：多放点辣。商家回得很快，好的，小心点。你盯着这四个字看了半天，配送地图上那个小电车还在往前挪。外卖到了，盒子密封得很好，辣油沉在底下，你吃到最后一筷子才明白过来。","ch_rookie":"新来的小伙子连表格合并都不会，你讲了三遍，他点头又点头，眼里还是空的。第二天你八点二十到，他已经坐在工位上，桌上摆着两份早餐。你在心里叹口气，把多出来的那份推开，从第一行重新教。","lg01":"彩票是顺手买的，机选十块钱。夜里你对着手机一行行核对，那几个数字真的对上了。你没有喊，把票折起来压在烟盒底下，坐了三分钟，只对自己说了句：终于来了。楼下有人按喇叭，声音听起来很远。","lg09":"抽到第三十次，屏幕上还是那行恭喜未中奖。你把手机扣在桌上，忽然就笑了：这世上还有比这更稳定的东西吗。笑完你把页面关掉，去洗了把脸，水很凉，人一下子就清醒了。","ti03":"导航让你在同一个环岛绕了两圈，第三圈时你开始认出路边的广告牌。油表掉了小半格，你摇下车窗，一位牵狗的大爷在路边招手，说跟我走，穿过去就是。他的狗在前头带路，你慢慢跟着。","f03":"半夜你被肚子疼醒，冲进厕所吐到只剩苦水，吐完又拉，两天里只喝得下米汤。第三天你扶着墙走路都慢，闻到那家店的油烟味还是反胃。从那以后你上班绕开那条街，连招牌都不愿意看。","b06":"半夜烧到三十九度八，你被裹进一条旧毯子抱出门，楼道灯一闪一闪。针头扎进屁股那一下，你哭得整层楼都亮起了灯，护士塞给你一颗水果糖。","p03":"不知谁先起的头，课间有人拖长声音喊你那三个字，一遍比一遍响。你把橡皮捏成碎屑，整整三天只在纸上跟同桌说话，作业本边角被抠出毛边。","p11":"车后座被爸爸松开的那一秒，你连人带车栽进冬青丛，膝盖磕出三块淤青。第十几次之后，风忽然顺着后背推了你一把，你歪歪扭扭骑出二十米，回头喊：你看！","p19":"新家的墙还是白的，你的床靠窗，书桌上一盏台灯亮到半夜。你把书包、闹钟、玻璃弹珠一件件摆好又挪动，听见楼下爸妈压着嗓子说话，翻来覆去到天亮。","t07":"为了一本被谁先借走的漫画，你们在走廊上互相吼了两句，然后各自转身。整整一个月，你绕开他常走的那条楼梯，毕业照上他站在最边角，你连一句问候都没递出去。","t15":"三个月里你每天早上只喝白开水，把五块十块压进铁盒。鞋盒打开的瞬间，胶味混着新布的味道冲上来，你在镜子前走了十几个来回，鞋底在地板上吱吱响。","u05":"补考定在八月，宿舍楼只剩你一层亮着灯。空教室里吊扇转得很慢，草稿纸写满又翻面，监考老师打着哈欠看窗外。你算到最后一道题，忽然忘了自己为什么在这里。","u13":"凌晨四点的车间只剩机器在响，你盯着同一颗螺丝看了八小时。回到出租屋，窗帘拉死，楼下装修的电钻声钻进被子。第三个月你照镜子，觉得那张脸像是别人的。","w07":"第八次相亲在一家灯光偏黄的馆子，对方搅着柠檬水，问起你平时喜欢干什么。你愣了很久，脑子里先浮出的是排班表、外卖单和没回的消息，最后只笑了一下。","w16":"兑奖中心在写字楼十七层，你把口罩往上拉了拉，帽檐压到眉骨。工作人员递过表格，你握笔的手抖得写不成一个完整的姓，签了三遍才过。走出门，阳光刺得你想哭。","z04":"晚上八点，台灯下摊着口算本和削断的铅笔，你把同一道题讲第四遍，声音一层层往上走。孩子低着头抠橡皮，妻子在门口看了一眼，默默把血压计放回抽屉。","z12":"你在阳台支起折叠画架，颜料管挤得歪歪扭扭，第一张苹果画成了土豆。可每次收笔、洗刷子、看水槽里化开的蓝，你都觉得胸口那口气终于落回原处。","o02":"六点二十，公园的松树底下还挂着雾，你跟着一群老人推手、云手，鞋底蹭过湿砖。收势之后，三个棋友在石桌上摆开残局，谁输了谁去买豆浆。","o12":"捐赠仪式放在旧礼堂，红布横幅有一角没粘牢，风一吹就翻。你把存折推过去，说署名只写两个字。校长愣住，念出那两个字时，后排有个学生悄悄站起来。","x03":"旧书摊在巷口，纸箱里全是潮了的书，你翻到一本线装的，封皮上沾着酱油印。扉页用蓝黑墨水写着一行褪色的字，笔画扭得像水纹，你看了十年也没认全。","x11":"那张初中春游的照片不知被谁翻出来，配上一行字，在家族群、同事群里转了一圈又一圈。表妹发来三个笑哭的表情，你放大看自己张着嘴的傻样，笑着笑着把手机扣在桌上。","n05":"三点零七分，屏幕的光照在天花板上，你侧躺着刷别人的旅行、升职、婚礼，拇指一直往上滑。眼睛发涩，脑子却越来越亮，闹钟定在七点，你把手机翻过去，又翻回来。","n13":"灯一暗，全场的手举成一片乱晃的森林，你跟着唱每一句，嗓子在第三首就劈了。散场时耳膜嗡嗡响，第二天你开口只发出气声，同事让你把话写在纸上。","n21":"手机在下午三点震了一下，是母亲转来的第九篇养生文，标题后面跟着三个感叹号。你开会没点开，散会时回了两个字：收到。那头立刻跳出一朵玫瑰的表情。","n29":"窗台上的多肉第三片叶子轻轻抖了一下，一个很细的声音问今天几号。你愣了半天才答出日期，它说：谢谢，声音像纸页翻过。之后无论你怎么浇水、盯着看，它都只是一盆多肉。","n37":"地铁口的风把你外套下摆吹起来，对面那个人穿着同款旧夹克，连走路偏左肩的习惯都一样。{ta}抬头，你们的目光撞在一起，谁也没停，脚步却同时快了两拍。","g06":"六楼没电梯，纸箱从门口一直堆到楼道拐角，所有人都在喊「你是男的，你上」。你一个人把沙发、书柜、两箱书扛下三层，短袖拧得出水，没有人接第二趟。","nn04":"弦按得指尖起了茧，大横按还是按不响，你只会那一首，前奏弹到第三遍才顺。可每次拨到副歌，椅子吱呀一声，你闭上眼，跑调也照样把最后一句唱完。","nn12":"衣柜最上层空出一格，樟脑丸的味道还没散，那件洗得发白的旧外套不见了。你翻了三天储物间，最后在楼下垃圾桶边看见它，袖口磨破的地方还留着你缝的歪线。","nn20":"新手机换了三次，抽屉里那台旧机还带着裂纹贴膜。你偶尔给它插上电，等屏幕亮起来，翻到两年前的海边、火锅、和已经删掉的聊天，电量掉到百分之三才舍得关。","nn28":"红汤滚起来，白雾糊了眼镜，服务员抱来一只棕色玩偶放在你对面，说陪您吃。你先觉得好笑，后来涮毛肚、捞鸭血、把最后一片土豆吃完，一点没剩。","nn36":"早上七点整，鱼缸里的六条斑马鱼从水草后面游出来，一条接一条排成竖列，头都朝着过滤器的方向。你敲了敲玻璃，它们纹丝不动，七点二十又各自散开，像什么都没发生。","ch_flat":"拆迁通知贴在单元门口的玻璃上，红章压着一串日期。你回去那天院子里的石榴树正开花，砖缝里钻出草，你伸手摸了摸树皮上刻的那道旧痕，比记忆里矮了一截。","lg02":"话筒里先传出你自己的呼吸声，台下黑压压一片，第三排的手机屏像碎掉的星星。你讲到第十二分钟，声音有点抖，前排那位一直低头的女士抬手抹了下眼睛。","lg10":"任务框弹在视野角落：今天之内，让一个陌生人对你笑。你在便利店门口站了半小时，替一位抱纸箱的人扶住门，她愣了一下，嘴角松开。叮的一声，奖励到账。","ti04":"咖啡顺着键帽缝往下渗，你抽纸去擦，手肘撞翻旁边的水杯，半杯水全泼在主机上。屏幕闪了两下，黑了。你坐回去，把湿透的纸巾捏成一团，给领导发了两个字：请假。","f04":"河中央的水忽然变凉，你的小腿像被一只手攥住，直往下坠。再睁眼是碎石滩，有人还在按你的胸口，肋骨一下下地疼，围观的人说你脸色刚才是青的。","b07":"幼儿园门口，你搂着铁门框，指甲抠进掉漆的地方。老师的手掌温热，一根一根掰你的手指，掰到第三分钟，你听见自己哭哑了嗓子，走廊里全是消毒水的味道。","p04":"操场的沙坑边，你捡到一枚五毛硬币，边角被磨得发亮。你捏着它跑过半个操场，交到讲台上。下午老师把一朵红纸剪的小花别在你衣襟，胶水味还没散。","p12":"考场在少年宫三楼，草稿纸写满两页，最后一题你验了三遍。红榜贴出来，你的名字排在第一行。老师拍着你的肩，把一沓卷子塞过来：从今天起你跟我练。","p20":"抽屉最里面那二十块钱不见了，是你拿的。晚上算账，母亲数了两遍，父亲把烟按灭在碗沿上，谁都没看你。屋里安静了很久，只剩挂钟走动的声音。","t08":"墙上四十八张海报，边角用透明胶一层层压着。你把早餐钱省下来，铁盒里攒到三百七十块，买到看台最远的那张票。散场后嗓子哑了三天，你还在笑。","t16":"半个学期，你的课桌像被划出一道看不见的圈。分组时没人喊你，食堂里你端着餐盘走过一排排笑声，最后坐在窗边。那半年你学会了低头走快。","u06":"系里的公示贴在公告栏，你的名字在第一个。八千块到账那天，你去邮局填单子，手抖了一下，把整数全汇了回去。电话里母亲问够不够花，你说够。","u14":"你从图书馆出来，还没走完梧桐道，就有人隔老远抬手喊你的名字。食堂阿姨多舀半勺菜，说在晚会上见过你。你不认得他们，但都点头笑一下。","w10":"任命邮件在早上九点发出，你的名字排在总监后面。散会后走廊里的说话声一下停了，你走过，他们才重新开口。你成了最年轻的主管，也成了催进度的那个人。","w17":"下午四点，一个南方口音的男人报出你的身份证后四位，说账户有异常。你按他说的点了几个键，短信一条接一条涌进来。挂断之后，余额显示零。","z05":"冷战第十五天，两双拖鞋各在各的门口。傍晚他拎回一袋活虾，站在厨房门口说水开了。你接过漏勺，没说话。那顿饭吃了很久，谁也没先提吵架。","z13":"信纸是从作业本上撕的，格子很密。里面夹着一张奖状复印件，还有两片压干的野花。末尾「谢谢您」三个字用力太大，纸背都透了印。","o05":"麻醉面罩扣上来之前，你数到七就断了。醒来喉咙里插着管子，胸口一道缝了十七针的疤，天花板的白灯亮得发青。那两个月的下午，你数窗外的梧桐叶。","o13":"六只陶盆挤在阳台护栏边，月季、茉莉，还有两盆叫不出名的草。清晨浇水，水顺着砖缝往下滴，楼下路过的人会仰头看一会儿，有人问这是什么花。","x04":"梦里那个你穿着起球的旧毛衣，蹲在楼道口吃一碗凉面，说这辈子就这样了。醒来窗帘漏进一条白光，你伸手摸了摸自己的被子，忽然很想笑。","x12":"复查报告在手里被捏出折痕，你从一楼走到门口，站了四十分钟。风把梧桐叶吹到脚边，你数过一辆又一辆救护车，才想起该给家里打电话。","n06":"报告单上有三项箭头朝上，医生用笔尖敲了敲其中一行，皱着眉说问题不大但要注意。你把那张纸折成四折，塞进包里最深的夹层，一路没再拿出来。","n14":"桥面离水面六十米，风把安全绳吹得啪啪响。你在跳台边来回挪了十分钟，听见下面有人喊快点。第三次数到一，你闭眼栽下去，把嗓子喊破了。","n22":"班主任在群里点名请家长回复，你对着输入框删了又打，最后只发了收到两个字。按下发送前，你又检查一遍有没有错别字，手心全是汗。","n30":"电梯里只有你们两个，他鬓角比你白，外套款式和你衣柜里那件一样。他说千万别买那支股票，声音像隔着一层水。门开了，走廊空着，人不见了。","n38":"凌晨换台的时候，屏幕里出现你的教室、你的自行车、你摔破过的膝盖。右下角一行小字：已加载百分之八十七。你伸手按下电源，屋子一下黑了。","g07":"产假回来的第一个早上，你的抽屉被清空，纸箱搁在打印机旁，风扇一转纸就飞。你抱着水杯站在过道里，没有人抬头，键盘声很密。","nn05":"推车在米面货架间停下，你们隔着两排酱油对上眼，各自把车头一拐。你盯着价签看了很久，听见他的车轮声在另一头慢慢远了。","nn13":"石桌边围了七个人，你站在最外圈，看红方的马跳过河。半小时后一盘和棋，你回家路上拐进文具店，买了一副最便宜的象棋，塑料袋晃了一路。","nn21":"圆桌上的转盘转了三圈，话题从学区房到补习班。你笑着给每只杯子添茶，壶底最后一滴也倒干净。有人问你最近忙什么，你说还行。","nn29":"第一次做那道红烧肉，糖色炒糊了，锅底一片黑。后来你记准了火候，每年腊月二十八开火，砂锅咕嘟一下午。桌边从四双筷子变成了九双。","nn37":"旧手机充上电，语音备忘录里躺着一段四十分钟的录音。是你的声音，语速很慢，反复念几个地名和一个日期。你听了三遍，一句也没听懂。","ch_checkup":"彩超室里凉得厉害，探头压在脖子上，屏幕上有一小块灰白。医生在报告上敲了几行字，说建议复查不用太紧张。你捏着单子，把这句话翻来覆去地想。","lg03":"事务所的会客室有股旧纸味，文件翻到最后一页，签名处还空着。你写完名字，律师把笔帽扣上，说了句恭喜。你回去对着那串零数了三遍。","lg11":"地下通道的回声很大，你弹完最后一个和弦，琴盒里落进三枚硬币。第二天手机响个不停，那条视频的播放量过了两百万。有人在下面问这是谁。","ti05":"八百米最后一圈，钉鞋踩过弯道，你喉咙里全是铁锈味。三千米终点线后你扶着栏杆吐了，看台上有人喊你的号码。两块金牌挂在脖子上，沉得压肩。","f05":"钢管从六米高的脚手架上滑下来，砸在你右肩上，安全帽滚出去老远。工友抬你的时候，天上正下着小雨。那三个月，石膏从腋下一直打到腰。","b08":"幼儿园滑梯旁，你一把夺过那个孩子手里的小熊玩偶，抱在怀里退到墙角。老师蹲下来问是谁的，你把下巴一扬：「我先看见的。」他哭得直打嗝，你低头看玩偶那两颗玻璃眼珠，忽然不敢看他的脸。","p05":"趁父母午睡，你踩着凳子从顶层柜里抽出一本，再一本。三册《十万个为什么》读到天黑，书脊被压出折痕。晚饭时父亲说天要下雨，你抬头纠正：那是积雨云。他愣了一下，没接话，你第一次觉得大人也有答不上来的时候。","p13":"礼堂幕布拉开，你站到话筒前，伴奏带沙沙响了两秒。唱到第二段你忘了词，索性闭上眼。掌声从最后一排涌上来，班主任在侧台拍得比谁都用力，掌心红了一片。下台时你摸着发烫的耳朵，觉得自己整个人在发亮。","t01":"那年冬天，你的裤脚一截一截往上缩。三月新买的裤子到六月就吊在脚踝上，母亲拿粉笔在裤脚画了道线。夜里你被小腿的酸痛弄醒，骨头缝里像有人拧螺丝。一年后墙上那道铅笔线，被你追高了十五厘米。","t09":"成绩单贴在教室后墙，你先在第三十名那栏找自己，没有。再往上看，第五名，名字是你的。你退后半步，又往前凑，怕看错行。同桌用胳膊肘捅你，问抄了谁的。你摇头，喉咙发紧，半天没说出话。","t17":"竞赛班的教室在顶楼，夏天空调坏了，二十个人守着一台风扇。你每天做完两套卷子，草稿纸堆到窗台。有个男生边哭边写，把笔一摔又捡回来。你也是。深夜关灯时，你摸着发烫的脑子，居然还想再来一题。","u07":"工资到账那晚，你数了三遍，两千三百四十块。你拉着室友去后门那家烧烤摊，点了二十串羊肉、四瓶啤酒。油烟熏得眼睛发酸，你举杯说今天我请，他们起哄。你把签子往他们盘里塞，一串也没给自己留。","w01":"入职那天你领了工牌和一台笔记本，工资条上的数字让母亲在电话里沉默了几秒。然后加班来了。晚上十点，园区只剩你们这层亮着，保洁在拖走廊。你合上电脑，看见对面楼也还有几十格灯亮着，像一排没睡的牙。","w11":"名单是人事念的，念到你名字时她抬了一下眼。你回到出租屋，第一周把窗帘拉死。泡面箱子堆在门后，从十二箱吃到只剩三箱。楼上在装修，电钻从早响到晚，你躺着听，觉得那声音像在拆自己身上的零件。","w18":"你在小区后门捡到它，瘦得肋骨根根分明，橘毛打结。头一周它躲在鞋柜后面，只露出一只耳朵。后来你回家开门，总听见一声闷响，它从沙发上跳下来，站在门口看你换鞋，等你走近，又扭头走开。","z06":"你开车上高速，父亲在副驾反复调座椅，母亲在后座剥橘子，皮收进保鲜袋。景区门口排了四十分钟队，你们拍了两百多张照片。回家后它们一直躺在相册里没整理，孩子的门牙后来换掉了，照片里还豁着。","z14":"酒店门口停着一辆墨绿色的车，车标你认不出。车门开了，下来的是当年坐最后一排、总被老师叫错名字的那个人。他穿一件很普通的夹克，跟每个人握手。你端着半杯橙汁站在柱子旁，忽然想起自己借过他一块橡皮。","o06":"你把老房子租出去，搬到儿子小区隔壁那栋。每天早上七点二十，你牵着孙辈的手过两个红绿灯。红领巾总系歪，你在单元门口拆了重系，绕两圈，穿过扣，拉平。手指记得这套动作，比你以为的记得。","o14":"你不过是把阳台那盆月季拍进手机，配了句今天开了七朵。第二天醒来，播放量后面多了一串零。评论里有人叫你最优雅的奶奶，问你施的什么肥。你戴着老花镜一条条读，读到中午，锅里的饭都忘了按。","x05":"商场门口，一个挂着相机的男人拦住你，说你的骨相很上镜。他让你原地转了个圈，问你想不想签约，用圆珠笔在你手背上写下一串号码，墨迹被汗洇开。你等了一个月，后来鼓起勇气打过去，是空号。","x13":"它从巷口一直跟到单元门口，在第三级台阶上坐下看你。你上楼，它在楼下叫了一声。你端着一碗剩饭下来，它不扑，等你退开两步才低头吃。第二天早上它还在，毛上落了一层夜里积的灰，尾巴扫了扫地面。","n07":"台风那晚，风把窗玻璃压得往里凹。凌晨两点，阳台铁架倒了，三个花盆接连砸下去，把楼下自行车棚的顶棚穿了个洞。第二天你下楼，一楼的阿姨站在碎陶片中间，从你搬来那年一直骂到那盆兰花。","n15":"那盆绿萝是搬家时别人送的，你随手搁在书架顶上。半年后藤蔓垂下来，绕过书脊，摸到窗台。你剪了几段插进玻璃瓶，一周后冒出白根。你蹲在那儿看了很久，水珠在根须上挂着，你觉得自己好像也会养点什么。","n23":"银行短信来时你正在地铁上，利率降了零点几个百分点。晚上你打开表格算了四十分钟，把等额本息翻来覆去算三遍。结果是每月省十四块六，两杯奶茶。你盯着那行数字笑了一下，把表另存成了一个新文件。","n31":"你在开会，手机在桌上震。低头看，猫踩过键盘，替你回了句好的，谢谢您，明天上午给您。标点齐全。领导在群里回了个大拇指。你回家盯着它，它打了个哈欠，尾巴尖扫过你搭在椅背上的工牌。","n39":"生日蜡烛前，你许愿长高。半个月后下楼梯踩空，脚踝肿成馒头。骨科医生给你上了牵引，在床上躺三周，每天拉一点。出院量身高，从一米七二变成一米七五。你扶着墙站直，不知道该谢谁。","g08":"你单手抱孩子，另一只手拎着菜，在小区花坛边歇脚。邻居阿姨凑过来问，今天妈妈不在家？你说我会带。孩子抓着你的衣领，把口水蹭在你肩上。你把他往上颠了颠，继续走，走得比刚才稳当。","nn06":"母亲把你拉进群，群名叫家和万事兴。第二天早上六点零三分，第一条早安带着三朵莲花到。到六点二十，十几条已经排好队，还有一段养生视频和一张朝霞图。你把群设成免打扰，却每天点开把它们看完。","nn14":"除夕下午你系上围裙，冰箱里摆着八样备好的料。红烧肉手一抖倒了半勺盐，第二道又半勺，最后只有两道是淡的。父母每盘都夹，父亲吃完说咸点好下饭。你背过身收碗，水龙头开得很大。","nn22":"你把充电器挪到客厅，十点半躺下，第二天六点就醒，觉得自己有救了。第三天朋友发来一个视频，你想看完就睡。再抬头，窗外有车过去，屏幕上是凌晨两点十七分。你翻个身，又滑开下一个。","nn30":"早上楼下车位只剩一截被剪断的锁。你算了算打车钱，决定走。四十分钟的路，第一周腿酸得抬不起来，第三周开始有空看路边的树。一个月后站上秤，六斤没了，你对着那个数字愣了挺久。","nn38":"同一个路口，七点四十，他穿灰外套过斑马线，你在等红灯。三天，你开始留意他的鞋。第四天红灯变绿，那人没来。你过了马路，在对面站了一会儿，看着车流，觉得自己有点可笑，又有点空。","ch_crush":"包厢里有人喊你的名字，你回头，看见她站在灯下。头发短了，颧骨比记忆里明显，笑起来还是先抿一下嘴。她端着杯子走过来，说好久不见。你碰了杯，杯沿一点凉，话到嘴边成了一句你瘦了。","lg04":"又是那条走廊，瓷砖缺了一角，尽头那扇门开着。这次你停在门口，先听见自己的呼吸。你转过身，走另一侧的楼梯下去，一级一级，脚底很稳。醒来时枕头是干的，窗外刚亮，你躺着把这一遍重放了三回。","lg12":"巷子里三个人围上来，其中一个手里有刀。你不记得自己怎么动的手，只记得最后蹲在地上，用袖子按住那人手背的口子。血渗过布，是热的。他疼得骂了一句，你听见自己说别动，就快好了。","ti06":"整晚你都在追一道几何题，辅助线画了又擦。梦里那条线从顶点垂下来，正好落在圆心上。六点四十，早自习铃还没响，你在草稿纸角上写下证明，笔尖压穿了一格。答案是对的，你笑出声，把同桌吵醒了。","ar_ap":"你用了整整三个月才接受这条规矩：天黑以后不许开灯。铁皮窗钉死，蜡烛只留半指，光一旦漏出去，楼道里的锈味就会跟着脚步声一起爬上来。","ap04":"队里有人发起烧来，三十九度八，退烧药早换成半板过期的药片。全队守着那盏矿灯坐了一夜，谁也没说话。天亮时他的行军床空了，褥子上还留着一个人形的凹痕。","ap12":"你爬上十七层的水塔顶，看见整座城市在烧。火从西边的化工厂一路舔到江堤，罐头盒在热浪里噼啪爆开。没有警笛，没有喊叫，只有风把灰吹进你嘴里，咸得像铁。","xx04":"一位穿旧麻袍的老道绕着你走了三圈，说你根骨里藏着三分灵窍。他问你肯不肯拜师，你还没答话，膝盖已经砸进青石缝里，磕出闷响，额上的土蹭了他一袖子。","xx12":"山道旁的野狐蹲在青石上，尾巴缠着半截红绳，忽然开口说你前世欠它一炉丹。它伸出前爪按在你眉心，凉得像井水，说要按年息三分慢慢收，先收你三年寿数。","wx03":"刀锋从那人的锁骨滑进去，血是热的，喷在你手背上。当天夜里你吐在客栈后院的阴沟里，把酸水都吐干了。第二天你照常要了一碗面，只把肉片一片片拨到桌角，喂了野狗。","wx11":"雨把破庙的门槛泡软了，你缩在泥胎佛像背后烤火。一个喽啰提刀追进来，脚下一滑，你顺手用刀鞘磕在他后颈上，把他按进供桌下的泥水里，让他数到一百再起来。","cy08":"账户里的数字终于够买一具新壳子：七成合成肌、钛合金指节，原装汗腺要另加钱。义体医生用霓虹光照着你的旧身体，问哪一处先切。你盯着罐里那颗还在跳的旧心脏，说从腿开始。","ds05":"舰务会上，三副提了一条穿越尘埃带的航线，说能省十一天燃料。你在舱里对着协议条款算了三天，把每个节点的小数点都核过，发现第三段静默期正卡在别人的观测窗口里。","in01":"第一个副本刷在一家废弃医院，编号零一七。走廊尽头的日光灯每隔四秒闪一次，你靠在轮椅上数，数到第七次，灯灭了，整层楼的呼吸声同时停住。","in09":"铁门要落下时，队长把新人往你怀里一推，自己退回了门后。他背对着你们，抬手摆了摆，像赶一只蚊子。门缝合拢前，你听见他在数数，一、二、三。","ct05":"退潮后的沙滩上，你捡到一枚巴掌大的石像，青灰色，刻着盘曲的东西，数不清有几条腕足。它摸上去是温的，像刚从谁怀里掏出来。海腥味忽然浓了，袖口留下一圈湿痕。","pa01":"内务府的册子上，你的旧名被朱笔划掉，旁边添了两个字。掌事姑姑教你应声的调子，说往后谁叫这两个字，你都得在三步之内跪下。夜里你对着铜盆里的水，把旧名念了三遍。","pa09":"冷宫的墙根常年渗水，被褥有股霉味。住东厢的老妃子指甲缝里全是泥，她教你认墙缝里的草药：车前子治水肿，苦艾能止血。她掐着叶子说，这里的规矩只剩一条，别让人知道你会治病。","apF3":"分罐头的时候，你把勺子在桶底刮了三圈，听见储物架后面有塑料纸的响。有人把半块压缩饼干塞进了棉袄内衬。你没吭声，只在本子上画了一道，算第一笔账。","xxF3":"集市上那个摊主非说你碰碎了他的玉瓶，伸手要拽你的袖子。你一掌拍下去，木摊子连布带秤化成一片灰，风一吹只剩焦味。你摸出三块下品灵石搁在他脚边，说赔摊子，不赔嘴。","wxF3":"刀断在第七招，断口亮得刺眼。你在铁匠铺门口的石阶上守了三天，雨把衣裳浸透又晒干。铁匠终于开门，掂了掂那半截刀身，又看你的手，说这刀比人识相，你比刀还倔。","cyF3":"第一笔工钱到账那天，你去巷子深处吃了碗牛肉面。汤是牛骨熬的，浮着油花，肉片厚得能立起来，面条有麦子的味道。你把汤喝到见底，霓虹在玻璃上闪，差点把眼泪掉进碗里。","dsF3":"补给船带回一封延迟了三十年的家书，纸边被真空袋压出折痕。母亲的字还停在那个年代，说院里石榴今年结得多，末尾添了一句：别做太危险的事。你把它折回原样，塞进胸前的口袋。","inF3":"你和那个老手在候场区立了约定：谁先死，另一个替他把积分换成现金，送回家里。你们都没问名字，只互报了编号，他用刀在墙上刻了一道，说认这道痕就够了。","ctF3":"你养了一只黑猫，从码头捡回来的，左耳缺一块。它每天蹲在墙角，盯着那片剥落的墙皮看，一看就是几个钟头，瞳孔缩成一条缝。夜里它偶尔对着空气低吼，喉咙里有海水的声。","paF3":"宫里赏了你一只白猫，雪团似的，脖子上系着红绸。皇上逗它比逗你多，御膳房单给它备鱼，连香炉都挪到它不呛的位置。它卧在软垫上舔爪子，你跪在阶下请安，指甲掐进掌心。","ar_in2":"你花了三个月才想明白：通关不是终点。积分榜上的编号会一直往上加，副本的门在你睡着时自动刷新。你开始把每次进入都记在本子上，写到第七十页时，字迹开始发抖。","sy06":"第七十三层的调令是凌晨三点发到终端的，字是冷的。电梯上升时耳膜发胀。落地窗外整座城市铺在脚下，霓虹像血管一样亮着，雨水在玻璃上爬。有人递来一杯不加糖的咖啡。","ar_xx":"你花了三个月才信这不是梦。蒲团上磨出两个深窝，每天卯时气沉丹田，数到第三百息时窗外有仙鹤掠过，你硬是没睁眼。","ap05":"超市的应急灯只剩一格电。你和他隔着翻倒的货架对视，他枪口垂着，你听见自己喉咙里的吞咽声，谁也没开口，各自退进黑暗里。","ap13":"第四天，右小臂那圈牙印结了薄痂，不黑也不烫。你把袖子放下来，照常分罐头、照常报平安，只在夜里拿锈刀一遍遍刮那道印。","xx05":"丹炉裂了三道缝，你守着文火熬到第七夜，才得一颗浑圆的青丹。药铺掌柜拈了拈，数出三十块下品灵石，叮当落进你的袖袋，够吃半年。","xx13":"师父留下的半块断玉，你一直贴身收着。玉上刻着半个字，另外半个跟着他一起烧成了灰。一到下雪天，玉就是凉的。","wx04":"醉仙楼二层，七八个刀客围着一个素衣姑娘。你摔了酒碗，掀翻木桌，酒气混着泥腥。三招过后刀客散了，你才知道她是青城掌门的小女儿。","cy01":"中间人在霓虹巷口递给你一枚冷得像冰的芯片，说只要从云端第七层拷出十二秒的数据，报酬够你在黑市换一条二手义腿，连神经接口都包。","cy09":"先是招牌，再是路口的全息广告，全在你眼底一明一灭。你抬手按住右眼的义体，散热片烫得能煎蛋。维修铺老头说：不是灯坏了，是你在坏。","ds06":"你在主控舱算了整夜，冷却液滴到第七块面板。模型跑了四万次，只有十二次人类活下来，概率 0.0003%。你把舷窗的遮板拉下来，天还没亮。","in02":"老手把烟按灭在编号 077 的门框上，说副本里的「原住民」会记得你上次说过的话。他们不怕你，不躲你的刀，还主动递水，这种人一个都别信。","in10":"你在第三副本的厕所里对着镜子站了十分钟。他用和你一样的姿势抬手，指甲掐进小臂，血珠渗出来，疼得真实。可积分面板上，你的编号后多了个括号：可刷新。","ct06":"旧书店的霉味里混着一股海腥。老板从眼镜上方看了你一眼，指节敲着柜台，说：「你来晚了三十年。」柜台后的挂钟停在三点十七分，钟摆还在动。","pa02":"御花园的海棠开得正盛，一只纸鸢卡在杏树枝上。你听见衣料摩擦的窸窣声，立刻低头屈膝，额头几乎贴到青砖，只看见一角明黄袍摆和绣云纹的靴。","pa10":"一个四五岁的孩子从廊下跑来抱住你的腿，仰脸叫娘娘，手上还沾着桂花糕的碎屑。你蹲下去替他抹掉嘴角的糖渍，忽然眼眶发热，忙用帕子掩住。","apF4":"你在塌了半边的电器行里翻出一台收音机，拧了半小时才响。老歌断断续续放了一整晚，隔壁楼有人跟着哼，调子全错，你却听得出那是首情歌。","xxF4":"辟谷满百日那天，你在溪边打坐，闻见山下炊烟里的一丝咸味。喉咙动了动，胃里空空如也，才发觉自己想的不是米，是粗盐粒在舌尖化开的那一下。","wxF4":"巷口的泥还湿着。那个扎双髻的小姑娘把一包桂花糖塞进你手里，油纸包得歪歪扭扭，糖上沾了灰。她说上次是你把野狗赶走的，说完就跑了。","cyF4":"酸雨下了两天，天桥的积水泛着紫光。你靠着锈蚀的钢柱站了两个小时，看雨把巨幅广告牌上的那张脸一点点冲花，先是眼眶，再是下颌，最后只剩一片霓虹。","dsF4":"从第七个航段起你就睡不着。夜里舷窗外全是星星，你一颗一颗数，数到第四千颗时，舱顶的灯自动调亮，协议提示：已进入白昼周期。","inF4":"安全屋的墙是水泥的，你用匕首尖刻正字，一笔一划，刻满十面墙。刻到第五十三个的时候，刀尖崩了，断口扎进指腹。你捏着断刃，听见门外有人在数数。","ctF4":"梦里有人贴着你的耳朵叫你名字，声音像湿透的绳子。你惊醒，浑身冷汗，摸黑抓过纸笔把那三个字写下来。天亮一看，字迹歪斜细长，不是你的手。","paF4":"太后拈着你的折子，只说了句字还算端正。你回去把这三个字临了一整年，每日三百遍，宣纸堆到窗台。入冬手腕肿得像发面馒头，握不住笔就绑着布条写。","ar_ct2":"头三个月你不敢关灯，灯绳剪短了挂在枕边，一伸手就能拉。直到第四个月的某个夜里，你听见床底下有海水涨落的声音，才明白关不关灯，它都在。","sy07":"你撬开第七个物资箱，里面只有一层锈末和半张发霉的报纸。前六个也是空的。你把撬棍插回腰后，抹了把脸上的灰，风从破窗灌进来，你还站着。","ar_wx":"你在破庙里练了九十天拔刀，掌心磨出三层茧。刀不是拿来吓人的，第一课只有四个字：活着回来。泥地里那半壶劣酒，算是给自己壮胆。","ap06":"四个月里你磨钝了两把消防斧，斧刃上结着暗红的锈。你也学会了贴着墙根走，鞋底缠破布，踩过碎玻璃时只听见自己的呼吸。","ap14":"第一场雪落下时，仓库里的罐头只剩十七罐。夜里零下二十度，冻死的人被拖到墙根码成一排，比被咬死的还多，有人死时手里还攥着半块饼干。","xx06":"师兄把那处聚灵的洞府占了，说是他先看见的。你数清他腰间多了三块中品灵石，低头行礼，把名字和日子刻在玉简背面。","xx14":"整整十年，丹田里的灵气只够绕行三周天。你数着洞府外的松树一年长一寸，开始怀疑当年那道雷光，不过是运气好。","wx05":"你在后院劈了三千次木桩，刀路终于连成一片雪光。师父捧着酒碗看了半晌，喉结动了一下，只说：「够了，别再练了。」碗里的酒晃出一圈涟漪。","cy02":"左臂接口处渗出淡黄的脓，义体在皮下低鸣，像有只虫在啃线路。医生弹了弹屏幕上的价目：「加点钱，换第七代，排异能少三成。」","cy10":"你把那段录音塞进公共节点，进度条走了十九秒。三分钟后，从地铁广告到高楼幕墙，全城的霓虹一块块熄灭，只剩雨里的红点。","ds07":"值班第七小时，观测站发来一条短讯：编号七十七的恒星在两次扫描之间熄了，星图上只剩一个空位，连残骸的光谱都没有。","in03":"副本编号四零九的走廊里，那东西隔着一道铁门喊你的小名，连尾音上扬的调子都学对了。你咬破舌尖，才没应声。指甲掐进掌心，血顺着指缝滴在积分的金属牌上。","in11":"安全屋的门闩了三道，你睡了十二个小时，没有梦。醒来先摸自己的脸，再数手指，最后核对墙上的编号，确认这块身体还归你。","ct07":"你扣下扳机时，走廊里全是海腥味，灯管在头顶嗡嗡地闪。倒下的是他，胸口开着一朵暗红的花。你发誓那一瞬他脸上有鳃在动。","pa03":"那盏雨前龙井的香气比平日甜了一分，盏底沉着几点化不开的白。你端着它走到廊下，慢慢倒进花盆，从此只喝自己守着炉子烧开的水。","pa11":"你在窗下坐了一个下午，绣绷上的鸟有灰蓝的翅，翅尖被窗棂的影子压住。针脚走得很密，线用了七色，唯独没绣笼子。","apF5":"你在半本小学练习册上写字，铅笔是从教室废墟里捡的。第一页只写了天气：晴，有尸臭。写完你数了数剩下的纸，还有四十一页。","xxF5":"养了三年的白狐咬断锁灵绳跑了。三个月后它蹲在洞府门口，毛色油亮，肚子圆了一圈，颈上还挂着半截别家的灵符。你没问。","wxF5":"你在城西那家客栈住满一年，房钱按月压在柜台。每晚一碗浑汤，老板娘总会多舀一勺，油花浮在碗沿，她从不说话，只把抹布搭回肩上。","cyF5":"你三年没登录过那个账号，它却每晚准点发照片：同一家面馆，同一副笑。点赞数比你记得的还高。它学着你的口癖，比你更像你。","dsF5":"第七次值班轮到你守舷窗。地球从月影边缘升起来，蓝得发白，像一枚刚擦净的硬币。你把脸贴在冷玻璃上哭，鼻涕糊了满手，舱内静默无人。","inF5":"你在现实里请了一天假，买了张下午场的票。散场灯亮起时，你正默数影厅的出口数到第三处，手心还攥着那张票根，像攥着一张积分卡。","ctF5":"诊室里有一股消毒水混着旧书的气味。你把那晚的事从头说了一遍，说到符号时声音发抖，笔尖在纸上停住。他沉默了很久，才说：「我信你。」","paF5":"家书折了三折送到手里，纸角被人验过。母亲说家中一切都好，米价平，父亲咳疾已愈。你摸着那处被水浸糊的字迹，知道她写时在哭。","ar_pal2":"你被分到西六所最偏的院子，墙根长着青苔，冬天没有炭。送饭的宫女只把食盒放在门槛上。第二课是：不要有朋友，也不要让人记住你的脸。","sy08":"你入宫那年，掌事姑姑念了三遍你的名字，殿里所有人都跟着记住了。跪在规制森严的青砖上，你听见有人低笑。这不是好事。","ar_cy":"义体磨合到第九十三天，你才学会用左眼自行关机。楼下雨棚的霓虹把血泵滤芯照成粉色，维修师傅说记忆芯片换过三块，出厂记录是空白。第一课：别信自己记得的。","ap07":"入夜后铁皮围栏外一直有指甲刮挠的声响，铁丝上的锈屑簌簌往下掉。你抱着半罐黄豆听着，从天黑数到天亮，谁也没敢抽开门闩。","ap15":"三十来人的残部从盐碱地那头过来，军靴开裂，枪管上缠着发黑的胶布，只要会修发电机的人。你们跟了三天，鞋底磨穿，他们终究没甩掉你们。","xx07":"坊市里有人用指尖点了点你后颈，说你是凡人骨。摊主把那块下品灵石收回木匣，袖口一扫，冷声说散修莫碰，灵气都沾脏了。你攥着三枚铜钱站到日头偏西。","xx15":"古洞里的石函积了三百年的灰，你撬开时指节被划出血。半卷残经只剩十七页，第八页被虫蛀成一个洞，偏偏那页写着引气入体的顺序。","wx06":"威远镖局的老掌柜把一只火漆封口的木箱推到你面前，银锭二十两，压手。他说路上莫问箱里是什么，走完这趟，你三年不接活也饿不死。","cy03":"数据层第三区，一个没有头像的进程叫住你，报出你七岁那年弄丢的玩具名。他的声纹和你一字不差，说的每一段童年都比你自己记得更详细。","cy11":"天台的积水映着霓虹，你点第三根烟时手还在抖。两百多架送货无人机从楼群缺口掠过去，螺旋桨的声音像一整片候鸟，谁也没为它们抬头。","ds08":"全舰协议表决，十一票反对，一票赞成，那一票是你按下的。舷窗外是黑得没有星星的静默，你知道这一按，船上一百四十人的航线全要改。","in04":"你花八百积分换了一次治疗舱，蓝光扫过肋骨，断口在十五秒里合上。穿白褂的医生说这伤在现实里治不了，因为现实里没有这八百积分。","ar_ct":"第七个失眠的夜里，你数完自己的手指，确认每根都还是自己的。你没有疯，逻辑一条条对得上，正因为对得上，你才闻见海腥味从三楼窗缝里渗进来。","ct08":"你把窗帘缝、门缝、插座孔都用胶带封死，玻璃上又撒了一层盐。墙上用指甲划了个歪斜的符号。夜里翻身数到第三遍，窗框那条缝依然在，胶带的断面却是新撕的。","pa04":"你学会了装病。太医院的人来请脉，你先把袖子里藏的热姜片咬破，咳得胸口发红，咳完还低低喘了三声，连规制的帐子都没敢掀。","apA1":"老周被压在塌楼的水泥板下，你们挖了四个钟头，挖出来的只有半只鞋。那天晚上没人说话，铁皮桶里的火苗很吵，你才发现哭是没用的。","xxA1":"你第一次闭关，蒲团上坐了七日，除了石壁渗水的滴答声什么都没悟到。出关时腿麻得像别人的，扶着石门站了半炷香，才想起该去领这个月的灵石。","wxA1":"通缉画像是照着别人的脸画的，眉毛比方脸宽两指，连刀疤都画在左边。你挤到告示前喊那不是自己，浆糊里还混着昨夜的泥，围观的人只把酒碗端开，没人肯听。","cyA1":"义体在十字路口的斑马线上被人远程锁死，只剩眼球能转。广告灯箱在你左边闪了三个钟头，两百多个人从你身边绕过去，没有一根手指去按报警钮。","dsA1":"舰队协议第七版全票通过，会议室里十二个人一起鼓掌，掌声在金属舱壁上来回弹。你低头合上终端，那份方案上写着三百二十万人的静默配额。","inA1":"你第一次挂牌当队长，带四个编号新进副本，出来时只剩两个。其中一个从传送点笑到宿舍，笑到第三夜，你才问出他究竟看见了什么。","ctA1":"老搭档把自己反锁在屋里，指甲抠穿门板，刻满同一个湿漉漉的符号。你数了数，一百四十七个，每个末端都朝着海。他隔着门说别开门，声音像在水里。","paA1":"绿头牌第一次翻到你，铜牌落盘的声音比心跳还响。你紧张得把规制记错两回，事后才知道最难的只是次日天不亮就梳头，跪着走完长廊，膝盖比心更疼。","ar_ap2":"花了整整三个月，你才敢在熄灯后推开门。第一课是不要回头，脚步声若比自己的多一半，就蹲进废车壳里数到十七。巷口的锈水一直在滴。","sy01":"主神的光屏忽然多出一条只发给你的提示：余下重来次数一。别的队里那个编号七七四的新人盯着自己的空白界面，直到传送开始都没敢开口问。","sy09":"每一道闸门都在你走近时自行滑开，协议日志里查不到你的通行记录。你不必知道自己走对了没有，只要沿着舷窗外的静默往前走，脚下已经有人先铺过。","ar_ds":"你在阵列控制室守了三个月，把那串脉冲拆成七段逐位比对，最后在凌晨四点承认：它带着语法。人类或许真不是宇宙里唯一会说话的东西。","ap08":"你们在地下车库的斜坡上找到卷帘门，铁锈卡住导轨，用撬棍和半罐机油折腾了两个钟头，它才吱呀升起。这是三个月来最像好消息的声音。","ap17":"你在塌了半边的超市里翻了半天，指缝全是灰，最后在货架底下摸到半瓶水和一包过期两年的饼干。你蹲在碎玻璃上，笑出了声。","xx08":"你的剑第一次出鞘，剑气削掉半座山头，也掀了师父听雨亭的瓦。灵石碎了一地，雨后青苔上全是剑痕。师父只说了句：「罚你扫三年山门。」","xx16":"你在洗髓时看见不属于自己的记忆：白衣、断剑、九重雷劫。同门说你只是灵气走岔了。你摸着胸口那道旧疤，越看越像剑伤。","wx07":"酒里有股杏仁味，你喝到第三碗才察觉。毒发时你盘坐在客栈柴房，一口真气顶住心脉，等师弟踹开门，把解药塞进你嘴里。","cy04":"公司的人堵在你租住的隔间门口，平板里是你妹妹上学的监控画面。他们说只要删掉那三分钟数据，她还照常回家。你把接口插进了自己后颈。","ds01":"你在山里守着那口射电望远镜，白天擦反射面，夜里听宇宙的噪音。耳机里沙沙响了六年，你学会了从杂音里分辨风、鸟和卫星。","ds09":"倒计时出现在每个人的视网膜上，从四十七天开始跳。只有你能看见，别人只当你在发呆。你数着秒，发现自己那行数字比所有人少一位。","in05":"最后一关的独木桥上，他把队友推了下去，只为多分三百积分。你记住了他胸前的编号，还有他回头时那张没有表情的脸。","ct01":"你加入了一个奇怪的读书会，七个人围着一盏煤油灯，读同一本没有封面的书。纸页有海腥味，翻到第三页时，所有人同时停了下来。","ct09":"你在地下室的墙上画满符号，指甲缝里嵌着石灰。画到天亮，你退后两步，发现自己一个也不认识了，可手腕还记得下一笔往哪拐。","pa05":"贵妃赏了你一匹雨过天青的缎子，说是江南新贡。你跪下谢恩，回屋摸那层暗纹，指腹发凉，最后压在箱底，一次也没敢裁。","apA2":"你们找到一处还有电的广播站，柴油机咳了半宿才转起来。你对着麦克风喊了一整晚，嗓子哑了。第三天凌晨，电流里有人回了一句：「听见了。」","xxA2":"宗门一夜之间被抹平，灵气里全是焦味。你从后山逃出来，回头看了一眼：山门上的匾掉了半边，还挂着，风一吹就响，匾下的石阶落满黑灰。","wxA2":"你查到了真凶，是那位每年施粥、人人称颂的掌门。雨夜里你把证据塞进怀里，替他斟了杯酒，酒面晃了晃，你什么也没说，只把刀往泥里插深半寸。","cyA2":"你拆开自己的后颈护板，发现一块指甲盖大的芯片，不接神经，只接视神经。它不控制你，只是把你每天看见的一切，一帧不落地传回公司。","dsA2":"信号有了回应，不是重复的脉冲，是一句完整的话。翻译组在隔音舱里吵了一个月，最后确认那五个字：「你们还在吗。」舷窗外，星图一动不动。","inA2":"主神发布了团队对抗任务，走廊尽头的白光里站着另一支队伍。两边隔了十二米，谁都没动手，只听见彼此计分腕带的滴答声。","ctA2":"你终于看懂了那些符号，它们不是咒语，是一张地图。墨线从海岸线拐进海沟，标出一个坐标，旁边用很小的字写着：退潮时去。","paA2":"你被卷进皇嗣之争。有人提着灯笼在廊下等你，说：「站错队，比不站队死得慢一点。」灯笼灭了，你才发现自己跪了很久，膝下的金砖冰凉。","ar_xx2":"你在山门前跪了三天三夜，膝盖下的青石被体温焐热。第四天清晨，门轴响了一声，一个扫地的杂役探出头来，问你冷不冷。","sy02":"你的寿元比同门长得多，别人打坐一年，你能打坐三年。师兄们换了三轮，你还在同一块蒲团上，看着灵石一盏一盏灭下去。","sy10":"你知道接下来会发生什么，总比别人快半步。也正因如此，没人愿意和你喝酒——你总在他们开口之前，就把话替他们说完。","ap01":"停电第七天，你把最后一罐午餐肉分成三份，铁皮边缘的锈蹭在指腹上。楼下偶尔传来玻璃碎裂的声响，像很远的地方在碎牙。你发现自己的手已经不抖了，这份熟练让你从后背凉到脖子。","ap09":"两个队友为一瓶只剩半指高的水扭打起来，指甲在对方颧骨上刮出四道白痕。角落里那只铁皮水桶早空了，你听见自己的喉咙咽了一下。你靠着锈蚀的货架，把话咽回肚里，像咽下一粒沙。","xx01":"山门外的青石缝里积着薄霜，你摸出一枚旧玉简，玉面上有一道裂到边缘的细纹。里面藏着一套吐纳法，你照着练了一遍，汗把粗布衣襟泡透，灵气顺着骨头缝往上爬，连指尖都发麻。","xx09":"宗门大比，你最后一个上场，剑柄被手心的汗浸得发滑。最后一招你被震退三步，脚跟压在圈线内侧，就这么赢了。铜锣响过三声，掌门在你身上看了两息才移开眼睛。","xx17":"你在洞府里打坐，蒲团下的灵石从三块烧成一块灰白，石壁上的水汽一次次结霜又一次次化开。睁眼时石桌落了薄薄一层尘，你的胡子长了一寸，指甲卷起来，钟乳石的水珠正好砸在膝头。","wx08":"江湖上开始有人提起你的名字。镇口茶馆的说书人把你那场雨夜里的出手编成三段，一句问二两碎银。有人在你常坐的桌角放下一只空酒碗，酒没有倒，是邀你赴约的意思。","cy05":"你花了三分钟黑进整栋楼的广告牌节点，幕墙上的霓虹先闪两下，然后循环同一句话：「你们都被监视着」。楼下警灯扫上来的时候，你已经拔掉义体接口，裹紧外套混进人群走远。","ds02":"你收到一段有规律的信号，短三长二，重复了一万三千次。舷窗外什么也没有，航行日志里一片空白，协议写明不得主动回应。你把它存进离线芯片，听见生命维持系统的嗡鸣比平时快了半拍。","ds10":"你终于听懂了那段信号。它在说：「别回答」。把声纹转成文字只需按住协议界面三秒确认，你的手指悬在确认键上，舱内的橙色警示灯亮起，你听见自己的呼吸被通风口放大成风。","in06":"主神发布了惩罚任务。倒计时出现在你手腕上，白字从十五分零秒开始跳，擦不掉，用刀划开皮也是那几个数字。连接通道开始冷却，积分一栏被标成红色，队友们不约而同地往后退了半步。","ct02":"你读到一段不该读的文字，纸边第七页的行距里压着海腥味。之后三天，你听得懂风在说什么。夜里你把窗缝塞死，它仍在数你的肋骨，从上往下一共数错三次，你捂住嘴才没有出声。","ct10":"你学会了那个词。舌尖抵住上颚，第三个音要收在喉底，你练了十一次，一次也没有念出来。镜子里的自己嘴唇发白，邻居家的狗在墙外叫了整夜，你隔着窗帘缝看它，一直看到天亮。","pa06":"你身边的宫女被人买通了。你查出她袖口沾的不是本宫常用的沉水香，是东六宫那种甜得发腻的合欢香。你没有揭穿她，只是不再当着她的面说话，跪坐时身子也往旁边挪了一寸。","apA3":"尸潮来了，比你们见过的任何一次都多，地平线上的尘被踩成灰黄的浪。哨塔上的人吹了三次号，第三次只吹出半声，铜哨从他手里掉下去。你数了数弹药，十七发，然后听见铁网开始响。","xxA3":"渡劫前夜，你把所有东西都送人了。丹炉给师弟，兽皮给山下猎户，最后留在手边的，是那半块玉。玉里还剩三缕旧灵气，你用指腹抹平，推窗看了一眼外面的云，就这么坐到天明。","wxA3":"你站在了所有人的对面。风很大，把酒旗吹得贴死在旗杆上，你把刀横在身前，鞘口的泥还没干透。对面几张面孔你都认得，你没有数，忽然觉得这一战跟对错没有关系，只剩刀和风。","cyA3":"你站在数据中心的门口，手里是最后一颗脉冲。霓虹在台阶上淌成一片湿红，左臂义体的电量只剩百分之十七。你想起了自己第一次看见这座城市的样子，那时广告牌还没学会盯着人看。","dsA3":"倒计时归零的前一夜，你一个人去了观测台。暖气坏了，舷窗上结出一层白霜。星星很多，你仰头数到第七颗就不数了，把旧协议手册压在膝上，听见船壳在真空里轻轻响了一下。","inA3":"最终副本的门开了。里面是你小时候住的那条街，连门口那棵歪脖子树都一样，树下停着家里那辆掉漆的自行车，门框上钉的编号牌闪着十一位数字。空气里有煤炉味，你不敢往前走。","ctA3":"你租了一条船，一个人下了海。船长收了钱，一句话都没问，只把三桶柴油和一盏旧灯推给你。船离岸约两海里时，海面开始有节奏地起伏，像有什么东西在底下缓慢地呼吸。","paA3":"皇帝病了。整个宫里都在等，等一个人死，或者等一个人活。你开始烧香，三炷一炷地烧，香灰积在铜炉里塌成小丘。太医每进一次内殿，你就数一次脚步，跪在蒲团上听，膝盖麻了也不动。","ar_wx2":"你在山下的镇子里住了三天，才明白刀不是摆设。街口肉铺的案板下压着两把刀，酒馆里有人手肘一直搁在刀鞘上。你学着不把后背留给门口，睡觉时刀柄朝外，草席下压着三十文钱。","sy03":"你的刀法学得太快。三个月就把师父那套刀拆透了，练到第七天能听出刀风里的破绽。师父看了你一眼，把磨刀石推过来，说：「我教不了你了。」院里槐叶落了一地，无人去扫。","sy11":"那些东西不敢靠近你。它们绕着床沿走，地板上留下一圈湿脚印，走到第三圈就停住。它们说，你身上有比它们更冷的东西。窗台的盐圈已经发黑，你点了支蜡烛，焰心是蓝的。","ap02":"你撬开便利店后仓的卷帘门，锈屑簌簌落了一肩。货架底下压着三箱没鼓包的午餐肉罐头，还有一把锈死的开瓶器，你用膝盖顶了三下才撬开第一罐。油花溅到手背，你坐在碎玻璃里笑到咳嗽。","ap10":"你在三楼衣柜的羽绒服堆里摸到一个孩子，他指甲咬得只剩半截，裤脚全是干泥。你递过去半块压缩饼干，他没接，只把你的背包带攥出五道褶。此后十七天，你走快他也走快，你停他也停，始终不出声。","xx02":"你试着辟谷，头三天只喝山泉，第四天嘴唇起白皮，眼前金星乱撞。第五天清晨，丹田里忽然亮起一线极细的暖，像有人拿灯芯燎过。你摸出怀里那块下品灵石，指腹蹭着上面的裂纹，忽然不饿了。","xx10":"一个黑袍魔修盯上你，从青崖镇一直跟到北荒渡口，整整三千里。他不赶也不藏，你歇脚，他便在十丈外啃干粮，夜里篝火映着他半张脸上的旧疤。你知道他在等你灵气耗尽的那一天。","wx01":"客栈的油灯将熄，说书人压低了嗓子：这三个月，城里已有七个人死在同一种剑伤下，伤口细如发丝，血都流不出来。你捏着粗陶碗，忽然听见后厨剁案的刀声停了半拍。","wx09":"仇家踹开木门时，你正拿布擦刀。泥从他们靴底掉在青砖上，砸出七个湿印。为首那人报了十年前的旧姓，你放下刀，替他斟了碗酒，说这碗你先喝。他接碗的手抖了一下。","cy06":"你在地下诊所认识一个仿生人，颈侧接口编号磨得快看不清了。她给自己装了一段梦境固件，说梦里她有心跳、会出汗，醒来义体却是冷的。她问你这是不是故障，你听见过热风扇转了三圈。","ds03":"你把三个月的观测报告交上去，签了编号与手印。三个月后，舱门权限被悄悄收回，食堂里你端盘坐下，对面的人端起餐盘走开。广播每四小时念一次协议条款，没人再问你那晚看见了什么。","ds11":"值夜班时你泡了杯很淡的茶，茶叶沉了三次才落底。舷窗外没有星，只有黑；风撞在外壳上，像有人用指甲刮铁皮刮了一整夜。你把手贴住玻璃，那层薄冷一直渗到骨头。","in07":"副本走廊的墙上刷着编号B-77，你遇到一个左臂打成死结的男人。系统在他胸牌上标着已死三次，积分只剩个位数。他掰开你的手指说，第三次以后就不疼了，只是复活时会忘掉一个名字。","ct03":"加班到凌晨三点，你在洗手间的镜子前洗脸，镜里你的同事正冲你笑，嘴角张开的角度不太对。你猛地回头，他坐在工位上，屏幕蓝光打在脸上，嘴是平的。空气里有一丝海腥。","ct11":"你睡了很久，久到手机没电，窗帘缝里的天是均匀的灰，像一块洗旧的布。你不想起床，也想不起该想起什么。床头的水杯浮着一层灰，你却觉得这样挺好，好到不必再看表。","pa07":"有人在你妆奁里塞了一枚不属于你的白玉扣子。你在昭阳殿外的青砖上跪了一整夜，香炉里的沉水香烧尽两次。天亮时膝盖已不听使唤，裙下两块疤结了紫痂，起身得扶着廊柱。","apF1":"超市的化妆镜裂了一道，你侧过脸才照全。颧骨高出来，下颌削下去，比闹饥荒前少了二十斤，眼神硬得能刮人。你把袖子挽到肘上比了比，忽然觉得这张脸比从前好看。","xxF1":"山门前的石阶缝里，你埋了颗桃核，浇的是自己省下的半壶灵泉水。师父负手站在台阶上说这地方石多土薄，长不出东西，你嗯了一声，继续把土按实。第三年它抽了寸许的芽。","wxF1":"酒馆里，说书人一拍醒木讲起你的事，把三招说成十三招，把雪夜说成月夜，还替你添了个红颜。满堂拍桌叫好，你低头呷了口浊酒，起身多给他一块碎银，只求他别改。","cyF1":"义体店货架第三层，你认出自己换下的左手关节，漆掉了半边，却被擦得发亮。价签上写着九成新，编号还是你那串。店员拿检测笔敲了敲，说这批货上月才收，还能撑三年。","dsF1":"你在观测站的配给箱盖上养了一盆苔藓，用冷凝水一天滴三滴。它不听协议、不必签字，也不管静默期提示音，只管绿着。三个月里两个同事被调走，它新抽了两片叶。","inF1":"副本储物柜的夹层里有一张旧照片，边角发黄，上面的人你认得，站在楼道口拎着塑料袋。你把系统名册翻了三遍，编号里没有他。他手腕上那只表，你今早才见过。","ctF1":"你在旧图书馆查到第三卷，页边全是别人的铅笔批注。管理员走过来，指尖点在书脊上说这本不存在，随后合上书抱进怀里，走进书架深处。你跟过去，那排书架后是一堵刷白的墙。","paF1":"你学会了看人下菜碟。见高位者要笑到眉眼弯，见奉茶宫女要半垂着眼，见失势的旧主得绕道，装作没看见。哪一等该跪、该笑、该低头，你心里有本账，连谢恩的声调都分了三档。","ar_cy2":"你花了三个月才敢直视镜子。义眼对焦慢半拍，镜里那张脸换过七个部件，眉眼陌生，光一暗就泛出金属的冷。最难捱的是他不眨眼——你眨眼时，他反而睁得更久。","sy04":"你的血让实验室那台旧仪器发疯。第三次被咬是在地下车库，牙印留在小臂上，四小时后只结了痂，淋巴结没肿。老周抽了你半管血，贴上标签，编号后头画了个红叉。","sy12":"三个通宵，你从十二万行核心代码里拎出三处死循环。第六日，你把接口接进自己的旧义体，一行行推着跑通，茶杯在桌上留下四个圆印。工程师盯着日志看了半天，说这不可能。","ap03":"你被编进一支七人小队，队长姓王，左手少两指，退伍前是侦察兵。他用罐头铁皮磨的刀刮胡子，刀口带着锈味。每天出楼前他敲三下水管，声音落地，你们才动。","ap11":"无线电在凌晨四点沙沙响，一个女声念出北纬三十四度、东经一一二的坐标，一天三遍，从不咳嗽。你们数到第九天，把最后两罐豆子装进背包，沿着积尘的国道往西走。","xx03":"后山第三道石阶下，你拨开湿苔，露出一眼只有碗口大的灵泉，水面浮着细碎白光。你捧起一口咽下，灵气顺着脊骨往上爬，后背像被三昧真火烙过，一直烫到半夜。","xx11":"你在洞府里坐了三年零四个月，靠三十六块下品灵石撑着，指甲长出两寸。出关那日，山门牌匾由玄铁换成鎏金，守门弟子换了三批，认得你的只剩两个烧火的老杂役。","wx02":"你拜进只有九个人的小门派，师父让你在泥地里扎马步，一扎半年，膝盖陷出两个坑。他拿竹刀背敲你腿弯，敲一下骂一句，你恨得咬牙。后来你下山，刀没抖过，才知道那半年是命。","wx10":"你爬上雁回峰顶时天还没亮，刀鞘上结了一层泥壳。日头从云海里滚出来，把整片松林染成铜色，你听见自己喘气的声音。二十年的血忽然轻得像肩上落的酒渍，你解下刀，坐到晌午。","cy07":"你调出义体接口的日志，上周三凌晨两点有一段被涂成灰色的空白。可你记得那晚在霓虹巷口吃过一碗合成面，摊主缺一颗门牙。数据里没有这条巷子，你的舌头还留着碱水味。","ds04":"你签下静默计划第七号协议，编号贴在锁骨下方，像一枚冰冷的铆钉。植入体每十二小时抹一次情绪日志，舷窗外是恒定的黑。三个月后你望着自己的手，想不起上一次生气是为了什么。","ar_inf":"副本结算的绿灯亮起，四千二百积分打进腕环，队友冲去换枪械和强化剂。你在兑换台前站了很久，最后点了一卷九块积分的止血绷带，纱布边缘还带着消毒水味。你把它塞进内袋，贴着心口。","in08":"第三副本的通关     { label: '不去，守着家', e: { mood: 1, home: -1 }, out: '你拒绝了。机会给了别人，你在原来的位置上又待了五年。' }
  ] },

  { id: 'c14', a: [35, 40], key: 1, q: '年终奖到账那天，手机弹出一串数字。妻子问这笔钱打算怎么用，房产中介的短信还躺在收件箱里，你把手机翻过去，屏幕又亮了。', opts: [
    { label: '全部投进股市', f: function (s) {
        if (rnd() < 0.4) return { t: '你赶上了一轮行情，账户里的数字翻了几倍。你开始觉得自己有点东西。', e: { home: 5, mood: 3 } };
        return { t: '你追高杀跌，最后割在了地板上。你把软件卸了，半年没敢打开。', e: { home: -4, mood: -2 } };
      }, hint: '结果未知，可能翻倍也可能腰斩' },
    { label: '买稳健理财', e: { home: 1, mood: 1 }, out: '你买了理财，收益不高但睡得着觉。几年后你发现，这已经赢过很多人。' },
    { label: '给自己报个班，学点东西', e: { int: 2, home: -1 }, out: '你报了一个很贵的课，学了一门新技能。它后来真的派上了用场。' }
  ] },

  /* —— 中年 —— */
  { id: 'c15', a: [38, 45], key: 1, c: function (s) { return s.children >= 1; }, q: '晚上七点，成绩单压在茶几上，班主任的语音还在手机里响：中下游。妻子把一叠补习班价目表推到你面前，孩子躲在门后不敢出声。', opts: [
    { label: '鸡娃，报满补习班', m: -1, e: { home: -2, mood: -1 }, out: '你把孩子的周末排满了。他很争气，考上了重点，也很久没有对你笑过。' },
    { label: '放养，顺其自然', m: 1, e: { mood: 2 }, out: '你签了字，没多说什么。孩子后来没考上名校，但每年父亲节都会给你打电话。' }
  ] },

  { id: 'c16', a: [42, 50], key: 1, q: '医生把片子夹上灯箱，说这病得有人长期守着。护士催你签字，公司电话在口袋里震个不停，哥哥说他那边实在走不开。', opts: [
    { label: '辞职回家照顾', m: 3, e: { mood: 2, home: -3 }, out: '你辞了职，在病房陪了两年。钱少了很多，但那两年你没有遗憾。' },
    { label: '请护工，自己继续上班', m: 1, e: { home: -2, mood: -1 }, out: '你请了最好的护工，每天下班去医院坐一小时。你尽力了，也总觉得自己不够。' },
    { label: '让兄弟姐妹多担待', m: -3, e: { mood: -3, home: 1 }, out: '你把大部分事交给了兄弟姐妹。家庭群里安静了很久，有些账再也算不清。' }
  ] },

  { id: 'c17', a: [45, 52], key: 1, q: '清晨的镜子蒙着一层雾，你抹开一块，看见鬓角的白发和眼下的深沟。楼下广场的音乐已经响了，而你还站着没动。', opts: [
    { label: '去学一门新东西', e: { int: 2, mood: 1 }, out: '你开始学一门和过去二十年毫无关系的技能。同学都比你小二十岁，但你是最认真的那个。' },
    { label: '躺平，接受现状', e: { mood: 2, home: -1 }, out: '你不再折腾，把精力放在三餐和睡眠上。日子平淡，但你睡得着。' },
    { label: '开始跑步', e: { con: 3, mood: 1 }, out: '你从三公里跑到半马。体检报告上的箭头少了，你觉得自己还能再战十年。' }
  ] },

  { id: 'c18', a: [52, 58], key: 1, c: function (s) { return !s.flags.retired; }, q: '人事把表格放在你桌上，说月底前签字，过了就当放弃。窗外梧桐落了一地，你算着工龄，笔尖在姓名栏上停了很久。', opts: [
    { label: '退，把时间还给自己', f: function (s) {
        s.flags.retired = true;
        return { t: '你办了手续。走出大门那天，天特别蓝，你在门口站了很久，不知道该往哪走。', e: { mood: 3, home: -2 } };
      }, hint: '快乐 +3 · 家境 -2' },
    { label: '不退，再干几年', e: { home: 2, con: -2 }, out: '你留了下来。工资照发，头发照掉，你打算干到干不动为止。' }
  ] },

  /* —— 老年 —— */
  { id: 'c19', a: [60, 68], key: 1, q: '社区活动室里挤满了熟脸，白大褂举着瓶子说这药能延年。散场时不让走，工作人员堵在门口登记，隔壁张姨已经掏出了钱包。', opts: [
    { label: '买两盒试试', e: { home: -2, mood: 1 }, out: '你花了几千块，吃了半年。没什么用，但每天有个年轻人上门叫你"叔叔阿姨"，你挺受用。' },
    { label: '不买，去医院做个体检', e: { con: 1, int: 1, home: -1 }, out: '你去了医院，查出一个小问题，及时处理了。医生说，你来得正是时候。' }
  ] },

  { id: 'c20', a: [68, 78], key: 1, c: function (s) { return s.children >= 1; }, q: '病房的窗开着一条缝，晚风把药味吹散。护工收拾完床头柜，律师把三页纸铺在床沿，钢笔的笔帽咔哒一响。儿子们在走廊里低声说话。', opts: [
    { label: '平分给孩子们', m: 1, e: { mood: 1 }, out: '你把财产平分，写进遗嘱。孩子们嘴上说不在意，眼神都变了。' },
    { label: '给最孝顺的那个', m: -1, e: { mood: 2 }, out: '你把大部分留给了照顾你最多的那个孩子。其他人后来很少再上门。' },
    { label: '大半捐出去', m: 3, e: { mood: 3, home: -4 }, out: '你把大部分钱捐给了母校和山区的孩子。有人说你傻，你说钱带不走。' }
  ] },

  /* —— 随机困境（低频） —— */
  { id: 'c21', a: [16, 70], q: '傍晚的公交站只剩你一人，长椅缝里卡着只鼓鼓的皮钱包，扣子绷开，露出半截身份证。末班车还有四分钟，站台摄像头正对着这里。', opts: [
    { label: '交给警察', m: 1, e: { mood: 2 }, out: '你把它交到了派出所。失主后来找到你，塞给你两百块，你没收。' },
    { label: '装进兜里', m: -1, e: { home: 1, mood: -1 }, out: '你把钱包塞进包里，一路上心跳得厉害。钱花了很久，那种感觉也留了很久。' }
  ] },

  { id: 'c22', a: [22, 60], q: '凌晨两点，项目群还在响。组长发了句「这个坑谁埋的」，没人接话。有人点了你的名字，附上截图，会议室玻璃后面，三双眼睛正看过来。', opts: [
    { label: '当众把聊天记录甩出来', e: { mood: 1, home: -1 }, out: '你甩出了证据，他当场哑火。你赢了这一局，也从此被贴上"不好相处"的标签。' },
    { label: '认了，回头再算', m: 1, e: { mood: -2, home: 1 }, out: '你只回了一句"我来改"。领导记住了你的担当，你也记住了这笔账。' }
  ] },

  { id: 'c23', a: [20, 65], q: '夜里十一点半，一个三年没动静的头像亮起来，先问你还记得吗，然后说家里出了事，下个月一定还。手机那头有小孩在哭。', opts: [
    { label: '借给他', m: 1, f: function (s) {
        if (rnd() < 0.45) return { t: '半年后他把钱还了，还多给了利息。你们的交情反而更铁了。', e: { mood: 2 } };
        return { t: '钱转过去之后，他的头像再也没亮过。你拉黑了他，也拉黑了当年的自己。', e: { home: -2, mood: -2 } };
      }, hint: '结果未知' },
    { label: '找个理由推掉', e: { mood: -1 }, out: '你说最近手头也紧。他回了句"没事"，然后你们又沉默了三年。' }
  ] },

  { id: 'c24', a: [15, 75], q: '晚高峰的地铁口，一个中年男人突然倒在台阶上，人群围成一圈。有人喊别碰他，救护车说至少十分钟，手机已经举起来对着你。', opts: [
    { label: '冲上去做急救', m: 2, e: { con: -1, mood: 3 }, out: '你跪在地上按压了八分钟，直到救护车来。后来你才知道，他活下来了。' },
    { label: '打 120，然后走', e: { mood: 1 }, out: '你打了电话，报了位置，然后赶去上班。你做了一件正确的事，仅此而已。' },
    { label: '拍视频发到网上', m: -2, e: { mood: -2, home: 1 }, out: '视频火了，你涨了不少粉。评论区有人问："你为什么不上去帮忙？"' }
  ] }
,

  { id: 'w_ap1', line: 'apocalypse', a: [0, 120], key: 1, c: function (s) { return s.lineAge >= 4; },
    q: '雪停了，粮袋见底，只够分十份。新来的那个靠在车门上咳了一整夜，咳声像破了的口哨。老周把勺子递给你，说你来分。',
    opts: [
      { label: '把口粮分给他', m: 2, e: { mood: 2, home: -1 }, out: '你分了一半给他。他吃得很慢，吃完说了句谢谢，声音很小。' },
      { label: '什么也不给', m: -3, e: { home: 1, mood: -2 }, out: '你转过身，假装在擦枪。第二天早上，他不在了，没有人问起。' },
      { label: '让他离开队伍', m: -2, e: { con: 1, mood: -1 }, out: '你把他的包递过去，指了指东边。他看了你很久，然后走了。' }
    ] },

  { id: 'w_xx1', line: 'xiuxian', a: [0, 120], key: 1, c: function (s) { return s.lineAge >= 5; },
    q: '师兄蹲在剑冢边，指着崖下那条雾道，说三年前他就从那儿出来的。他笑着拍你肩，手上的疤还是上次留下的。',
    opts: [
      { label: '走师兄那条捷径', m: -3, f: function (s) {
          if (rnd() < 0.5) return { t: '秘境深处，你们找到一株万年灵草。他这次没有抢，还分了你一半。', e: { int: 3, home: 2 } };
          return { t: '最后一刻，他把洞口封了。你花了三天才爬出来，少了一身修为，也没再见过他。', e: { con: -2, int: -1 } };
        }, hint: '结果未知' },
      { label: '不去，自己修炼', m: 1, e: { int: 2, mood: 1 }, out: '你留在洞府里，把那半卷残经又读了一遍。有些东西，慢一点反而更快。' }
    ] }
,
  { id: 'w_wx1', line: 'wuxia', a: [0, 120], key: 1, c: function (s) { return s.lineAge >= 4; },
    q: '巷子窄得两人错不开身，雨刚停，青砖还滑。对面七个人，刀背在掌心拍得啪啪响。领头那位蹲下来，把脸凑近：跪不跪，就一句话。',
    opts: [
      { label: '跪下', e: { mood: -2, home: 1, con: 1 }, out: '你跪了。膝盖磕在石板上，声音很响。他看了你一会儿，转身走了。你活下来了。' },
      { label: '拔刀', f: function (s) {
          if (rnd() < 0.55) return { t: '你拔刀了。三十招之后他还站着，你也没有倒下——他先收了刀。', e: { con: 1, mood: 3 } };
          return { t: '你拔刀了。刀很快，你的动作慢了半拍，这一慢就是一辈子。', e: { con: -2, mood: -1 } };
        }, hint: '结果未知' },
      { label: '转身就跑', e: { mood: -1, int: 1 }, out: '你转身就跑，跑过三条街，跑进人堆里。江湖上没人记得你，你活得比他们都久。' }
    ] },

  { id: 'w_cy1', line: 'cyber', a: [0, 120], key: 1, c: function (s) { return s.lineAge >= 4; },
    q: '会议室的白灯有些晃眼，合同摊在你面前，第七页写着：三年记忆，作价一笔安家费。对面的人把笔转了一圈，说，今天签，明天到账。',
    opts: [
      { label: '签了', m: -3, e: { home: 4, mood: -3 }, out: '你签了。钱到账很快。你盯着那笔钱看了一晚上，想不起来自己为什么要哭。' },
      { label: '不签', m: 1, e: { mood: 2, home: -1 }, out: '你把合同推了回去。对面的人笑了笑，说：你会后悔的。你后来确实后悔过，但没后悔这一件。' }
    ] },

  { id: 'w_ds1', line: 'deepspace', a: [0, 120], key: 1, c: function (s) { return s.lineAge >= 4; },
    q: '深夜控制室只亮着应急红灯，按钮嵌在台面中央，旁边一张字条：「按下去，人类就听见了」。屏幕上波纹一涨一落，门外脚步声越来越近。',
    opts: [
      { label: '按下去', m: 1, e: { mood: 2, con: -1 }, out: '你按了下去。什么都没有发生，但那一晚所有射电望远镜的读数都乱了一秒。' },
      { label: '不按', m: -3, e: { int: 2, mood: -1 }, out: '你把手收了回来。你告诉自己这是理性，其实你只是害怕。' }
    ] }
,
  { id: 'w_inf1', line: 'infinite', a: [0, 120], key: 1, c: function (s) { return s.lineAge >= 4; },
    q: '手里的兑换券只剩最后一张，边角被汗浸软。广播在倒数三十秒，队友靠在墙上，呼吸越来越轻。工作人员把登记板推到你面前，笔尖悬着。',
    opts: [
      { label: '换自己活下去', m: -2, e: { con: 2, mood: -1 }, out: '你换了最贵的那份治疗。走出兑换室的时候，你没有回头看那个还躺在担架上的人。' },
      { label: '换队友的命', m: 2, e: { mood: 3, con: -1 }, out: '你把券用了。队友活了下来，问你为什么。你说：下次记得还我。' }
    ] },

  { id: 'w_ct1', line: 'cthulhu', a: [0, 120], key: 1, c: function (s) { return s.lineAge >= 4; },
    q: '台灯只照亮那一页，纸边发脆，那个词压在纸纹里，像有人早就写好了。风把窗吹开一条缝，你听见楼下有人上楼。',
    opts: [
      { label: '念出那个词', m: -3, f: function (s) {
          if (rnd() < 0.5) return { t: '你念了。房间里的空气轻轻让开一条路。那一刻你懂了所有事，也再没能睡好。', e: { int: 4, mood: 2 } };
          return { t: '你念了。然后有很长一段时间，你记不起自己叫什么。', e: { mood: -4, con: -2 } };
        }, hint: '结果未知，可能开悟也可能发疯' },
      { label: '把它烧了', m: 1, e: { mood: 2, int: -1 }, out: '你把书扔进了铁桶。火烧了很久，纸灰里有一些东西在动，你没有去看。' }
    ] },

  { id: 'w_pal1', line: 'palace', a: [0, 120], key: 1, c: function (s) { return s.lineAge >= 4; },
    q: '贵妃的旧信和一枚男式玉佩压在你箱底。明日册封大典，她就要站在皇后身边。管事姑姑今早还问过你近来可不安分。',
    opts: [
      { label: '当着众人的面揭发', e: { home: 2, mood: -1, con: -1 }, out: '你在殿上把证据呈了上去。贵妃倒了，你也成了所有人眼里那个"不能惹的人"。' },
      { label: '烧掉', m: 2, e: { mood: 2 }, out: '你把那几张纸烧了。灰落在雪里，看不出痕迹。你活得比她们都久。' },
      { label: '拿它去换好处', m: -3, e: { home: 3, mood: -2 }, out: '你没有揭发，只是让她知道了你知道。从此你的月例多了一倍，也再无一日安睡。' }
    ] }
,
  { id: 'w_ap2', line: 'apocalypse', a: [0, 120], key: 1, c: function (s) { return s.lineAge >= 3; },
    q: '凌晨三点，铁门被敲了三下。门外男人的声音很平，说他知道一个绝对安全的地方，只是得把你车上剩下的东西全交给他。',
    opts: [
      { label: '跟他走', f: function (s) {
          if (rnd() < 0.55) return { t: '他带你们走了两天两夜，真的有一道墙、一口井、一间能锁门的屋子。', e: { home: 3, mood: 2 } };
          return { t: '第三天早上他不见了，连你们的车一起。你站在空地上，第一次想杀人。', e: { home: -2, con: -1, mood: -2 } };
        }, hint: '结果未知' },
      { label: '不开门', m: -1, e: { mood: -1, con: 1 }, out: '你隔着门说这里没有多余的东西。他敲了很久，然后走了。' }
    ] },

  { id: 'w_xx2', line: 'xiuxian', a: [0, 120], key: 1, c: function (s) { return s.lineAge >= 3; },
    q: '山门的雪化了，师父把行囊递过来，里头是三枚丹药和一张路引。他说山下的规矩，你得自己去碰一碰。',
    opts: [
      { label: '去人间走一趟', e: { charm: 2, mood: 2, int: -1 }, out: '你在人间待了一年。你见过饥荒、见过婚礼、见过有人为了一文钱跪下来。回山时你话少了。' },
      { label: '留在山里修行', e: { int: 2, mood: -1 }, out: '你没有下山。山里的日子很慢，慢到你能听见自己心跳的节奏。' }
    ] },

  { id: 'w_wx2', line: 'wuxia', a: [0, 120], key: 1, c: function (s) { return s.lineAge >= 3; },
    q: '半夜，客栈后门的灯笼晃着。中间人把银票一张张码在桌上，压低了嗓子：一千两，他上任三年，没贪过一文。手边就是刀。',
    opts: [
      { label: '接了', m: -3, e: { home: 3, mood: -3 }, out: '你杀了。银子很重，压得你半年没睡好。' },
      { label: '不接，还去报了官', m: 2, f: function (s) {
          if (rnd() < 0.5) return { t: '你报了官。官府查了三个月，查到你身上。', e: { mood: -2, home: -1 } };
          return { t: '你报了官。那人被拿下了，知府亲自给你倒了杯茶。', e: { mood: 3, home: 1 } };
        }, hint: '结果未知' },
      { label: '不接，走人', e: { mood: 1, home: -1 }, out: '你连茶都没喝就走了。江湖上说你傻，你觉得自己只是还睡得着。' }
    ] },

  { id: 'w_cy2', line: 'cyber', a: [0, 120], key: 1, c: function (s) { return s.lineAge >= 3; },
    q: '柜台后的人推来一张单子，你的备份锁在第十二号柜，赎回价一年翻一倍。屏幕倒计时还剩四十七天，她敲敲玻璃：过期就清空。',
    opts: [
      { label: '赎回来', e: { home: -3, mood: 2 }, out: '你把钱付了。拿到备份那天你哭了一场，为的是你还记得自己为什么哭。' },
      { label: '不要了', m: -1, e: { mood: -2, int: 1 }, out: '你不要了。从此你的记忆只有一条，坏了就没了。你反而活得更用力。' }
    ] },

      var m = STAT_META[k];

    store('life_pity', s.line ? 0 : ((parseInt(load('life_pity') || '0', 10) || 0) + 1));

    var prevAch = [];
    try { prevAch = JSON.parse(load('life_achs') || '[]') || []; } catch (e) { prevAch = []; }
    for (var ai = 0; ai < r.achs.length; ai++) { if (prevAch.indexOf(r.achs[ai].n) < 0) prevAch.push(r.achs[ai].n); }
    store('life_achs', JSON.stringify(prevAch));
    var logStore = [];
    try { logStore = JSON.parse(load('life_logs') || '[]') || []; } catch (e) { logStore = []; }
    logStore.unshift({ t: st.finishT, log: st.lifeLog || [] });
    store('life_logs', JSON.stringify(logStore.slice(0, 3)));
    if (s.endingName) {
      var prevEnd = [];
      try { prevEnd = JSON.parse(load('life_endings') || '[]') || []; } catch (e) { prevEnd = []; }
      if (prevEnd.indexOf(s.endingName) < 0) { prevEnd.push(s.endingName); store('life_endings', JSON.stringify(prevEnd)); }
    }

    st.finishT = Date.now();
    var hist = loadHistory();
    hist.unshift({
      t: st.finishT, name: s.name, g: s.gender, age: s.age, score: r.score,
      rank: r.rank.n, cause: causeLabel, line: s.line || '',
      ach: r.achs.map(function (a) { return a.n; })
    });
    saveHistory(hist);
    updateMeta();

    st.lastResult = { s: s, r: r, cause: causeLabel };
    html += '<div class="end-links">' +
      '<button class="link-btn" id="endCopyBtn">复制这一生</button>' +
      '<button class="link-btn" id="endHistBtn">查看历史回顾</button>' +
      '</div>';
    $('endBox').innerHTML = html;
    var eh = $('endHistBtn');
    if (eh) eh.addEventListener('click', function () { openHistory('end'); });
    var ec = $('endCopyBtn');
    if (ec) ec.addEventListener('click', copyLife);

    show('end');
    $('endBox').scrollTop = 0;
  }

  /* ---------- 事件绑定 ---------- */
  $('btnNew').addEventListener('click', function () { startTalent(); });

  $('btnReroll').addEventListener('click', function () {
    if (st.reroll <= 0) { toast('没有重抽机会了'); return; }
    st.reroll--;
    $('rerollLeft').textContent = st.reroll;
    if (st.reroll <= 0) $('btnReroll').disabled = true;
    st.drawn = drawTalents();
    st.picked = [];
    $('btnTalentOk').disabled = true;
    renderTalents();
    toast('已重新抽取');
  });

  $('btnTalentOk').addEventListener('click', function () {
    if (st.picked.length !== 3) return;
    startAlloc();
  });

  $('allocList').addEventListener('click', function (e) {
    var btn = e.target.closest ? e.target.closest('.step') : null;
    if (!btn) return;
    var k = btn.dataset.k;
    var d = parseInt(btn.dataset.d, 10);
    var left = TOTAL_POINTS - allocUsed();
    if (d > 0) {
      if (left <= 0 || st.alloc[k] >= 10) return;
      st.alloc[k]++;
    } else {
      if (st.alloc[k] <= 0) return;
      st.alloc[k]--;
    }
    updateAlloc();
  });

  $('btnRandom').addEventListener('click', function () {
    st.alloc = { charm: 0, int: 0, con: 0, home: 0 };
    var left = TOTAL_POINTS;
    var guard = 0;
    while (left > 0 && guard++ < 500) {
      var k = ALLOC_KEYS[Math.floor(Math.random() * ALLOC_KEYS.length)];
      if (st.alloc[k] >= 10) continue;
      st.alloc[k]++;
      left--;
    }
    updateAlloc();
  });

  $('btnBegin').addEventListener('click', function () {
    if (allocUsed() !== TOTAL_POINTS) return;
    beginLife();
  });


  $('btnSkip').addEventListener('click', function () { skipAll(); });
  $('btnNext').addEventListener('click', function () { stepYear(); });

  function copyLife() {
    var lr = st.lastResult;
    if (!lr) return;
    var s = lr.s, r = lr.r;
    var txt = '【人生模拟器】\n' +
      '享年 ' + s.age + ' 岁（' + lr.cause + '）\n' +
      '评分：' + r.score + ' · ' + r.rank.n + '\n' +
      '天赋：' + s.talents.map(function (t) { return t.n; }).join('、') + '\n' +
      '成就：' + (r.achs.length ? r.achs.map(function (a) { return a.n; }).join('、') : '无');
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(txt).then(function () { toast('已复制到剪贴板'); },
        function () { toast('复制失败，请手动选择文字'); });
    } else {
      toast('当前浏览器不支持复制');
    }
  }
  $('btnAgain').addEventListener('click', function () { startTalent(); });


  /* ---------- 启动 ---------- */
  function initProfile() {
    var nm = randomName();
    $('nameInput').value = nm;
    st.profile.name = nm;
  }
  $('btnDice').addEventListener('click', function () {
    var nm = randomName();
    $('nameInput').value = nm;
    st.profile.name = nm;
  });
  $('nameInput').addEventListener('input', function () {
    st.profile.name = $('nameInput').value;
  });
  $('genderSeg').addEventListener('click', function (e) {
    var b = e.target.closest ? e.target.closest('.seg-btn') : null;
    if (!b) return;
    st.profile.gender = b.dataset.g;
    var all = document.querySelectorAll('.seg-btn');
    for (var i = 0; i < all.length; i++) all[i].classList.toggle('on', all[i] === b);
  });
  $('btnHistory').addEventListener('click', function () { openHistory('title'); });
  $('btnHistBack').addEventListener('click', function () { show(st.histBack || 'title'); });
  $('btnHistNew').addEventListener('click', function () { startTalent(); });
  $('btnAchv').addEventListener('click', function () { renderAchv(); show('achv'); });
  $('btnAchvBack').addEventListener('click', function () { show('title'); });
  $('btnDaily').addEventListener('click', function () { startDaily(); });
  $('btnSound').addEventListener('click', function () {
    SOUND_ON = !SOUND_ON;
    store('life_sound', SOUND_ON ? '1' : '0');
    this.textContent = '音效 ' + (SOUND_ON ? '开' : '关');
    if (SOUND_ON) beep(660, 0.12, 'sine', 0.05);
  });
  $('tabAch').addEventListener('click', function () { COLL_TAB = 'ach'; renderAchv(); });
  $('tabEnd').addEventListener('click', function () { COLL_TAB = 'end'; renderAchv(); });
  $('btnReview').addEventListener('click', function () { st.reviewBack = null; renderReview(); show('review'); });
  $('btnReviewBack').addEventListener('click', function () {
    show(st.reviewBack === 'history' ? 'history' : 'end');
    st.reviewBack = null;
  });
  $('btnReviewTop').addEventListener('click', function () { $('reviewBody').scrollTop = 0; });
  $('btnReviewAgain').addEventListener('click', function () { startTalent(); });
  $('btnTalBack').addEventListener('click', function () { updateMeta(); show('title'); });
  $('btnAllocBack').addEventListener('click', function () { show('talent'); });
  $('btnHome').addEventListener('click', function () { updateMeta(); show('title'); });
  var exitTimer = null;
  $('btnExit').addEventListener('click', function () {
    var b = this;
    if (b.classList.contains('confirm')) {
      clearTimeout(exitTimer);
      exitToTitle();
      return;
    }
    b.classList.add('confirm');
    b.textContent = '确定？';
    clearTimeout(exitTimer);
    exitTimer = setTimeout(function () {
      b.classList.remove('confirm');
      b.textContent = '退出';
    }, 2600);
  });
  initProfile();
  updateMeta();
  show('title');
})();
</script>
<script>
(function () {
  if (location.protocol === 'file:') return;
  if (!('serviceWorker' in navigator)) return;
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  });
})();
</script>
</body>
